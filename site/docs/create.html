<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vellote Docs | Create Post</title>
<link rel="icon" type="image/png" href="/site/html/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #ff0073; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: #050204; color: #d1d1d1;
  font-family: 'Poppins', sans-serif;
  height: 100vh; overflow: hidden;
  animation: fadeIn 0.35s ease forwards;
  display: flex; flex-direction: column;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; background-position: center; z-index: -5; }
.bg-grid {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);
  background-size: 50px 50px;
  mask-image: radial-gradient(circle at center,black 30%,transparent 80%);
  -webkit-mask-image: radial-gradient(circle at center,black 30%,transparent 80%);
  z-index: -4;
}
.blob { position: fixed; border-radius: 50%; filter: blur(150px); opacity: 0.08; animation: floatBlob 20s infinite alternate cubic-bezier(0.4,0,0.2,1); z-index: -3; }
.blob-1 { top:-10%; left:-10%; width:50vw; height:50vw; background: radial-gradient(circle,var(--primary),transparent 70%); }
.blob-2 { bottom:-10%; right:-10%; width:60vw; height:60vw; background: radial-gradient(circle,var(--primary),transparent 70%); animation-delay:-5s; }
@keyframes floatBlob { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(10%,10%) scale(1.1)} }
.bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 120px at var(--x,50%) var(--y,50%),rgba(255,255,255,0.05) 0%,transparent 100%); z-index: -2; pointer-events: none; }

/* ── TOPBAR ── */
.topbar {
  flex-shrink: 0; height: 52px;
  background: rgba(15,10,13,0.6); backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; padding: 0 28px; gap: 8px;
  position: relative; z-index: 10;
}
.topbar-logo { font-size: 11px; font-weight: 800; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-right: 24px; }
.topbar-nav { display: flex; align-items: center; gap: 2px; flex: 1; justify-content: center; }
.topbar-link { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.35); text-decoration: none; padding: 6px 12px; border-radius: 8px; transition: color 0.2s, background 0.2s; cursor: pointer; border: none; background: none; font-family: 'Poppins',sans-serif; }
.topbar-link:hover { color: white; background: rgba(255,255,255,0.05); }
.topbar-link.active-nav { color: rgba(255,145,207,0.8); }
.topbar-sep { color: rgba(255,255,255,0.15); font-size: 12px; margin: 0 2px; }
.topbar-amp { color: rgba(255,255,255,0.15); font-size: 11px; margin: 0 4px; }
.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: 24px; }
.btn-go { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 7px 18px; border-radius: 8px; border: 1px solid rgba(255,0,115,0.35); background: rgba(255,0,115,0.08); color: var(--primary); cursor: pointer; transition: all 0.2s; text-decoration: none; }
.btn-go:hover { background: var(--primary); color: white; }
.search-wrap { display: flex; align-items: center; gap: 8px; background: rgba(15,10,13,0.6); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 6px 12px; }
.search-wrap:focus-within { border-color: rgba(255,0,115,0.3); }
.search-input { background: none; border: none; outline: none; font-family: 'Poppins',sans-serif; font-size: 11px; color: rgba(255,255,255,0.7); width: 130px; }
.search-input::placeholder { color: rgba(255,255,255,0.2); }
.search-icon { color: rgba(255,255,255,0.2); font-size: 15px; }
.user-chip { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: rgba(255,145,207,0.8); text-transform: uppercase; }

/* ── LAYOUT ── */
.editor-layout {
  flex: 1; display: grid;
  grid-template-columns: 320px 1fr 160px;
  min-height: 0;
  position: relative; z-index: 2;
  border-top: none;
}

/* ── LEFT — превью карточки ── */
.col-preview {
  border-right: 1px solid rgba(255,255,255,0.05);
  display: flex; flex-direction: column;
  overflow: hidden;
}

/* Превью как реальная карточка */
.preview-card {
  background: rgba(15,10,13,0.5);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 12px; margin: 16px; overflow: hidden;
  display: flex; flex-direction: column;
  flex-shrink: 0;
}
.preview-card-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px 8px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.preview-author {
  font-size: 9px; font-weight: 700; letter-spacing: 1px;
  color: rgba(255,145,207,0.7); text-transform: uppercase;
}
.preview-img-wrap {
  position: relative; width: 100%; aspect-ratio: 4/3;
  background: rgba(255,255,255,0.03);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; overflow: hidden;
}
.preview-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: none; }
.preview-img-wrap img.loaded { display: block; }
.upload-label {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  cursor: pointer; user-select: none;
}
.upload-icon { font-size: 22px; opacity: 0.2; }
.upload-text {
  font-size: 9px; font-weight: 800; letter-spacing: 2px;
  text-transform: uppercase; color: rgba(255,255,255,0.2);
}
#imgInput { display: none; }
.preview-img-wrap:hover .upload-label { opacity: 0.7; }

.preview-name-input {
  background: none; border: none; outline: none;
  font-family: 'Poppins',sans-serif; font-size: 11px; font-weight: 700;
  color: rgba(255,255,255,0.6); padding: 10px 12px 4px;
  width: 100%;
}
.preview-name-input::placeholder { color: rgba(255,255,255,0.2); }
.preview-desc-input {
  background: none; border: none; outline: none; resize: none;
  font-family: 'Poppins',sans-serif; font-size: 10px;
  color: rgba(255,255,255,0.35); padding: 0 12px 10px;
  width: 100%; min-height: 40px; line-height: 1.5;
}
.preview-desc-input::placeholder { color: rgba(255,255,255,0.15); }

/* Кнопка публикации */
.publish-area {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.05);
  display: flex; flex-direction: column; gap: 8px;
  margin-top: auto;
}
.publish-btn {
  width: 100%; padding: 11px; border-radius: 8px;
  border: 1px solid rgba(255,0,115,0.35);
  background: rgba(255,0,115,0.08); color: var(--primary);
  font-family: 'Poppins',sans-serif; font-size: 10px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  cursor: pointer; transition: all 0.2s;
}
.publish-btn:hover { background: var(--primary); color: white; }
.publish-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.publish-msg {
  font-size: 10px; font-weight: 600; text-align: center;
  color: rgba(255,145,207,0.8); min-height: 14px;
}
.publish-msg.err { color: rgba(248,113,113,0.8); }
.publish-msg.ok { color: rgba(74,222,128,0.8); }

/* ── CENTER — текстовый редактор ── */
.col-editor {
  display: flex; flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.05);
}
.editor-toolbar {
  flex-shrink: 0; padding: 8px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; gap: 6px;
  flex-wrap: wrap;
}
.tb-btn {
  font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 5px;
  border: 1px solid rgba(255,255,255,0.08); background: none;
  color: rgba(255,255,255,0.35); cursor: pointer; transition: all 0.15s;
  font-family: 'Poppins',sans-serif;
}
.tb-btn:hover { color: white; border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.04); }
.tb-sep { width: 1px; height: 14px; background: rgba(255,255,255,0.07); margin: 0 2px; }
.editor-textarea {
  flex: 1; background: transparent; border: none; outline: none; resize: none;
  font-family: 'Poppins',sans-serif; font-size: 12px; line-height: 1.8;
  color: rgba(255,255,255,0.7); padding: 20px 24px;
}
.editor-textarea::placeholder { color: rgba(255,255,255,0.12); }

/* ── RIGHT — comments (пустой) ── */
.col-right {
  display: flex; flex-direction: column; padding: 16px 14px;
}
.col-right-label {
  font-size: 9px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(255,255,255,0.12);
  margin-bottom: 12px;
}
.col-right-hint {
  font-size: 9px; color: rgba(255,255,255,0.1); line-height: 1.6;
  letter-spacing: 0.5px;
}

/* ── BOTTOM NAV ── */

</style>
</head>
<body>
<div class="bg-base"></div>
<div class="bg-grid"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="bg-glow"></div>

<!-- TOPBAR -->
<nav class="topbar">
  <a href="/docs" class="topbar-logo">Docs Home</a>
  <div class="topbar-nav">
    <button class="topbar-link" onclick="window.location.href='/auth'">Login</button>
    <span class="topbar-sep">\</span>
    <button class="topbar-link" onclick="window.location.href='/auth'">Register</button>
    <span class="topbar-amp">&amp;</span>
    <button class="topbar-link active-nav">Create</button>
    <span class="user-chip" id="user-chip" style="display:none"></span>
  </div>
  <div class="topbar-right">
    <a href="/docs" class="btn-go">Go</a>
    <div class="search-wrap">
      <input class="search-input" placeholder="Search...">
      <span class="search-icon">⌕</span>
    </div>
  </div>
</nav>

<!-- EDITOR -->
<div class="editor-layout">

  <!-- LEFT: превью + поля -->
  <div class="col-preview">
    <div class="preview-card">
      <!-- Автор -->
      <div class="preview-card-top">
        <span class="preview-author" id="previewAuthor">—</span>
        <input type="text" id="field-name" class="preview-name-input" placeholder="Enter post name.." oninput="updatePreview()" style="flex:1;text-align:right;padding:0 0 0 8px">
      </div>

      <!-- Картинка -->
      <div class="preview-img-wrap" id="imgWrap">
        <img id="previewImg" src="" alt="">
        <div class="upload-label" id="uploadLabel">
          <span class="upload-icon">⬆</span>
          <span class="upload-text">Upload Image</span>
        </div>
      </div>
      <input type="file" id="imgInput" accept="image/*" onchange="handleImg(this)" style="display:none">
      <button onclick="document.getElementById('imgInput').click()" style="width:100%;background:none;border:none;border-top:1px solid rgba(255,255,255,0.05);padding:8px;font-family:Poppins,sans-serif;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.2);cursor:pointer;" onmouseover="this.style.color='rgba(255,255,255,0.5)'" onmouseout="this.style.color='rgba(255,255,255,0.2)'">Upload Image</button>

      <!-- Описание -->
      <textarea id="field-desc" class="preview-desc-input" placeholder="Enter post description.." rows="2" oninput="updatePreview()"></textarea>
    </div>

    <!-- Публикация -->
    <div class="publish-area">
      <button class="publish-btn" id="publishBtn" onclick="doPublish()">Publish Post</button>
      <div class="publish-msg" id="publishMsg"></div>
    </div>
  </div>

  <!-- CENTER: редактор -->
  <div class="col-editor">
    <div class="editor-toolbar">
      <button class="tb-btn" onclick="wrap('**','**')"><b>B</b></button>
      <button class="tb-btn" onclick="wrap('*','*')"><i>I</i></button>
      <button class="tb-btn" onclick="wrap('__','__')"><u>U</u></button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="insertLine('# ')">H1</button>
      <button class="tb-btn" onclick="insertLine('## ')">H2</button>
      <button class="tb-btn" onclick="insertLine('### ')">H3</button>
      <button class="tb-btn" onclick="insertLine('-# ')">sm</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="insertLine('> ')">❝</button>
      <button class="tb-btn" onclick="wrap('`','`')">code</button>
      <button class="tb-btn" onclick="wrap('\`\`\`\n','\n\`\`\`')">```</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="insertLine('* ')">• list</button>
      <button class="tb-btn" onclick="wrap('||','||')">spoiler</button>
      <button class="tb-btn" onclick="insertLink()">[link]</button>
    </div>
    <textarea class="editor-textarea" id="field-text" placeholder="Enter Post Text...&#10;&#10;Use toolbar or type markdown:&#10;**bold**  *italic*  __underline__&#10;# Heading  ## Subheading&#10;> quote&#10;\`code\`  \`\`\`block\`\`\`&#10;* list item&#10;||spoiler||&#10;[text](url)"></textarea>
  </div>

  <!-- RIGHT: comments placeholder -->
  <div class="col-right">
    <div class="col-right-label">Comments</div>
    <div class="col-right-hint">Comments will appear here after publishing.</div>
  </div>

</div>



<script>
window.addEventListener('mousemove', e => {
  document.body.style.setProperty('--x', e.clientX + 'px');
  document.body.style.setProperty('--y', e.clientY + 'px');
});

// ── SESSION ──
let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('nq-docs-user') || 'null'); } catch(e) {}

if (!currentUser) {
  // Не залогинен — редиректим на auth
  window.location.href = '/auth';
} else {
  document.getElementById('previewAuthor').textContent = currentUser.username;
  document.getElementById('user-chip').style.display = '';
  document.getElementById('user-chip').textContent = currentUser.username;
}

function updatePreview() {
  // Просто живое обновление полей в превью — уже связано через id
}

// ── ИЗОБРАЖЕНИЕ ──
let imgBase64 = null;
function handleImg(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) {
    setMsg('Image too large (max 3MB)', 'err'); return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    imgBase64 = e.target.result;
    const img = document.getElementById('previewImg');
    img.src = imgBase64;
    img.classList.add('loaded');
    document.getElementById('uploadLabel').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

// ── TOOLBAR ──
function getTA() { return document.getElementById('field-text'); }

function wrap(before, after) {
  const ta = getTA();
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.slice(start, end);
  const replacement = before + (sel || 'text') + after;
  ta.setRangeText(replacement, start, end, 'end');
  ta.focus();
  if (!sel) {
    ta.selectionStart = start + before.length;
    ta.selectionEnd = start + before.length + 4;
  }
}

function insertLine(prefix) {
  const ta = getTA();
  const start = ta.selectionStart;
  const before = ta.value.slice(0, start);
  const lineStart = before.lastIndexOf('\n') + 1;
  ta.setRangeText(prefix, lineStart, lineStart, 'start');
  ta.focus();
}

function insertLink() {
  const ta = getTA();
  const start = ta.selectionStart, end = ta.selectionEnd;
  const sel = ta.value.slice(start, end) || 'text';
  const replacement = `[${sel}](url)`;
  ta.setRangeText(replacement, start, end, 'end');
  ta.focus();
}

// ── PUBLISH ──
function setMsg(text, type) {
  const el = document.getElementById('publishMsg');
  el.textContent = text;
  el.className = 'publish-msg' + (type ? ' ' + type : '');
}

async function doPublish() {
  const name = document.getElementById('field-name').value.trim();
  const desc = document.getElementById('field-desc').value.trim();
  const text = document.getElementById('field-text').value.trim();

  if (!name) { setMsg('Enter post name', 'err'); return; }
  if (!desc) { setMsg('Enter post description', 'err'); return; }
  if (!text) { setMsg('Enter post text', 'err'); return; }
  if (!currentUser) { window.location.href = '/auth'; return; }

  const btn = document.getElementById('publishBtn');
  btn.disabled = true;
  setMsg('Publishing...', '');

  try {
    const r = await fetch('/api/docs/universal?action=create', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        username: currentUser.username,
        token: currentUser.token || '',
        name, desc, text,
        img: imgBase64 || null
      })
    });
    const d = await r.json();
    if (d.ok) {
      setMsg('Published!', 'ok');
      setTimeout(() => { window.location.href = `/post/${encodeURIComponent(d.id)}`; }, 800);
    } else {
      setMsg(d.error || 'Error', 'err');
      btn.disabled = false;
    }
  } catch(e) {
    setMsg('Network error', 'err');
    btn.disabled = false;
  }
}
</script>
</body>
</html>
