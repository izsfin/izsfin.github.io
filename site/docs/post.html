<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekoq Docs | Post</title>
<link rel="icon" type="image/png" href="/site/html/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { 
        --primary: #ff0073; 
        --bg-dark: #050204;
        --card-bg: rgba(15, 10, 13, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-dark); color: #d1d1d1; font-family: 'Poppins', sans-serif; min-height: 100vh; overflow-x: hidden; animation: fadeIn 0.35s ease forwards; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* ── ФОН ── */
    .bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; z-index: -5; }
    .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px); background-size: 50px 50px; mask-image: radial-gradient(circle at center,black 30%,transparent 80%); -webkit-mask-image: radial-gradient(circle at center,black 30%,transparent 80%); z-index: -4; }
    .blob { position: fixed; border-radius: 50%; filter: blur(150px); opacity: 0.08; animation: floatBlob 20s infinite alternate ease-in-out; z-index: -3; pointer-events: none; }
    .blob-1 { top:-10%; left:-10%; width:50vw; height:50vw; background: radial-gradient(circle,var(--primary),transparent 70%); }
    .blob-2 { bottom:-10%; right:-10%; width:60vw; height:60vw; background: radial-gradient(circle,var(--primary),transparent 70%); animation-delay:-5s; }
    @keyframes floatBlob { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(10%,10%) scale(1.1)} }
    .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 120px at var(--x,50%) var(--y,50%),rgba(255,255,255,0.05) 0%,transparent 100%); z-index: -2; pointer-events: none; }

    /* ── TOPBAR ── */
    .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 52px; background: rgba(15,10,13,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; padding: 0 28px; }
    .topbar-logo { font-size: 11px; font-weight: 800; color: white; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; flex: 1; }
    .topbar-right { flex: 1; display: flex; justify-content: flex-end; }
    .btn-back { font-size: 10px; font-weight: 700; padding: 7px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: none; color: rgba(255,255,255,0.4); text-decoration: none; }

    /* ── MAIN ── */
    .main { padding: 90px 24px 150px; max-width: 1000px; margin: 0 auto; position: relative; z-index: 2; }

    /* ── POST ── */
    .post-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 40px; position: relative; }
    .post-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .post-author { color: var(--primary); }
    .post-title { font-size: 32px; font-weight: 800; color: white; margin-bottom: 8px; }
    .post-desc { font-size: 14px; color: rgba(255,255,255,0.4); margin-bottom: 35px; }
    .post-flex { display: flex; gap: 40px; align-items: flex-start; }
    .post-text { flex: 1; font-size: 13px; line-height: 1.8; color: rgba(255,255,255,0.6); }
    .post-img-side { width: 300px; flex-shrink: 0; }
    .post-preview { width: 100%; aspect-ratio: 1/1; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .post-preview img { width: 100%; height: 100%; object-fit: cover; }

    /* ── COMMENTS ── */
    .comments-wrap { margin-top: 40px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); }
    .comment-item { margin-bottom: 15px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 12px; transition: 0.2s; border: 1px solid transparent; }
    .comment-item:hover { border-color: rgba(255,0,115,0.2); }
    .comment-author { color: var(--primary); font-size: 11px; font-weight: 700; }
    .comment-text { font-size: 13px; margin-top: 5px; color: rgba(255,255,255,0.7); }

    /* ── CONTEXT MENU (ИЗ КАТАЛОГА) ── */
    .ctx-menu { position: fixed; z-index: 999; background: rgba(15,10,12,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,0,115,0.2); border-radius: 10px; padding: 6px; min-width: 150px; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .ctx-item { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 700; padding: 9px 14px; border-radius: 7px; cursor: pointer; color: rgba(255,255,255,0.6); transition: all 0.15s; display: flex; align-items: center; gap: 10px; }
    .ctx-item:hover { background: rgba(255,0,115,0.15); color: white; }
    .ctx-item.danger:hover { background: rgba(255,0,0,0.15); color: #ff4d4d; }

    /* ── UI ── */
    .bottom-nav { position: fixed; bottom: 25px; left: 25px; background: rgba(15, 10, 13, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 10px 20px; display: flex; gap: 20px; z-index: 10; }
    .nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.4); text-decoration: none; }
</style>
</head>
<body>
    <div class="bg-base"></div><div class="bg-grid"></div><div class="blob blob-1"></div><div class="blob blob-2"></div><div id="glow" class="bg-glow"></div>

    <nav class="topbar">
        <a href="/" class="topbar-logo">Docs Home</a>
        <div class="topbar-right"><a href="/" class="btn-back">← Back</a></div>
    </nav>

    <div class="main">
        <div id="postArea" class="post-target" data-type="post">
            </div>

        <div class="comments-wrap">
            <div id="commentList"></div>
        </div>
    </div>

    <div class="ctx-menu" id="ctxMenu">
        <div class="ctx-item" onclick="handleEdit()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Edit
        </div>
        <div class="ctx-item danger" onclick="handleDelete()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Delete
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/catalog" class="nav-link">Catalog</a>
        <a href="/discord" class="nav-link" target="_blank">Discord</a>
    </nav>

<script>
window.addEventListener('mousemove', e => {
    document.body.style.setProperty('--x', e.clientX+'px');
    document.body.style.setProperty('--y', e.clientY+'px');
});

let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('nq-docs-user')||'null'); } catch(e){}

function getPostId() {
    const m = window.location.pathname.match(/\/post\/(.+)/);
    return m ? decodeURIComponent(m[1]) : null;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Твой парсер маркдауна
function parseText(raw) {
    if (!raw) return '';
    let s = String(raw);
    s=s.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${esc(c.trim())}</code></pre>`);
    s=s.replace(/`([^`]+)`/g,(_,c)=>`<code>${esc(c)}</code>`);
    s=s.replace(/^#([^\n]+)/gm,(_,t)=>`<h1>${t.trim()}</h1>`);
    s=s.replace(/\*\*(.+?)\*\*/g,(_,t)=>`<strong>${t}</strong>`);
    s=s.replace(/\n{2,}/g,'</p><p>');
    s=s.replace(/\n/g,'<br>');
    return `<p>${s}</p>`.replace(/<p>\s*<\/p>/g,'');
}

async function loadPost() {
    const id = getPostId();
    if (!id) { document.getElementById('postArea').innerHTML='Post not found'; return; }
    
    try {
        const r = await fetch(`/api/docs/universal?action=post&id=${encodeURIComponent(id)}`);
        const d = await r.json();
        if (!d.ok || !d.post) { document.getElementById('postArea').innerHTML='Post not found'; return; }
        
        const p = d.post;
        document.title = `${p.PostName} — Nekoq Docs`;
        
        // ВСТАВЛЯЕМ В НОВУЮ СТРУКТУРУ (FRAME 175)
        document.getElementById('postArea').innerHTML = `
            <div class="post-card">
                <div class="post-meta">
                    <span class="post-author">${esc(p.Author)}</span>
                    <span class="post-sep">|</span>
                    <span class="post-date">${p.Date||'2026'}</span>
                </div>
                <div class="post-title">${esc(p.PostName)}</div>
                <div class="post-desc">${esc(p.PostDesc)}</div>
                
                <div class="post-flex">
                    <div class="post-text">
                        ${parseText(p.PostText)}
                    </div>
                    <div class="post-img-side">
                        <div class="post-preview">
                            ${p.PostImg ? `<img src="${p.PostImg}" alt="">` : `<span class="no-preview">no preview</span>`}
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        loadComments(id);
        loadOtherPosts(p.Author, id);
    } catch(e) {
        document.getElementById('postArea').innerHTML='Failed to load';
    }
}

async function loadComments(postId) {
    try {
        const r = await fetch(`/api/docs/universal?action=comments&id=${encodeURIComponent(postId)}`);
        const d = await r.json();
        const list = document.getElementById('commentList');
        const items = d.comments || [];
        if (!items.length) { list.innerHTML = '<div style="opacity:0.3; font-size:12px">No comments yet.</div>'; return; }
        
        list.innerHTML = items.map(c => `
            <div class="comment-item">
                <div><span class="comment-author">${esc(c.author)}</span><span class="comment-date">${c.date||''}</span></div>
                <div class="comment-text">${esc(c.text)}</div>
            </div>
        `).join('');
    } catch(e){}
}

async function sendComment(){
    const text = document.getElementById('commentText').value.trim();
    if(!text) return;
    const postId = getPostId();
    const body = {postId, text};
    if(currentUser) { body.username = currentUser.username; body.token = currentUser.token; }
    
    try {
        const r = await fetch('/api/docs/universal?action=comment', {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
        });
        const d = await r.json();
        if(d.ok) { 
            document.getElementById('commentText').value=''; 
            loadComments(postId); 
        }
    } catch(e){}
}

async function loadOtherPosts(author, currentId) {
    try {
        const r = await fetch('/api/docs/universal?action=posts&fresh=1');
        const d = await r.json();
        const posts = (d.posts || []).filter(p => p.id !== currentId).slice(0, 6);
        
        if (posts.length > 0) {
            document.getElementById('otherSection').style.display = 'block';
            document.getElementById('otherScroll').innerHTML = posts.map(p => `
                <a class="mini-card" href="/post/${encodeURIComponent(p.id)}">
                    <div class="mini-preview">
                        ${p.img ? `<img src="${p.img}">` : '<span class="no-preview">no image</span>'}
                    </div>
                    <div class="mini-body">
                        <div class="mini-title">${esc(p.name)}</div>
                        <div class="mini-author">${esc(p.author)}</div>
                    </div>
                </a>
            `).join('');
        }
    } catch(e){}
}

loadPost();
</script>
</body>
</html>
