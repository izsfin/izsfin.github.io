<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekoq Docs</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #ff0073; --bg: #0a0a0a; --card-bg: #111111; --inner-bg: #161616; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--bg); color: #d1d1d1; font-family: 'Poppins', sans-serif; min-height: 100vh; overflow-x: hidden; }

/* ── TOPBAR ── */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 52px; background: rgba(10,10,10,0.8); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.03); display: flex; align-items: center; padding: 0 28px; }
.topbar-logo { font-size: 11px; font-weight: 800; color: white; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; flex: 1; }
.topbar-nav { display: flex; align-items: center; gap: 10px; flex: 2; justify-content: center; }
.topbar-link { font-size: 10px; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.4); border: none; background: none; cursor: pointer; font-family: inherit; }
.topbar-right { flex: 1; display: flex; justify-content: flex-end; }
.btn-back { font-size: 10px; font-weight: 700; padding: 6px 14px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: none; color: rgba(255,255,255,0.5); text-decoration: none; }

/* ── MAIN CONTAINER ── */
.main { padding: 80px 24px 120px; max-width: 1000px; margin: 0 auto; }

/* ── POST STYLE (Frame 175) ── */
.post-card { background: var(--card-bg); border-radius: 16px; padding: 32px; border: 1px solid rgba(255,255,255,0.03); }
.post-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
.post-author { color: var(--primary); letter-spacing: 1px; }
.post-sep { color: rgba(255,255,255,0.1); }
.post-date { color: rgba(255,255,255,0.2); }

.post-title { font-size: 28px; font-weight: 800; color: white; margin-bottom: 6px; }
.post-desc { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 30px; }

/* Двухколоночный контент */
.post-content-layout { display: flex; gap: 40px; }
.post-text-side { flex: 1; color: rgba(255,255,255,0.5); line-height: 1.8; font-size: 13px; }

.post-img-side { width: 280px; flex-shrink: 0; }
.post-preview-box { width: 100%; aspect-ratio: 1/1; background: var(--inner-bg); border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.02); }
.post-preview-box img { width: 100%; height: 100%; object-fit: cover; }
.no-preview-text { font-size: 10px; color: rgba(255,255,255,0.1); text-transform: lowercase; font-weight: 600; }

/* ── COMMENTS ── */
.comments-section { margin-top: 40px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 30px; }
.section-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
.comment-form { display: flex; gap: 12px; align-items: flex-end; }
.comment-input { flex: 1; background: var(--inner-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 14px; color: white; font-family: inherit; font-size: 12px; outline: none; resize: none; }
.comment-send { background: none; border: 1px solid var(--primary); color: var(--primary); padding: 12px 24px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
.comment-send:hover { background: var(--primary); color: white; }

/* ── OTHER POSTS ── */
.other-posts { margin-top: 50px; }
.other-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 10px; align-items: center; }
.mini-card { width: 200px; flex-shrink: 0; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; text-decoration: none; transition: 0.2s; }
.mini-card:hover { transform: translateY(-4px); border-color: var(--primary); }
.mini-prev { height: 100px; background: var(--inner-bg); display: flex; align-items: center; justify-content: center; }
.mini-body { padding: 12px; background: #181818; }
.mini-title { font-size: 11px; font-weight: 700; color: #eee; margin-bottom: 2px; }
.mini-author { font-size: 9px; font-weight: 700; color: var(--primary); text-transform: uppercase; }

/* ── BOTTOM NAV ── */
.bottom-nav { position: fixed; bottom: 25px; left: 25px; background: #161616; border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 20px; display: flex; gap: 20px; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
.nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.4); text-decoration: none; }
.nav-link:hover { color: white; }

.bottom-credit { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 9px; color: rgba(255,255,255,0.15); text-transform: uppercase; letter-spacing: 1px; }

/* Skeleton placeholder lines */
.line { height: 8px; background: rgba(255,255,255,0.04); border-radius: 4px; margin-bottom: 12px; width: 100%; }
.line.short { width: 60%; }
.line.mid { width: 85%; }
</style>
</head>
<body>

<nav class="topbar">
    <a href="/" class="topbar-logo">Docs Home</a>
    <div class="topbar-nav">
        <button class="topbar-link">Login</button>
        <span style="color:rgba(255,255,255,0.1)">\</span>
        <button class="topbar-link">Register & Create</button>
    </div>
    <div class="topbar-right">
        <a href="/" class="btn-back">← Back</a>
    </div>
</nav>

<div class="main">
    <div id="postArea">
        <div class="post-card">
            <div class="post-meta">
                <span class="post-author">0XSQUAD</span>
                <span class="post-sep">|</span>
                <span class="post-date">21.03.2026</span>
            </div>
            <div class="post-title">Post title here</div>
            <div class="post-desc">Short description of the post goes here.</div>
            
            <div class="post-content-layout">
                <div class="post-text-side">
                    <div class="line"></div><div class="line"></div><div class="line mid"></div><div class="line"></div>
                    <div class="line short"></div><div class="line"></div><div class="line mid"></div><div class="line"></div>
                    <div class="line"></div><div class="line mid"></div><div class="line"></div><div class="line short"></div>
                </div>
                <div class="post-img-side">
                    <div class="post-preview-box">
                        <span class="no-preview-text">no preview</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="comments-section">
        <div class="section-label">Comments</div>
        <div class="comment-form">
            <textarea class="comment-input" placeholder="Leave a comment..." rows="1"></textarea>
            <button class="comment-send">Send →</button>
        </div>
    </div>

    <div class="other-posts">
        <div class="section-label">Other Posts</div>
        <div class="other-scroll">
            <a href="#" class="mini-card">
                <div class="mini-prev"></div>
                <div class="mini-body">
                    <div class="mini-title">Post name</div>
                    <div class="mini-author">Author</div>
                </div>
            </a>
            <a href="#" class="mini-card">
                <div class="mini-prev"></div>
                <div class="mini-body">
                    <div class="mini-title">Post name</div>
                    <div class="mini-author">Author</div>
                </div>
            </a>
            <div style="color:rgba(255,255,255,0.2); margin-left:10px;">→</div>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="/" class="nav-link">Home</a>
    <a href="/catalog" class="nav-link">Catalog</a>
    <a href="/obfuscator" class="nav-link">Obfuscator</a>
    <a href="/auth" class="nav-link">Authentication</a>
    <a href="/status" class="nav-link">Status</a>
    <a href="/discord" class="nav-link">Discord</a>
</nav>

<div class="bottom-credit">© 2026 Nekoq. All rights reserved.</div>

<script>
window.addEventListener('mousemove', e => {
  document.body.style.setProperty('--x', e.clientX+'px');
  document.body.style.setProperty('--y', e.clientY+'px');
});

let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('nq-docs-user')||'null'); } catch(e){}
if (currentUser) {
  document.getElementById('btn-login').style.display='none';
  document.getElementById('btn-register').style.display='none';
  document.getElementById('btn-create').style.display='';
  document.getElementById('user-chip').style.display='';
  document.getElementById('user-chip').textContent=currentUser.username;
}

function getPostId() {
  const m = window.location.pathname.match(/\/post\/(.+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function parseText(raw) {
  if (!raw) return '';
  let s = String(raw);
  s = s.replace(/\|\|(.+?)\|\|/gs,(_,t)=>{
    const id='sp'+Math.random().toString(36).slice(2);
    return `<div class="spoiler-wrap"><button class="spoiler-toggle" onclick="toggleSpoiler('${id}')"><span class="spoiler-icon">▶</span> Spoiler</button><div class="spoiler-content" id="${id}">${t.trim()}</div></div>`;
  });
  s=s.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${esc(c.trim())}</code></pre>`);
  s=s.replace(/`([^`]+)`/g,(_,c)=>`<code>${esc(c)}</code>`);
  s=s.replace(/^###([^\n]+)/gm,(_,t)=>`<h3>${t.trim()}</h3>`);
  s=s.replace(/^##([^\n]+)/gm,(_,t)=>`<h2>${t.trim()}</h2>`);
  s=s.replace(/^#-([^\n]+)/gm,(_,t)=>`<h4>${t.trim()}</h4>`);
  s=s.replace(/^#([^\n]+)/gm,(_,t)=>`<h1>${t.trim()}</h1>`);
  s=s.replace(/^>{1,3}([^\n]+)/gm,(_,t)=>`<blockquote>${t.trim()}</blockquote>`);
  s=s.replace(/\*\*(.+?)\*\*/g,(_,t)=>`<strong>${t}</strong>`);
  s=s.replace(/\*(.+?)\*/g,(_,t)=>`<em>${t}</em>`);
  s=s.replace(/__(.+?)__/g,(_,t)=>`<u>${t}</u>`);
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,(_,t,u)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  s=s.replace(/^(\s*)[*\-] (.+)/gm,(_,ind,item)=>`<li style="margin-left:${ind.length*12}px">${item}</li>`);
  s=s.replace(/(<li[\s\S]*?<\/li>)+/g,m=>`<ul>${m}</ul>`);
  s=s.replace(/\n{2,}/g,'</p><p>');
  s=s.replace(/\n/g,'<br>');
  s=`<p>${s}</p>`;
  s=s.replace(/<p>\s*<\/p>/g,'');
  return s;
}

function toggleSpoiler(id){
  const c=document.getElementById(id);
  c.classList.toggle('open');
  c.previousElementSibling.classList.toggle('open');
}

async function loadPost() {
  const id = getPostId();
  if (!id) { document.getElementById('postArea').innerHTML='<div class="loading">Post not found</div>'; return; }
  try {
    const r = await fetch(`/api/docs/universal?action=post&id=${encodeURIComponent(id)}`);
    const d = await r.json();
    if (!d.ok||!d.post) { document.getElementById('postArea').innerHTML='<div class="loading">Post not found</div>'; return; }
    const p = d.post;
    document.title = `${p.PostName} — Nekoq Docs`;
    document.getElementById('postArea').innerHTML=`
      <div class="post-meta">
        <span class="post-author">${esc(p.Author)}</span>
        <span class="post-date">${p.Date||''}</span>
      </div>
      <div class="post-title">${esc(p.PostName)}</div>
      <div class="post-desc">${esc(p.PostDesc)}</div>
      <div class="post-img">
        ${p.PostImg?`<img src="${p.PostImg}" alt="">`:`<div class="post-img-placeholder">No preview</div>`}
      </div>
      <div class="post-text">${parseText(p.PostText)}</div>
    `;
    document.getElementById('divComments').style.display='';
    document.getElementById('commentsSection').style.display='';
    loadComments(id);
    loadOtherPosts(p.Author, id);
  } catch(e) {
    document.getElementById('postArea').innerHTML='<div class="loading">Failed to load</div>';
  }
}

async function loadComments(postId) {
  try {
    const r=await fetch(`/api/docs/universal?action=comments&id=${encodeURIComponent(postId)}`);
    const d=await r.json();
    const list=document.getElementById('commentList');
    const comments=d.comments||[];
    if (!comments.length){list.innerHTML='<div class="no-comments">No comments yet</div>';return;}
    list.innerHTML=comments.map(c=>`
      <div class="comment-item">
        <div class="comment-top"><span class="comment-author">${esc(c.author)}</span><span class="comment-date">${c.date||''}</span></div>
        <div class="comment-text">${esc(c.text)}</div>
      </div>`).join('');
  } catch(e){}
}

async function sendComment(){
  const text=document.getElementById('commentText').value.trim();
  const msg=document.getElementById('commentMsg');
  if(!text){msg.textContent='Write something';return;}
  msg.textContent='Sending...';
  const postId=getPostId();
  const body={postId,text};
  if(currentUser){body.username=currentUser.username;body.token=currentUser.token||'';}
  try{
    const r=await fetch('/api/docs/universal?action=comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(d.ok){document.getElementById('commentText').value='';msg.textContent='Sent!';await loadComments(postId);setTimeout(()=>{msg.textContent='';},2000);}
    else msg.textContent=d.error||'Error';
  }catch(e){msg.textContent='Network error';}
}

async function loadOtherPosts(author,currentId){
  try{
    const r=await fetch('/api/docs/universal?action=posts&fresh=1');
    const d=await r.json();
    const posts=(d.posts||[]).filter(p=>p.id!==currentId);
    if(!posts.length)return;
    document.getElementById('divOther').style.display='';
    document.getElementById('otherSection').style.display='';
    document.getElementById('otherScroll').innerHTML=posts.map(p=>`
      <a class="mini-card" href="/post/${encodeURIComponent(p.id)}">
        <div class="mini-preview">${p.img?`<img src="${p.img}" alt="">`:`<span class="mini-no-prev">No preview</span>`}</div>
        <div class="mini-body">
          <div class="mini-title">${esc(p.name)}</div>
          <div class="mini-author">${esc(p.author)}</div>
          <div class="mini-desc">${esc(p.desc)}</div>
        </div>
      </a>`).join('');
  }catch(e){}
}

loadPost();
</script>
</body>
</html>
