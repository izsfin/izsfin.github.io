<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekoq Docs | Loading...</title>
<link rel="icon" type="image/png" href="/site/html/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
    :root { 
        --primary: #ff0073; 
        --bg-dark: #050204;
        --card-bg: rgba(15, 10, 13, 0.6);
        --inner-bg: rgba(255, 255, 255, 0.03);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--bg-dark); color: #d1d1d1; font-family: 'Poppins', sans-serif; min-height: 100vh; overflow-x: hidden; animation: fadeIn 0.35s ease forwards; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    /* ── BACKGROUND ── */
    .bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; z-index: -5; }
    .bg-grid { position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px); background-size: 50px 50px; mask-image: radial-gradient(circle at center,black 30%,transparent 80%); -webkit-mask-image: radial-gradient(circle at center,black 30%,transparent 80%); z-index: -4; }
    .blob { position: fixed; border-radius: 50%; filter: blur(150px); opacity: 0.08; animation: floatBlob 20s infinite alternate cubic-bezier(0.4,0,0.2,1); z-index: -3; pointer-events: none; }
    .blob-1 { top:-10%; left:-10%; width:50vw; height:50vw; background: radial-gradient(circle,var(--primary),transparent 70%); }
    .blob-2 { bottom:-10%; right:-10%; width:60vw; height:60vw; background: radial-gradient(circle,var(--primary),transparent 70%); animation-delay:-5s; }
    @keyframes floatBlob { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(10%,10%) scale(1.1)} }
    .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 120px at var(--x,50%) var(--y,50%),rgba(255,255,255,0.05) 0%,transparent 100%); z-index: -2; pointer-events: none; }

    /* ── TOPBAR ── */
    .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 52px; background: rgba(15,10,13,0.7); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; padding: 0 28px; }
    .topbar-logo { font-size: 11px; font-weight: 800; color: white; letter-spacing: 2px; text-transform: uppercase; text-decoration: none; flex: 1; }
    .topbar-nav { display: flex; align-items: center; gap: 10px; flex: 2; justify-content: center; }
    .topbar-link { font-size: 10px; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.3); border: none; background: none; cursor: pointer; text-decoration: none; transition: 0.2s; }
    .topbar-link:hover { color: white; }
    .topbar-right { flex: 1; display: flex; justify-content: flex-end; }
    .btn-back { font-size: 10px; font-weight: 700; padding: 7px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: none; color: rgba(255,255,255,0.4); text-decoration: none; }

    /* ── MAIN CONTENT ── */
    .main { padding: 90px 24px 150px; max-width: 1000px; margin: 0 auto; position: relative; z-index: 2; }

    /* ── POST CARD ── */
    .post-card { background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 40px; }
    .post-meta { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .post-author { color: var(--primary); }
    .post-sep { color: rgba(255,255,255,0.1); }
    .post-date { color: rgba(255,255,255,0.25); }
    .post-title { font-size: 32px; font-weight: 800; color: white; line-height: 1.2; margin-bottom: 8px; }
    .post-desc { font-size: 14px; color: rgba(255,255,255,0.4); margin-bottom: 35px; max-width: 600px; }

    .post-flex { display: flex; gap: 40px; align-items: flex-start; }
    .post-text { flex: 1; font-size: 13px; line-height: 1.8; color: rgba(255,255,255,0.6); }
    .post-text h1, .post-text h2 { color: white; margin: 20px 0 10px; }
    .post-text pre { background: #111; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 15px 0; border: 1px solid #222; }
    
    .post-img-side { width: 300px; flex-shrink: 0; }
    .post-preview { width: 100%; aspect-ratio: 1/1; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 4px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .post-preview img { width: 100%; height: 100%; object-fit: cover; }
    .no-preview { font-size: 10px; color: rgba(255,255,255,0.1); text-transform: lowercase; }

    /* ── COMMENTS ── */
    .comments-wrap { margin-top: 40px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.05); }
    .section-label { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.2); margin-bottom: 20px; }
    .comment-box { display: flex; gap: 15px; margin-bottom: 30px; }
    .comment-input { flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; padding: 15px; color: white; font-family: inherit; outline: none; }
    .comment-btn { border: 1px solid var(--primary); background: none; color: var(--primary); padding: 0 30px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .comment-item { margin-bottom: 20px; background: rgba(255,255,255,0.02); padding: 15px; border-radius: 10px; }
    .comment-author { color: var(--primary); font-size: 11px; font-weight: 700; margin-right: 10px; }
    .comment-date { font-size: 10px; color: rgba(255,255,255,0.2); }
    .comment-text { font-size: 13px; margin-top: 5px; color: rgba(255,255,255,0.7); }

    /* ── OTHER POSTS ── */
    .other-posts { margin-top: 50px; }
    .other-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 15px; }
    .mini-card { width: 220px; flex-shrink: 0; background: rgba(15,10,13,0.8); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; text-decoration: none; overflow: hidden; transition: 0.2s; }
    .mini-card:hover { border-color: var(--primary); transform: translateY(-3px); }
    .mini-preview { height: 110px; background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .mini-preview img { width: 100%; height: 100%; object-fit: cover; }
    .mini-body { padding: 12px; }
    .mini-title { font-size: 12px; font-weight: 700; color: white; margin-bottom: 2px; }
    .mini-author { font-size: 10px; font-weight: 700; color: var(--primary); text-transform: uppercase; }

    /* ── NAVIGATION ── */
    .bottom-nav { position: fixed; bottom: 25px; left: 25px; background: rgba(15, 10, 13, 0.5); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 10px 20px; display: flex; gap: 20px; z-index: 10; align-items: center; }
    .nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; color: rgba(255,255,255,0.4); text-decoration: none; }
    .nav-link:hover { color: white; }
    .bottom-credit { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 10px; color: rgba(255,255,255,0.15); font-weight: 700; text-transform: uppercase; z-index: 10; }
</style>
</head>
<body>
    <div class="bg-base"></div><div class="bg-grid"></div><div class="blob blob-1"></div><div class="blob blob-2"></div><div id="glow" class="bg-glow"></div>

    <nav class="topbar">
        <a href="/" class="topbar-logo">Docs Home</a>
        <div class="topbar-nav" id="authNav">
            <a href="/login" class="topbar-link">Login</a>
            <span style="color:rgba(255,255,255,0.1)">\</span>
            <a href="/register" class="topbar-link">Register & Create</a>
        </div>
        <div class="topbar-right"><a href="/" class="btn-back">← Back</a></div>
    </nav>

    <div class="main">
        <div id="postArea">
            <div style="opacity: 0.2">Loading post...</div>
        </div>

        <div class="comments-wrap">
            <div class="section-label">Comments</div>
            <div class="comment-box">
                <textarea id="commentText" class="comment-input" placeholder="Leave a comment..." rows="1"></textarea>
                <button onclick="sendComment()" class="comment-btn">Send →</button>
            </div>
            <div id="commentMsg" style="font-size: 10px; margin-bottom: 10px;"></div>
            <div id="commentList"></div>
        </div>

        <div class="other-posts" id="otherSection" style="display:none">
            <div class="section-label">Other Posts</div>
            <div class="other-scroll" id="otherScroll"></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/catalog" class="nav-link">Catalog</a>
        <a href="/obfuscator" class="nav-link">Obfuscator</a>
        <a href="/getkey" class="nav-link">Authentication</a>
        <a href="/discord" class="nav-link" target="_blank">Discord</a>
    </nav>

    <div class="bottom-credit">0xSquad © 2026</div>

<script>
window.addEventListener('mousemove', e => {
    document.body.style.setProperty('--x', e.clientX+'px');
    document.body.style.setProperty('--y', e.clientY+'px');
});

let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('nq-docs-user')||'null'); } catch(e){}

function getPostId() {
    const m = window.location.pathname.match(/\/post\/(.+)/);
    return m ? decodeURIComponent(m[1]) : null;
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Твой парсер маркдауна
function parseText(raw) {
    if (!raw) return '';
    let s = String(raw);
    s=s.replace(/```([\s\S]*?)```/g,(_,c)=>`<pre><code>${esc(c.trim())}</code></pre>`);
    s=s.replace(/`([^`]+)`/g,(_,c)=>`<code>${esc(c)}</code>`);
    s=s.replace(/^#([^\n]+)/gm,(_,t)=>`<h1>${t.trim()}</h1>`);
    s=s.replace(/\*\*(.+?)\*\*/g,(_,t)=>`<strong>${t}</strong>`);
    s=s.replace(/\n{2,}/g,'</p><p>');
    s=s.replace(/\n/g,'<br>');
    return `<p>${s}</p>`.replace(/<p>\s*<\/p>/g,'');
}

async function loadPost() {
    const id = getPostId();
    if (!id) { document.getElementById('postArea').innerHTML='Post not found'; return; }
    
    try {
        const r = await fetch(`/api/docs/universal?action=post&id=${encodeURIComponent(id)}`);
        const d = await r.json();
        if (!d.ok || !d.post) { document.getElementById('postArea').innerHTML='Post not found'; return; }
        
        const p = d.post;
        document.title = `${p.PostName} — Nekoq Docs`;
        
        // ВСТАВЛЯЕМ В НОВУЮ СТРУКТУРУ (FRAME 175)
        document.getElementById('postArea').innerHTML = `
            <div class="post-card">
                <div class="post-meta">
                    <span class="post-author">${esc(p.Author)}</span>
                    <span class="post-sep">|</span>
                    <span class="post-date">${p.Date||'2026'}</span>
                </div>
                <div class="post-title">${esc(p.PostName)}</div>
                <div class="post-desc">${esc(p.PostDesc)}</div>
                
                <div class="post-flex">
                    <div class="post-text">
                        ${parseText(p.PostText)}
                    </div>
                    <div class="post-img-side">
                        <div class="post-preview">
                            ${p.PostImg ? `<img src="${p.PostImg}" alt="">` : `<span class="no-preview">no preview</span>`}
                        </div>
                    </div>
                </div>
            </div>
        `;
        
        loadComments(id);
        loadOtherPosts(p.Author, id);
    } catch(e) {
        document.getElementById('postArea').innerHTML='Failed to load';
    }
}

async function loadComments(postId) {
    try {
        const r = await fetch(`/api/docs/universal?action=comments&id=${encodeURIComponent(postId)}`);
        const d = await r.json();
        const list = document.getElementById('commentList');
        const items = d.comments || [];
        if (!items.length) { list.innerHTML = '<div style="opacity:0.3; font-size:12px">No comments yet.</div>'; return; }
        
        list.innerHTML = items.map(c => `
            <div class="comment-item">
                <div><span class="comment-author">${esc(c.author)}</span><span class="comment-date">${c.date||''}</span></div>
                <div class="comment-text">${esc(c.text)}</div>
            </div>
        `).join('');
    } catch(e){}
}

async function sendComment(){
    const text = document.getElementById('commentText').value.trim();
    if(!text) return;
    const postId = getPostId();
    const body = {postId, text};
    if(currentUser) { body.username = currentUser.username; body.token = currentUser.token; }
    
    try {
        const r = await fetch('/api/docs/universal?action=comment', {
            method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
        });
        const d = await r.json();
        if(d.ok) { 
            document.getElementById('commentText').value=''; 
            loadComments(postId); 
        }
    } catch(e){}
}

async function loadOtherPosts(author, currentId) {
    try {
        const r = await fetch('/api/docs/universal?action=posts&fresh=1');
        const d = await r.json();
        const posts = (d.posts || []).filter(p => p.id !== currentId).slice(0, 6);
        
        if (posts.length > 0) {
            document.getElementById('otherSection').style.display = 'block';
            document.getElementById('otherScroll').innerHTML = posts.map(p => `
                <a class="mini-card" href="/post/${encodeURIComponent(p.id)}">
                    <div class="mini-preview">
                        ${p.img ? `<img src="${p.img}">` : '<span class="no-preview">no image</span>'}
                    </div>
                    <div class="mini-body">
                        <div class="mini-title">${esc(p.name)}</div>
                        <div class="mini-author">${esc(p.author)}</div>
                    </div>
                </a>
            `).join('');
        }
    } catch(e){}
}

loadPost();
</script>
</body>
</html>
