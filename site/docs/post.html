<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nekoq | Docs</title>
<link rel="icon" type="image/png" href="/site/html/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #ff0073; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: #050204; color: #d1d1d1;
  font-family: 'Poppins', sans-serif;
  min-height: 100vh; overflow-x: hidden;
  animation: fadeIn 0.35s ease forwards;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; background-position: center; z-index: -5; }
.bg-grid {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);
  background-size: 50px 50px;
  mask-image: radial-gradient(circle at center,black 30%,transparent 80%);
  -webkit-mask-image: radial-gradient(circle at center,black 30%,transparent 80%);
  z-index: -4;
}
.blob { position: fixed; border-radius: 50%; filter: blur(150px); opacity: 0.08; will-change: transform; animation: floatBlob 20s infinite alternate cubic-bezier(0.4,0,0.2,1); z-index: -3; }
.blob-1 { top:-10%; left:-10%; width:50vw; height:50vw; background: radial-gradient(circle,var(--primary),transparent 70%); }
.blob-2 { bottom:-10%; right:-10%; width:60vw; height:60vw; background: radial-gradient(circle,var(--primary),transparent 70%); animation-delay:-5s; }
@keyframes floatBlob { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(10%,10%) scale(1.1)} }
.bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 120px at var(--x,50%) var(--y,50%),rgba(255,255,255,0.05) 0%,transparent 100%); z-index: -2; pointer-events: none; }

/* ── TOPBAR ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 52px;
  background: rgba(15,10,13,0.6); backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; padding: 0 28px; gap: 8px;
}
.topbar-logo { font-size: 11px; font-weight: 800; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-right: 24px; }
.topbar-nav { display: flex; align-items: center; gap: 2px; flex: 1; justify-content: center; }
.topbar-link { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.35); text-decoration: none; padding: 6px 12px; border-radius: 8px; transition: color 0.2s, background 0.2s; cursor: pointer; border: none; background: none; }
.topbar-link:hover { color: white; background: rgba(255,255,255,0.05); }
.topbar-sep { color: rgba(255,255,255,0.15); font-size: 12px; margin: 0 2px; }
.topbar-amp { color: rgba(255,255,255,0.15); font-size: 11px; margin: 0 4px; }
.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: 24px; }
.btn-go { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 7px 18px; border-radius: 8px; border: 1px solid rgba(255,0,115,0.35); background: rgba(255,0,115,0.08); color: var(--primary); cursor: pointer; transition: all 0.2s; text-decoration: none; }
.btn-go:hover { background: var(--primary); color: white; border-color: var(--primary); }
.user-chip { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: rgba(255,145,207,0.8); text-transform: uppercase; }

/* ── LAYOUT ── */
.main {
  padding-top: 52px;
  display: grid;
  grid-template-columns: 160px 1fr 160px;
  grid-template-rows: auto;
  min-height: 100vh;
  position: relative; z-index: 2;
}

/* Левая колонка — другие посты */
.col-left {
  padding: 16px 12px 100px 16px;
  display: flex; flex-direction: column; gap: 8px;
}
.col-label {
  font-size: 9px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(255,255,255,0.15);
  margin-bottom: 4px;
}

/* Центр — пост */
.col-center {
  padding: 24px 0 100px;
  border-left: 1px solid rgba(255,255,255,0.05);
  border-right: 1px solid rgba(255,255,255,0.05);
}

/* Правая колонка — комменты + другие посты автора */
.col-right {
  padding: 16px 16px 100px 12px;
  display: flex; flex-direction: column; gap: 16px;
}

/* ── POST ── */
.post-wrap { padding: 0 24px; }
.post-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.post-author { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: rgba(255,145,207,0.8); text-transform: uppercase; }
.post-date { font-size: 9px; font-weight: 600; color: rgba(255,255,255,0.2); }
.post-title { font-size: 20px; font-weight: 800; color: white; line-height: 1.3; margin-bottom: 10px; }
.post-desc { font-size: 12px; color: rgba(255,255,255,0.45); line-height: 1.6; margin-bottom: 20px; }

.post-img {
  width: 100%; border-radius: 10px; overflow: hidden;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  margin-bottom: 24px;
}
.post-img img { width: 100%; display: block; border-radius: 10px; }
.post-img-placeholder {
  height: 180px; display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; letter-spacing: 2px;
  text-transform: uppercase; color: rgba(255,255,255,0.1);
}

/* ── POST TEXT (markdown рендер) ── */
.post-text { font-size: 13px; line-height: 1.8; color: rgba(255,255,255,0.7); }
.post-text h1 { font-size: 22px; font-weight: 800; color: white; margin: 24px 0 10px; }
.post-text h2 { font-size: 17px; font-weight: 700; color: white; margin: 20px 0 8px; }
.post-text h3 { font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.85); margin: 16px 0 6px; }
.post-text h4 { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.5); letter-spacing: 1px; text-transform: uppercase; margin: 12px 0 4px; }
.post-text strong { color: white; font-weight: 700; }
.post-text em { font-style: italic; color: rgba(255,255,255,0.6); }
.post-text u { text-decoration: underline; text-decoration-color: rgba(255,0,115,0.5); }
.post-text a { color: var(--primary); text-decoration: none; }
.post-text a:hover { text-decoration: underline; }
.post-text ul { padding-left: 20px; margin: 8px 0; }
.post-text ul li { margin: 4px 0; }
.post-text ul ul { margin: 2px 0; }
.post-text code {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 5px; padding: 2px 6px; font-size: 11px;
  font-family: 'Courier New', monospace; color: rgba(255,145,207,0.9);
}
.post-text pre {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 14px 16px; margin: 12px 0;
  overflow-x: auto;
}
.post-text pre code { background: none; border: none; padding: 0; font-size: 12px; color: rgba(255,255,255,0.75); }
.post-text blockquote {
  border-left: 3px solid rgba(255,0,115,0.4);
  padding: 8px 16px; margin: 12px 0;
  background: rgba(255,0,115,0.04); border-radius: 0 8px 8px 0;
  color: rgba(255,255,255,0.55); font-style: italic;
}

/* Spoiler */
.spoiler-wrap { margin: 8px 0; }
.spoiler-toggle {
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 8px 14px;
  font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.4);
  cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: all 0.2s; font-family: 'Poppins',sans-serif;
}
.spoiler-toggle:hover { border-color: rgba(255,0,115,0.3); color: rgba(255,255,255,0.7); }
.spoiler-icon { font-size: 9px; transition: transform 0.2s; }
.spoiler-toggle.open .spoiler-icon { transform: rotate(90deg); }
.spoiler-content {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  border-top: none; border-radius: 0 0 8px 8px; padding: 12px 14px;
  font-size: 12px; display: none;
}
.spoiler-content.open { display: block; }

/* ── MINI CARD ── */
.mini-card {
  background: rgba(15,10,13,0.434); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.07); border-radius: 8px;
  overflow: hidden; display: flex; flex-direction: column; cursor: pointer;
  text-decoration: none; color: inherit;
  transition: border-color 0.2s, transform 0.2s;
}
.mini-card:hover { border-color: rgba(255,0,115,0.25); transform: translateY(-1px); }
.mini-preview {
  width: 100%; height: 80px;
  background: rgba(255,255,255,0.03);
  display: flex; align-items: center; justify-content: center;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.mini-preview img { width: 100%; height: 100%; object-fit: cover; }
.mini-no-prev { font-size: 7px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.1); }
.mini-body { padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mini-title { font-size: 10px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: rgba(255,255,255,0.85); }
.mini-author { font-size: 8px; font-weight: 700; color: rgba(255,145,207,0.7); text-transform: uppercase; letter-spacing: 1px; }
.mini-desc { display: none; }

/* ── COMMENTS ── */
.comments-label {
  font-size: 9px; font-weight: 700; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(255,255,255,0.15); margin-bottom: 10px;
}
.comment-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.comment-input {
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px; padding: 10px 12px;
  font-family: 'Poppins',sans-serif; font-size: 11px; color: rgba(255,255,255,0.8);
  resize: none; outline: none; transition: border-color 0.2s;
  min-height: 70px;
}
.comment-input:focus { border-color: rgba(255,0,115,0.3); }
.comment-input::placeholder { color: rgba(255,255,255,0.15); }
.comment-send {
  align-self: flex-end; font-size: 9px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; padding: 7px 16px; border-radius: 8px;
  border: 1px solid rgba(255,0,115,0.35); background: rgba(255,0,115,0.08);
  color: var(--primary); cursor: pointer; transition: all 0.2s;
  font-family: 'Poppins',sans-serif;
}
.comment-send:hover { background: var(--primary); color: white; }
.comment-list { display: flex; flex-direction: column; gap: 8px; }
.comment-item {
  background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px; padding: 10px 12px;
}
.comment-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
.comment-author { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,145,207,0.7); }
.comment-date { font-size: 8px; color: rgba(255,255,255,0.15); }
.comment-text { font-size: 11px; color: rgba(255,255,255,0.55); line-height: 1.5; }
.comment-msg { font-size: 10px; color: rgba(255,0,115,0.7); font-weight: 600; min-height: 14px; }
.no-comments { font-size: 10px; color: rgba(255,255,255,0.15); text-align: center; padding: 20px 0; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 25px; left: 25px;
  background: rgba(15,10,13,0.434); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 12px;
  padding: 10px 20px; display: flex; gap: 25px; z-index: 10; align-items: center;
}
.nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer; text-decoration: none; }
.nav-link:hover { color: white; }
.nav-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.1); }
.lang-box { display: flex; gap: 10px; }
.lang-btn { font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.3s; color: rgba(255,255,255,0.2); background: none; border: none; font-family: 'Poppins',sans-serif; }
.lang-btn.active { color: var(--primary); }
.bottom-credit { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: rgba(255,255,255,0.15); text-transform: uppercase; z-index: 10; white-space: nowrap; }

/* ── LOADING ── */
.loading { padding: 60px 24px; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.1); }

@media(max-width:900px) {
  .main { grid-template-columns: 0 1fr 160px; }
  .col-left { display: none; }
}
@media(max-width:600px) {
  .main { grid-template-columns: 1fr; }
  .col-right { display: none; }
}
</style>
</head>
<body>
<div class="bg-base"></div>
<div class="bg-grid"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="bg-glow"></div>

<!-- TOPBAR -->
<nav class="topbar">
  <a href="/docs" class="topbar-logo">Docs Home</a>
  <div class="topbar-nav">
    <button class="topbar-link" id="btn-login" onclick="openAuth()">Login</button>
    <span class="topbar-sep">\</span>
    <button class="topbar-link" id="btn-register" onclick="openAuth()">Register</button>
    <span class="topbar-amp">&amp;</span>
    <button class="topbar-link" id="btn-create" style="display:none" onclick="window.location.href='/docs/create'">Create</button>
    <span class="user-chip" id="user-chip" style="display:none"></span>
  </div>
  <div class="topbar-right">
    <a href="/docs" class="btn-go">← Back</a>
  </div>
</nav>

<!-- MAIN -->
<div class="main">
  <!-- Левая колонка -->
  <div class="col-left">
    <div class="col-label">Other Posts</div>
    <div id="otherPosts"><div class="loading">Loading...</div></div>
  </div>

  <!-- Центр — пост -->
  <div class="col-center">
    <div id="postContent"><div class="loading">Loading post...</div></div>
  </div>

  <!-- Правая колонка -->
  <div class="col-right">
    <div>
      <div class="col-label" id="authorPostsLabel" style="display:none"></div>
      <div id="authorPosts"></div>
    </div>
    <div>
      <div class="comments-label">Comments</div>
      <div class="comment-form">
        <textarea class="comment-input" id="commentText" placeholder="Leave a comment..."></textarea>
        <button class="comment-send" onclick="sendComment()">Send →</button>
      </div>
      <div class="comment-msg" id="commentMsg"></div>
      <div class="comment-list" id="commentList"><div class="no-comments">No comments yet</div></div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="/" class="nav-link">Home</a>
  <a href="/catalog" class="nav-link">Catalog</a>
  <a href="/obfuscator" class="nav-link">Obfuscator</a>
  <a href="/getkey" class="nav-link">Authentication</a>
  <a href="/status" class="nav-link">Status</a>
  <a href="https://discord.gg/TRPZg4Xfkq" class="nav-link" target="_blank">Discord</a>
  <div class="nav-divider"></div>
  <div class="lang-box">
    <button class="lang-btn active" onclick="setLang('RU')">RU</button>
    <button class="lang-btn" onclick="setLang('EN')">EN</button>
  </div>
</nav>
<div class="bottom-credit">© 2026 Nekoq. All rights reserved.</div>

<script>
window.addEventListener('mousemove', e => {
  document.body.style.setProperty('--x', e.clientX + 'px');
  document.body.style.setProperty('--y', e.clientY + 'px');
});

// ── SESSION ──
let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('nq-docs-user') || 'null'); } catch(e) {}
function updateUI() {
  if (currentUser) {
    document.getElementById('btn-login').style.display = 'none';
    document.getElementById('btn-register').style.display = 'none';
    document.getElementById('btn-create').style.display = '';
    document.getElementById('user-chip').style.display = '';
    document.getElementById('user-chip').textContent = currentUser.username;
  }
}
updateUI();
function openAuth() { window.location.href = '/docs'; }

// ── POST ID из URL ──
function getPostId() {
  const p = window.location.pathname;
  const m = p.match(/\/docs\/post\/(.+)/);
  return m ? decodeURIComponent(m[1]) : null;
}

// ── MARKDOWN PARSER ──
function parseText(raw) {
  if (!raw) return '';
  let s = String(raw);
  // Spoiler || text ||
  s = s.replace(/\|\|(.+?)\|\|/gs, (_, t) => {
    const id = 'sp' + Math.random().toString(36).slice(2);
    return `<div class="spoiler-wrap"><button class="spoiler-toggle" onclick="toggleSpoiler('${id}')"><span class="spoiler-icon">▶</span> Spoiler</button><div class="spoiler-content" id="${id}">${t.trim()}</div></div>`;
  });
  // Code blocks ```
  s = s.replace(/```([\s\S]*?)```/g, (_, c) => `<pre><code>${esc(c.trim())}</code></pre>`);
  // Inline code
  s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${esc(c)}</code>`);
  // Headers
  s = s.replace(/^###([^\n]+)/gm, (_,t) => `<h3>${t.trim()}</h3>`);
  s = s.replace(/^##([^\n]+)/gm, (_,t) => `<h2>${t.trim()}</h2>`);
  s = s.replace(/^#([^\n]+)/gm, (_,t) => {
    const inner = t.trim();
    // -# = small
    if (inner.startsWith('-')) return `<h4>${inner.slice(1).trim()}</h4>`;
    return `<h1>${inner}</h1>`;
  });
  // Blockquote > or >>>
  s = s.replace(/^>{1,3}([^\n]+)/gm, (_,t) => `<blockquote>${t.trim()}</blockquote>`);
  // Bold **
  s = s.replace(/\*\*(.+?)\*\*/g, (_,t) => `<strong>${t}</strong>`);
  // Italic *
  s = s.replace(/\*(.+?)\*/g, (_,t) => `<em>${t}</em>`);
  // Underline __
  s = s.replace(/__(.+?)__/g, (_,t) => `<u>${t}</u>`);
  // Link [text](url)
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_,t,u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
  // Lists * item or - item with sub \  * subitem
  s = s.replace(/^(\s*)[*\-] (.+)/gm, (_, indent, item) => {
    const depth = indent.length;
    return depth > 0 ? `<li style="margin-left:${depth*12}px">${item}</li>` : `<li>${item}</li>`;
  });
  s = s.replace(/(<li>[\s\S]*?<\/li>)/g, m => `<ul>${m}</ul>`);
  // Newlines
  s = s.replace(/\n{2,}/g, '</p><p>');
  s = s.replace(/\n/g, '<br>');
  s = `<p>${s}</p>`;
  // Cleanup empty p
  s = s.replace(/<p>\s*<\/p>/g, '');
  return s;
}

function toggleSpoiler(id) {
  const c = document.getElementById(id);
  const btn = c.previousElementSibling;
  c.classList.toggle('open');
  btn.classList.toggle('open');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── LOAD POST ──
let currentPost = null;
async function loadPost() {
  const id = getPostId();
  if (!id) { document.getElementById('postContent').innerHTML = '<div class="loading">Post not found</div>'; return; }

  try {
    const r = await fetch(`/api/docs/universal?action=post&id=${encodeURIComponent(id)}`);
    const d = await r.json();
    if (!d.ok || !d.post) { document.getElementById('postContent').innerHTML = '<div class="loading">Post not found</div>'; return; }

    currentPost = d.post;
    document.title = `${d.post.PostName} — Nekoq Docs`;
    renderPost(d.post);
    loadComments(id);
    loadOtherPosts(d.post.Author, id);
  } catch(e) {
    document.getElementById('postContent').innerHTML = '<div class="loading">Failed to load</div>';
  }
}

function renderPost(p) {
  document.getElementById('postContent').innerHTML = `
    <div class="post-wrap">
      <div class="post-meta">
        <span class="post-author">${esc(p.Author)}</span>
        <span class="post-date">${p.Date || ''}</span>
      </div>
      <div class="post-title">${esc(p.PostName)}</div>
      <div class="post-desc">${esc(p.PostDesc)}</div>
      <div class="post-img">
        ${p.PostImg
          ? `<img src="${p.PostImg}" alt="${esc(p.PostName)}">`
          : `<div class="post-img-placeholder">No preview</div>`}
      </div>
      <div class="post-text">${parseText(p.PostText)}</div>
    </div>
  `;
}

// ── LOAD OTHER POSTS ──
async function loadOtherPosts(author, currentId) {
  try {
    const r = await fetch('/api/docs/universal?action=posts');
    const d = await r.json();
    const posts = d.posts || [];

    // Левая колонка — все остальные посты
    const others = posts.filter(p => p.id !== currentId);
    document.getElementById('otherPosts').innerHTML = others.length
      ? others.slice(0, 8).map(p => miniCard(p)).join('')
      : '<div style="font-size:9px;color:rgba(255,255,255,0.1);letter-spacing:2px;text-transform:uppercase">No other posts</div>';

    // Правая колонка — посты этого автора
    const byAuthor = posts.filter(p => p.author === author && p.id !== currentId);
    if (byAuthor.length) {
      document.getElementById('authorPostsLabel').style.display = '';
      document.getElementById('authorPostsLabel').textContent = `More by ${author}`;
      document.getElementById('authorPosts').innerHTML = byAuthor.slice(0, 4).map(p => miniCard(p)).join('');
    }
  } catch(e) {}
}

function miniCard(p) {
  return `
    <a class="mini-card" href="/docs/post/${encodeURIComponent(p.id)}">
      <div class="mini-preview">
        ${p.img ? `<img src="${p.img}" alt="">` : `<span class="mini-no-prev">No img</span>`}
      </div>
      <div class="mini-body">
        <div class="mini-title">${esc(p.name)}</div>
        <div class="mini-author">${esc(p.author)}</div>
        <div class="mini-desc">${esc(p.desc)}</div>
      </div>
    </a>
  `;
}

// ── COMMENTS ──
async function loadComments(postId) {
  try {
    const r = await fetch(`/api/docs/universal?action=comments&id=${encodeURIComponent(postId)}`);
    const d = await r.json();
    renderComments(d.comments || []);
  } catch(e) {}
}

function renderComments(comments) {
  const list = document.getElementById('commentList');
  if (!comments.length) { list.innerHTML = '<div class="no-comments">No comments yet</div>'; return; }
  list.innerHTML = comments.map(c => `
    <div class="comment-item">
      <div class="comment-top">
        <span class="comment-author">${esc(c.author)}</span>
        <span class="comment-date">${c.date || ''}</span>
      </div>
      <div class="comment-text">${esc(c.text)}</div>
    </div>
  `).join('');
}

async function sendComment() {
  const text = document.getElementById('commentText').value.trim();
  const msg = document.getElementById('commentMsg');
  if (!text) { msg.textContent = 'Write something'; return; }
  msg.textContent = 'Sending...';

  const postId = getPostId();
  const body = { postId, text };
  if (currentUser) { body.username = currentUser.username; body.password = currentUser.password || ''; }

  try {
    const r = await fetch('/api/docs/universal?action=comment', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.ok) {
      document.getElementById('commentText').value = '';
      msg.textContent = 'Sent!';
      await loadComments(postId);
      setTimeout(() => { msg.textContent = ''; }, 2000);
    } else { msg.textContent = d.error || 'Error'; }
  } catch(e) { msg.textContent = 'Network error'; }
}

function setLang(l) {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent === l));
}

loadPost();
</script>
