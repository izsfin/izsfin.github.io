<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vellote Docs | Auth</title>
<link rel="icon" type="image/png" href="/site/html/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #ff0073; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: #050204; color: #d1d1d1;
  font-family: 'Poppins', sans-serif;
  min-height: 100vh; overflow-x: hidden;
  animation: fadeIn 0.35s ease forwards;
  display: flex; flex-direction: column;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

.bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; background-position: center; z-index: -5; }
.bg-grid {
  position: fixed; inset: 0;
  background-image: linear-gradient(rgba(255,255,255,0.02) 1px,transparent 1px), linear-gradient(90deg,rgba(255,255,255,0.02) 1px,transparent 1px);
  background-size: 50px 50px;
  mask-image: radial-gradient(circle at center,black 30%,transparent 80%);
  -webkit-mask-image: radial-gradient(circle at center,black 30%,transparent 80%);
  z-index: -4;
}
.blob { position: fixed; border-radius: 50%; filter: blur(150px); opacity: 0.08; animation: floatBlob 20s infinite alternate cubic-bezier(0.4,0,0.2,1); z-index: -3; }
.blob-1 { top:-10%; left:-10%; width:50vw; height:50vw; background: radial-gradient(circle,var(--primary),transparent 70%); }
.blob-2 { bottom:-10%; right:-10%; width:60vw; height:60vw; background: radial-gradient(circle,var(--primary),transparent 70%); animation-delay:-5s; }
@keyframes floatBlob { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(10%,10%) scale(1.1)} }
.bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 120px at var(--x,50%) var(--y,50%),rgba(255,255,255,0.05) 0%,transparent 100%); z-index: -2; pointer-events: none; }

/* ── TOPBAR ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 52px;
  background: rgba(15,10,13,0.6); backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex; align-items: center; padding: 0 28px; gap: 8px;
}
.topbar-logo { font-size: 11px; font-weight: 800; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-right: 24px; }
.topbar-nav { display: flex; align-items: center; gap: 2px; flex: 1; justify-content: center; }
.topbar-link { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.35); text-decoration: none; padding: 6px 12px; border-radius: 8px; transition: color 0.2s, background 0.2s; cursor: pointer; border: none; background: none; font-family: 'Poppins',sans-serif; }
.topbar-link:hover { color: white; background: rgba(255,255,255,0.05); }
.topbar-sep { color: rgba(255,255,255,0.15); font-size: 12px; margin: 0 2px; }
.topbar-amp { color: rgba(255,255,255,0.15); font-size: 11px; margin: 0 4px; }
.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: 24px; }
.btn-go { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 7px 18px; border-radius: 8px; border: 1px solid rgba(255,0,115,0.35); background: rgba(255,0,115,0.08); color: var(--primary); cursor: pointer; transition: all 0.2s; text-decoration: none; }
.btn-go:hover { background: var(--primary); color: white; }
.search-wrap { display: flex; align-items: center; gap: 8px; background: rgba(15,10,13,0.6); border: 1px solid rgba(255,255,255,0.07); border-radius: 8px; padding: 6px 12px; transition: border-color 0.2s; }
.search-wrap:focus-within { border-color: rgba(255,0,115,0.3); }
.search-input { background: none; border: none; outline: none; font-family: 'Poppins',sans-serif; font-size: 11px; color: rgba(255,255,255,0.7); width: 130px; }
.search-input::placeholder { color: rgba(255,255,255,0.2); }
.search-icon { color: rgba(255,255,255,0.2); font-size: 15px; cursor: pointer; }

/* ── AUTH CARD ── */
.page-center {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 72px 20px 100px; position: relative; z-index: 2;
}
.auth-card {
  background: rgba(15,10,13,0.7);
  backdrop-filter: blur(30px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
  width: 100%; max-width: 380px;
  overflow: hidden;
}

/* Tabs */
.auth-tabs {
  display: grid; grid-template-columns: 1fr 1fr;
}
.auth-tab {
  padding: 20px; text-align: center;
  font-size: 16px; font-weight: 800; cursor: pointer;
  color: rgba(255,255,255,0.2);
  border: none; background: none;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  font-family: 'Poppins',sans-serif;
  transition: color 0.2s, background 0.2s;
}
.auth-tab + .auth-tab {
  border-left: 1px solid rgba(255,255,255,0.07);
}
.auth-tab.active {
  color: white; font-weight: 800;
  background: rgba(255,255,255,0.02);
  border-bottom-color: transparent;
}

/* Fields */
.auth-fields { padding: 0; }
.auth-field {
  border-bottom: 1px solid rgba(255,255,255,0.07);
  position: relative;
}
.auth-field:last-of-type { border-bottom: none; }
.auth-input {
  width: 100%; background: transparent; border: none; outline: none;
  font-family: 'Poppins',sans-serif; font-size: 14px; font-weight: 600;
  color: rgba(255,255,255,0.75); text-align: center;
  padding: 22px 20px; transition: color 0.2s;
}
.auth-input::placeholder { color: rgba(255,255,255,0.2); font-weight: 600; }
.auth-input:focus { color: white; }
.auth-input:focus::placeholder { color: rgba(255,255,255,0.1); }

/* Extra field (confirm password) — скрыт для login */
.auth-field-extra {
  border-top: 1px solid rgba(255,255,255,0.07);
}

/* Submit */
.auth-submit {
  width: 100%; background: transparent; border: none; border-top: 1px solid rgba(255,255,255,0.07);
  font-family: 'Poppins',sans-serif; font-size: 16px; font-weight: 800;
  color: rgba(255,255,255,0.6); padding: 22px 20px;
  cursor: pointer; transition: color 0.2s, background 0.2s;
  text-align: center;
}
.auth-submit:hover { color: white; background: rgba(255,255,255,0.03); }

/* Message */
.auth-msg {
  text-align: center; padding: 12px 20px;
  font-size: 11px; font-weight: 700; color: rgba(255,145,207,0.8);
  border-top: 1px solid rgba(255,255,255,0.05);
  min-height: 40px; display: flex; align-items: center; justify-content: center;
}
.auth-msg.err { color: rgba(248,113,113,0.8); }
.auth-msg.ok { color: rgba(74,222,128,0.8); }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed; bottom: 25px; left: 25px;
  background: rgba(15,10,13,0.434); backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.05); border-radius: 12px;
  padding: 10px 20px; display: flex; gap: 25px; z-index: 10; align-items: center;
}
.nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer; text-decoration: none; }
.nav-link:hover { color: white; }
.nav-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.1); }
.lang-box { display: flex; gap: 10px; }
.lang-btn { font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.3s; color: rgba(255,255,255,0.2); background: none; border: none; font-family: 'Poppins',sans-serif; }
.lang-btn.active { color: var(--primary); }
.bottom-credit { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: rgba(255,255,255,0.15); text-transform: uppercase; z-index: 10; white-space: nowrap; }
</style>
</head>
<body>
<div class="bg-base"></div>
<div class="bg-grid"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="bg-glow"></div>

<!-- TOPBAR -->
<nav class="topbar">
  <a href="/docs" class="topbar-logo">Docs Home</a>
  <div class="topbar-nav">
    <button class="topbar-link" id="tl-login" onclick="switchTab('login')">Login</button>
    <span class="topbar-sep">\</span>
    <button class="topbar-link" id="tl-register" onclick="switchTab('register')">Register</button>
    <span class="topbar-amp">&amp;</span>
    <span class="topbar-link" style="color:rgba(255,255,255,0.15);cursor:default">Create</span>
  </div>
  <div class="topbar-right">
    <a href="/docs" class="btn-go">Go</a>
    <div class="search-wrap">
      <input class="search-input" placeholder="Search..." oninput="">
      <span class="search-icon">⌕</span>
    </div>
  </div>
</nav>

<!-- AUTH CARD -->
<div class="page-center">
  <div class="auth-card">
    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-register" onclick="switchTab('register')">Register</button>
      <button class="auth-tab" id="tab-login" onclick="switchTab('login')">Login</button>
    </div>

    <!-- Fields -->
    <div class="auth-fields">
      <div class="auth-field">
        <input class="auth-input" id="field-user" placeholder="Login" autocomplete="username">
      </div>
      <div class="auth-field">
        <input class="auth-input" type="password" id="field-pass" placeholder="Password" autocomplete="current-password">
      </div>
    </div>

    <!-- Submit -->
    <button class="auth-submit" id="submitBtn" onclick="doSubmit()">Create</button>

    <!-- Message -->
    <div class="auth-msg" id="authMsg"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="/" class="nav-link">Home</a>
  <a href="/catalog" class="nav-link">Catalog</a>
  <a href="/obfuscator" class="nav-link">Obfuscator</a>
  <a href="/getkey" class="nav-link">Authentication</a>
  <a href="/status" class="nav-link">Status</a>
  <a href="https://discord.gg/TRPZg4Xfkq" class="nav-link" target="_blank">Discord</a>
  <div class="nav-divider"></div>
  <div class="lang-box">
    <button class="lang-btn active">RU</button>
    <button class="lang-btn">EN</button>
  </div>
</nav>
<div class="bottom-credit">© 2026 Vellote. All rights reserved.</div>

<script>
window.addEventListener('mousemove', e => {
  document.body.style.setProperty('--x', e.clientX + 'px');
  document.body.style.setProperty('--y', e.clientY + 'px');
});

let currentTab = 'register';

// Читаем ?tab= из URL
const urlTab = new URLSearchParams(window.location.search).get('tab');
if (urlTab === 'login') switchTab('login');

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tl-login').style.color = tab === 'login' ? 'rgba(255,145,207,0.8)' : '';
  document.getElementById('tl-register').style.color = tab === 'register' ? 'rgba(255,145,207,0.8)' : '';
  document.getElementById('submitBtn').textContent = tab === 'register' ? 'Create' : 'Login';
  document.getElementById('field-pass').placeholder = tab === 'register' ? 'Password' : 'Password';
  document.getElementById('authMsg').textContent = '';
  document.getElementById('authMsg').className = 'auth-msg';
}

function setMsg(text, type) {
  const el = document.getElementById('authMsg');
  el.textContent = text;
  el.className = 'auth-msg' + (type ? ' ' + type : '');
}

async function doSubmit() {
  const u = document.getElementById('field-user').value.trim();
  const p = document.getElementById('field-pass').value;
  if (!u || !p) { setMsg('Fill all fields'); return; }
  if (currentTab === 'register' && p.length < 8) { setMsg('Password min 8 chars', 'err'); return; }

  setMsg('wait...', '');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;

  try {
    // Отправляем запрос. Обрати внимание: в теле теперь subaction
    const r = await fetch('/api/docs/universal?action=auth', {
      method: 'POST', 
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ 
        subaction: currentTab, // ИСПРАВЛЕНО: было action
        username: u, 
        password: p 
      })
    });
    
    const d = await r.json();
    
    if (d.ok && d.token) {
      // Сохраняем сессию. Убеждаемся, что токен пришел.
      localStorage.setItem('nq-docs-user', JSON.stringify({ 
        username: d.username, 
        token: d.token 
      }));
      
      setMsg(currentTab === 'register' ? 'Account created!' : 'Welcome back!', 'ok');
      setTimeout(() => { window.location.href = '/docs'; }, 800);
    } else {
      setMsg(d.error || 'Something went wrong', 'err');
      btn.disabled = false;
    }
  } catch(e) {
    setMsg('Network error', 'err');
    btn.disabled = false;
  }
}

// Enter key
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') doSubmit();
});
</script>
</body>
</html>
