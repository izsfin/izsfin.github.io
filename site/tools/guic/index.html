<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ML Expert Studio [Web Edition]</title>
    <link rel="stylesheet" href="https://misslua.pages.dev/site/html/tools/guic/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #1a1a1a;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
            color: #e0e0e0;
            font-family: 'Segoe UI', 'Consolas', monospace;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        
        .sidebar {
            width: 320px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(68, 68, 68, 0.3);
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        .section-header {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 1px solid rgba(68, 68, 68, 0.3);
            color: #00a2ff;
            letter-spacing: 1px;
        }
        
        #explorer-root {
            flex-grow: 1;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
        }
        
        #props-panel {
            height: 450px;
            border-top: 1px solid rgba(68, 68, 68, 0.3);
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .viewport {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
            background-color: #1a1a1a;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
            user-select: none;
        }
        
        #canvas-origin {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            pointer-events: none;
        }
        
        #screen-gui {
            width: 800px;
            height: 450px;
            background: rgba(0, 0, 0, 0.8);
            position: relative;
            outline: 1px solid rgba(68, 68, 68, 0.5);
            pointer-events: auto;
            overflow: visible;
            border-radius: 12px;
            backdrop-filter: blur(2px);
        }
        
        .rbx-obj {
            position: absolute;
            pointer-events: auto !important;
            cursor: move;
            z-index: 10;
            box-sizing: border-box;
            transition: outline 0.1s;
        }
        
        .selected-visual {
            outline: 2px solid #00a2ff !important;
            outline-offset: 2px;
            box-shadow: 0 0 15px rgba(0, 162, 255, 0.5);
            z-index: 999;
        }
        
        .guide {
            position: absolute;
            background-color: #00a2ff;
            display: none;
            z-index: 9999;
            pointer-events: none;
            opacity: 0.8;
        }
        
        .guide-v { width: 1px; height: 100%; top: 0; }
        .guide-h { height: 1px; width: 100%; left: 0; }
        
        .top-control-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 8px 15px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 1000;
            border: 1px solid rgba(68, 68, 68, 0.3);
        }
        
        .control-btn {
            background: rgba(68, 68, 68, 0.8);
            border: 1px solid rgba(102, 102, 102, 0.5);
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .control-btn:hover {
            background: #00a2ff;
            border-color: #00a2ff;
            transform: scale(1.02);
        }
        
        .control-btn:active {
            transform: scale(0.98);
        }
        
        .control-separator {
            color: #888;
            font-size: 12px;
        }
        
        .tools-panel {
            position: absolute;
            top: 80px;
            left: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid rgba(68, 68, 68, 0.3);
            z-index: 1000;
            min-width: 160px;
        }
        
        .tools-title {
            color: #00a2ff;
            font-size: 10px;
            font-weight: bold;
            margin: 8px 0 6px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(68, 68, 68, 0.3);
        }
        
        .tools-title:first-child {
            margin-top: 0;
        }
        
        .tools-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .tool-btn {
            background: rgba(68, 68, 68, 0.6);
            border: 1px solid rgba(102, 102, 102, 0.4);
            color: white;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tool-btn:hover {
            background: #00a2ff;
            border-color: #00a2ff;
            transform: scale(1.02);
        }
        
        .explorer-item {
            transition: background 0.1s ease;
            font-family: 'Segoe UI', monospace;
        }
        
        .explorer-item:hover {
            background: rgba(42, 42, 42, 0.8) !important;
        }
        
        .explorer-item.selected {
            background: rgba(26, 58, 90, 0.8) !important;
            border-left: 3px solid #00a2ff;
        }
        
        .add-btn {
            opacity: 0.6;
            transition: all 0.2s;
            background: rgba(58, 58, 58, 0.8);
            border: 1px solid rgba(85, 85, 85, 0.5);
            color: white;
            border-radius: 4px;
            font-size: 10px;
            padding: 2px 6px;
            cursor: pointer;
        }
        
        .explorer-item:hover .add-btn {
            opacity: 1;
        }
        
        .add-btn:hover {
            background: #00a2ff !important;
            border-color: #00a2ff !important;
        }
        
        #startup-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            background-image: radial-gradient(#333 1px, transparent 1px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .startup-content {
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 40px 60px;
            border-radius: 20px;
            border: 1px solid rgba(68, 68, 68, 0.3);
        }
        
        .startup-content h1 {
            font-size: 48px;
            margin-bottom: 10px;
            color: #00a2ff;
            letter-spacing: 2px;
        }
        
        .startup-content p {
            font-size: 16px;
            color: #888;
            margin-bottom: 30px;
        }
        
        .startup-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        
        .startup-buttons button {
            background: rgba(68, 68, 68, 0.8);
            border: 1px solid rgba(102, 102, 102, 0.5);
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .startup-buttons button:hover {
            background: #00a2ff;
            border-color: #00a2ff;
            transform: scale(1.02);
        }
        
        .credits {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #555;
        }
        
        .prop-row:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }
        
        ::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #00a2ff;
        }
    </style>
</head>
<body>
    <div id="startup-screen">
        <div class="startup-content">
            <h1>ML Expert Editor</h1>
            <p>Welcome to UI Creator</p>
            <div class="startup-buttons">
                <button onclick="Startup.newProject()">New UI</button>
                <button onclick="document.getElementById('file-input').click()">Load UI (.lua.mle)</button>
            </div>
            <input type="file" id="file-input" style="display:none" accept=".mle" onchange="FileSystem.loadProject(this.files[0])">
            <div class="credits">by absolute.lerp</div>
        </div>
    </div>

    <div class="sidebar">
        <div class="section-header">EXPLORER</div>
        <div id="explorer-root"></div>
        <div class="section-header">PROPERTIES</div>
        <div id="props-panel"></div>
    </div>

    <div class="viewport" id="vport">
        <div class="top-control-panel">
            <button class="control-btn" onclick="ExportEngine.generateLua()">UI to Luau</button>
            <span class="control-separator">OR</span>
            <button class="control-btn" onclick="FileSystem.saveProject()">Save to file</button>
        </div>
        
        <div class="tools-panel">
            <div class="tools-title">📦 UI Elements</div>
            <div class="tools-buttons" id="uie-list"></div>
            <div class="tools-title">✨ Modifiers</div>
            <div class="tools-buttons" id="uip-list"></div>
        </div>

        <div id="canvas-origin">
            <div id="screen-gui">
                <div id="g-v" class="guide guide-v"></div>
                <div id="g-h" class="guide guide-h"></div>
            </div>
        </div>
    </div>

    <script src="https://srf-weakez.pages.dev/site/tools/guic/app.js"></script>
    <script src="https://srf-weakez.pages.dev/site/tools/guic/ui_elements.js"></script> 
    <script src="https://srf-weakez.pages.dev/site/tools/guic/properties.js"></script>
    <script src="https://srf-weakez.pages.dev/site/tools/guic/snapping.js"></script>
    <script src="https://srf-weakez.pages.dev/site/tools/guic/explorer.js"></script>
    <script src="https://srf-weakez.pages.dev/site/tools/guic/viewport.js"></script>
    <script src="https://srf-weakez.pages.dev/site/tools/guic/export_engine.js"></script>

    <script>
        window.onload = () => {
            console.log("Engine Started");
            
            if (!window.App) {
                window.App = {
                    activeId: 'screen-gui',
                    objCount: 0,
                    zoom: 1,
                    panX: 150,
                    panY: 150,
                    objects: {
                        'screen-gui': { 
                            type: 'ScreenGui', 
                            name: 'ScreenGui', 
                            parent: null, 
                            dom: document.getElementById('screen-gui'), 
                            props: { BackgroundColor3: '#000000', ClipsDescendants: false },
                            effects: []
                        }
                    }
                };
            }

            if (typeof Viewport !== 'undefined') Viewport.init();
            if (typeof ExplorerEngine !== 'undefined') ExplorerEngine.render();
            if (typeof ExplorerEngine !== 'undefined') ExplorerEngine.select('screen-gui');
        };
    </script>
</body>
</html>
