<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celius | Catalog</title>
    <link rel="icon" type="image/png" href="/site/html/celius.nobg.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #02040a;
            color: #d1d1d1;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; background-position: center; z-index: -3; }
        .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 120px at var(--x,50%) var(--y,50%), rgba(255,255,255,0.05) 0%, transparent 100%); z-index: -2; pointer-events: none; }
        .grid-layer { position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.01) 1px,transparent 1px); background-size: 50px 50px; z-index: -1; }

        .main { position: relative; z-index: 2; padding: 36px 36px 100px; }

        /* Header */
        .page-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 32px;
        }
        .page-title {
            font-size: 32px; font-weight: 800; color: white; letter-spacing: 1px;
        }
        .search-btn {
            font-family: 'Poppins', sans-serif;
            font-size: 12px; font-weight: 700;
            padding: 10px 24px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(10,11,15,0.6); backdrop-filter: blur(20px);
            color: white; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; gap: 8px;
        }
        .search-btn:hover { border-color: rgba(99,102,241,0.5); color: rgba(160,140,255,1); }

        /* Grid */
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }

        .item-card {
            background: rgba(10,11,15,0.55); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.07); border-radius: 12px;
            overflow: hidden; cursor: pointer;
            transition: border-color 0.25s, transform 0.2s;
            display: flex; flex-direction: column;
        }
        .item-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }

        .item-preview {
            width: 100%; aspect-ratio: 1;
            background: rgba(255,255,255,0.04);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        .item-preview img { width: 100%; height: 100%; object-fit: cover; }
        .item-preview .no-preview {
            font-size: 11px; color: rgba(255,255,255,0.2);
            font-weight: 600; letter-spacing: 0.5px;
        }

        .item-info { padding: 12px 14px 14px; }
        .item-name {
            font-size: 12px; font-weight: 700; color: white;
            margin-bottom: 10px; line-height: 1.3;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .item-btn {
            width: 100%; font-family: 'Poppins', sans-serif;
            font-size: 11px; font-weight: 700;
            padding: 8px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.7); cursor: pointer;
            transition: all 0.2s; letter-spacing: 0.3px;
        }
        .item-btn:hover { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.4); color: white; }

        /* Empty / loading */
        .state-msg {
            text-align: center; padding: 80px 0;
            font-size: 13px; color: rgba(255,255,255,0.2);
            font-weight: 600; letter-spacing: 0.5px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 50;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }

        .modal {
            background: rgba(10,11,15,0.95); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
            padding: 32px; width: 480px; max-width: 90vw;
            transform: translateY(16px); transition: transform 0.2s;
        }
        .modal-overlay.open .modal { transform: translateY(0); }

        .modal-title {
            font-size: 16px; font-weight: 800; color: white;
            text-align: center; margin-bottom: 20px; letter-spacing: 0.5px;
        }

        /* Filter toggles */
        .toggle-row { display: flex; gap: 10px; margin-bottom: 16px; }
        .toggle-btn {
            flex: 1; font-family: 'Poppins', sans-serif;
            font-size: 11px; font-weight: 700; padding: 10px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.4);
            cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px;
        }
        .toggle-btn.active {
            border-color: rgba(99,102,241,0.5);
            background: rgba(99,102,241,0.12); color: white;
        }

        .modal-divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 16px 0; }

        /* Category tabs */
        .cat-row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
        .cat-btn {
            font-family: 'Poppins', sans-serif;
            font-size: 11px; font-weight: 700; padding: 8px 18px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.07);
            background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.4);
            cursor: pointer; transition: all 0.2s;
        }
        .cat-btn.active {
            border-color: rgba(99,102,241,0.5);
            background: rgba(99,102,241,0.12); color: white;
        }

        .type-row { display: flex; gap: 8px; flex-wrap: wrap; }

        .modal-search-btn {
            width: 100%; margin-top: 20px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 700; padding: 13px;
            border-radius: 10px; border: 1px solid rgba(99,102,241,0.3);
            background: rgba(99,102,241,0.1); color: white;
            cursor: pointer; transition: all 0.2s;
        }
        .modal-search-btn:hover { background: rgba(99,102,241,0.2); border-color: rgba(99,102,241,0.6); }

        /* Bottom nav */
        .bottom-nav {
            position: fixed; bottom: 25px; left: 25px;
            background: rgba(10,11,15,0.6); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 12px;
            padding: 10px 20px; display: flex; gap: 25px; z-index: 10; align-items: center;
        }
        .nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer; }
        .nav-link:hover { color: white; }
    </style>
</head>
<body>

<div class="bg-base"></div>
<div class="bg-glow"></div>
<div class="grid-layer"></div>

<div class="main">
    <div class="page-header">
        <div class="page-title">Catalog</div>
        <button class="search-btn" onclick="openModal()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            Filter
        </button>
    </div>

    <div id="catalogGrid" class="catalog-grid">
        <div class="state-msg">Loading...</div>
    </div>
</div>

<!-- Filter Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal">
        <div class="modal-title">Select Category</div>

        <div class="toggle-row">
            <button class="toggle-btn active" id="toggleVerified" onclick="setVerified(true)">Verified & Official</button>
            <button class="toggle-btn" id="toggleUnverified" onclick="setVerified(false)">Not Verified</button>
        </div>

        <hr class="modal-divider">

        <div class="cat-row">
            <button class="cat-btn active" data-cat="" onclick="setCat(this, '')">All</button>
            <button class="cat-btn" data-cat="Accessories" onclick="setCat(this, 'Accessories')">Accessories</button>
            <button class="cat-btn" data-cat="Body" onclick="setCat(this, 'Body')">Body's</button>
            <button class="cat-btn" data-cat="Scripts" onclick="setCat(this, 'Scripts')">Scripts</button>
        </div>

        <hr class="modal-divider">

        <div class="type-row" id="typeRow">
            <button class="cat-btn active" data-type="" onclick="setType(this, '')">All</button>
            <button class="cat-btn" data-type="Head" onclick="setType(this, 'Head')">Head</button>
            <button class="cat-btn" data-type="Face" onclick="setType(this, 'Face')">Face</button>
            <button class="cat-btn" data-type="Neck" onclick="setType(this, 'Neck')">Neck</button>
            <button class="cat-btn" data-type="Shoulder" onclick="setType(this, 'Shoulder')">Shoulder</button>
            <button class="cat-btn" data-type="Front" onclick="setType(this, 'Front')">Front</button>
            <button class="cat-btn" data-type="Back" onclick="setType(this, 'Back')">Back</button>
        </div>

        <button class="modal-search-btn" onclick="applyFilter()">Search</button>
    </div>
</div>

<div class="bottom-nav">
    <span onclick="window.location.href='/'" class="nav-link">Home</span>
    <span onclick="window.open('https://discord.gg/TRPZg4Xfkq','_blank')" class="nav-link">Discord</span>
</div>

<script>
    window.addEventListener('mousemove', e => {
        document.body.style.setProperty('--x', e.clientX + 'px');
        document.body.style.setProperty('--y', e.clientY + 'px');
    });

    let allItems = [];
    let verifiedAuthors = [];
    let filterVerified = true;
    let filterCat = '';
    let filterType = '';

async function loadData() {
    try {
        const infoRes = await fetch('/api/catalog/info');
        const infoText = await infoRes.text();
        const info = JSON.parse(infoText);

        const verRes = await fetch('/api/catalog/verified');
        const verText = await verRes.text();
        const ver = JSON.parse(verText);

        allItems = info.items || [];
        verifiedAuthors = ver.verified || [];
        renderGrid(allItems);
    } catch (e) {
        document.getElementById('catalogGrid').innerHTML = '<div class="state-msg">Error: ' + e.message + '</div>';
    }
}

    function renderGrid(items) {
        const grid = document.getElementById('catalogGrid');
        if (!items.length) {
            grid.innerHTML = '<div class="state-msg">No items found</div>';
            return;
        }
        grid.innerHTML = items.map(item => {
            const previewHtml = item.preview
                ? `<img src="/${item.preview}" alt="${item.name}" onerror="this.parentElement.innerHTML='<span class=\\'no-preview\\'>No preview</span>'">`
                : '<span class="no-preview">No preview</span>';
            return `
            <div class="item-card" onclick="goToItem('${item.id}')">
                <div class="item-preview">${previewHtml}</div>
                <div class="item-info">
                    <div class="item-name">${item.name}</div>
                    <button class="item-btn" onclick="event.stopPropagation();goToItem('${item.id}')">Get Command</button>
                </div>
            </div>`;
        }).join('');
    }

    function goToItem(id) {
        window.location.href = '/catalog/' + id;
    }

    // Modal
    function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
    function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

    function setVerified(val) {
        filterVerified = val;
        document.getElementById('toggleVerified').classList.toggle('active', val);
        document.getElementById('toggleUnverified').classList.toggle('active', !val);
        // Show/hide type row for non-accessory
        document.getElementById('typeRow').style.display = (filterCat === 'Body' || filterCat === 'Scripts') ? 'none' : 'flex';
    }

    function setCat(el, val) {
        filterCat = val;
        document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
        // Hide type filter for Body and Scripts
        const showTypes = val === 'Accessories' || val === '';
        document.getElementById('typeRow').style.display = showTypes ? 'flex' : 'none';
        if (!showTypes) { filterType = ''; document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active')); document.querySelector('[data-type=""]').classList.add('active'); }
    }

    function setType(el, val) {
        filterType = val;
        document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function applyFilter() {
        closeModal();
        let filtered = allItems;

        if (filterVerified) {
            filtered = filtered.filter(i => verifiedAuthors.includes(i.author));
        }
        if (filterCat) {
            filtered = filtered.filter(i => i.category === filterCat);
        }
        if (filterType) {
            filtered = filtered.filter(i => i.type === filterType);
        }

        renderGrid(filtered);
    }

    loadData();
</script>
</body>
</html>
