<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celius | Catalog</title>
    <link rel="icon" type="image/png" href="/site/html/celius.nobg.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #02040a; color: #d1d1d1; font-family: 'Poppins', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; background-position: center; z-index: -3; }
        .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 120px at var(--x,50%) var(--y,50%), rgba(255,255,255,0.05) 0%, transparent 100%); z-index: -2; pointer-events: none; }
        .grid-layer { position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.01) 1px,transparent 1px); background-size: 50px 50px; z-index: -1; }
        .main { position: relative; z-index: 2; padding: 36px 36px 100px; }

        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
        .page-title { font-size: 32px; font-weight: 800; color: white; letter-spacing: 1px; }
        .search-btn { font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 700; padding: 10px 24px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: rgba(10,11,15,0.6); backdrop-filter: blur(20px); color: white; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; }
        .search-btn:hover { border-color: rgba(99,102,241,0.5); color: rgba(160,140,255,1); }

        .section-block { margin-bottom: 40px; }
        .section-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .section-title { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.25); letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
        .section-line { flex: 1; height: 1px; background: rgba(255,255,255,0.05); }
        .subsection-header { display: flex; align-items: center; gap: 12px; margin: 20px 0 12px; }
        .subsection-title { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.15); letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }

        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .item-card { background: rgba(10,11,15,0.55); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color 0.25s, transform 0.2s; display: flex; flex-direction: column; }
        .item-card:hover { border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .item-preview { width: 100%; aspect-ratio: 1; background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .item-preview img { width: 100%; height: 100%; object-fit: cover; }
        .no-preview { font-size: 11px; color: rgba(255,255,255,0.2); font-weight: 600; letter-spacing: 0.5px; }
        .item-info { padding: 12px 14px 14px; }
        .item-name { font-size: 12px; font-weight: 700; color: white; margin-bottom: 10px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-btn { width: 100%; font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 700; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.7); cursor: pointer; transition: all 0.2s; }
        .item-btn:hover { background: rgba(99,102,241,0.15); border-color: rgba(99,102,241,0.4); color: white; }
        .state-msg { text-align: center; padding: 80px 0; font-size: 13px; color: rgba(255,255,255,0.2); font-weight: 600; letter-spacing: 0.5px; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal { background: rgba(10,11,15,0.95); backdrop-filter: blur(30px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 32px; width: 500px; max-width: 92vw; transform: translateY(16px); transition: transform 0.2s; max-height: 90vh; overflow-y: auto; }
        .modal-overlay.open .modal { transform: translateY(0); }
        .modal-title { font-size: 16px; font-weight: 800; color: white; text-align: center; margin-bottom: 22px; }
        .modal-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.25); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
        .modal-divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 20px 0; }
        .toggle-row { display: flex; gap: 10px; margin-bottom: 0; }
        .toggle-btn { flex: 1; font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 700; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.2s; }
        .toggle-btn.active { border-color: rgba(99,102,241,0.5); background: rgba(99,102,241,0.12); color: white; }
        .cat-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .cat-btn { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 700; padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.2s; }
        .cat-btn.active { border-color: rgba(99,102,241,0.5); background: rgba(99,102,241,0.12); color: white; }
        .type-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .script-search-input { width: 100%; font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 600; padding: 11px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: white; outline: none; transition: border-color 0.2s; }
        .script-search-input::placeholder { color: rgba(255,255,255,0.2); }
        .script-search-input:focus { border-color: rgba(99,102,241,0.4); }
        .modal-search-btn { width: 100%; margin-top: 22px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 700; padding: 13px; border-radius: 10px; border: 1px solid rgba(99,102,241,0.3); background: rgba(99,102,241,0.1); color: white; cursor: pointer; transition: all 0.2s; }
        .modal-search-btn:hover { background: rgba(99,102,241,0.2); border-color: rgba(99,102,241,0.6); }

        .bottom-nav { position: fixed; bottom: 25px; left: 25px; background: rgba(10,11,15,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 20px; display: flex; gap: 25px; z-index: 10; align-items: center; }
        .nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer; }
        .nav-link:hover { color: white; }
        .nav-link.active-page { color: rgba(160,140,255,0.8); }
    </style>
</head>
<body>
<div class="bg-base"></div>
<div class="bg-glow"></div>
<div class="grid-layer"></div>

<div class="main">
    <div class="page-header">
        <div class="page-title">Catalog</div>
        <button class="search-btn" onclick="openModal()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            Filter
        </button>
    </div>
    <div id="catalogContent"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal">
        <div class="modal-title">Filter</div>

        <div class="modal-label">Verification</div>
        <div class="toggle-row">
            <button class="toggle-btn active" id="toggleVerified" onclick="setVerified(true)">Verified & Official</button>
            <button class="toggle-btn" id="toggleUnverified" onclick="setVerified(false)">Not Verified</button>
        </div>

        <hr class="modal-divider">
        <div class="modal-label">Category</div>
        <div class="cat-row">
            <button class="cat-btn active" data-cat="" onclick="setCat(this,'')">All</button>
            <button class="cat-btn" data-cat="Accessories" onclick="setCat(this,'Accessories')">Accessories</button>
            <button class="cat-btn" data-cat="Outfits" onclick="setCat(this,'Outfits')">Outfits</button>
            <button class="cat-btn" data-cat="Characters" onclick="setCat(this,'Characters')">Character's</button>
            <button class="cat-btn" data-cat="Scripts" onclick="setCat(this,'Scripts')">Scripts</button>
        </div>

        <!-- Types for Accessories / Characters -->
        <div id="typeSection" style="display:none;">
            <hr class="modal-divider">
            <div class="modal-label" id="typeLabel">Type</div>
            <div class="type-row" id="typeRow"></div>
        </div>

        <!-- Script keyword search -->
        <div id="scriptSearchSection" style="display:none;">
            <hr class="modal-divider">
            <div class="modal-label">Search by game / type</div>
            <input class="script-search-input" id="scriptSearchInput" type="text" placeholder="e.g. Fav, Place, Roleplay...">
        </div>

        <button class="modal-search-btn" onclick="applyFilter()">Search</button>
    </div>
</div>

<div class="bottom-nav">
    <span onclick="window.location.href='/'" class="nav-link">Home</span>
    <span onclick="window.location.href='/catalog'" class="nav-link active-page">Catalog</span>
    <span onclick="window.location.href='/obfuscator'" class="nav-link">Obfuscator</span>
    <span onclick="window.open('https://discord.gg/TRPZg4Xfkq','_blank')" class="nav-link">Discord</span>
</div>

<script>
    const INFO_URL = 'https://ethereos.vercel.app/api/catalog/info';
    const VER_URL  = 'https://ethereos.vercel.app/api/catalog/verified';

    window.addEventListener('mousemove', e => {
        document.body.style.setProperty('--x', e.clientX + 'px');
        document.body.style.setProperty('--y', e.clientY + 'px');
    });

    let allItems = [], verifiedAuthors = [];
    let filterVerified = true, filterCat = '', filterType = '';

    const CAT_ORDER = ['Accessories', 'Outfits', 'Characters', 'Scripts'];
    const CAT_LABELS = { Accessories: 'Accessories', Outfits: "Outfit's", Characters: "Character's", Scripts: 'Scripts' };
    const CAT_TYPES = {
        Accessories: ['Head', 'Face', 'Neck', 'Shoulder', 'Front', 'Back'],
        Characters:  ["Body's", "Face's", 'Dynamic', "Head's Hair"]
    };

    async function loadData() {
        try {
            const infoRes = await fetch(INFO_URL);
            const info = JSON.parse(await infoRes.text());
            const verRes = await fetch(VER_URL);
            const ver = JSON.parse(await verRes.text());
            allItems = info.items || [];
            verifiedAuthors = ver.verified || [];
            renderContent(allItems);
        } catch(e) {
            document.getElementById('catalogContent').innerHTML = '<div class="state-msg">Error: ' + e.message + '</div>';
        }
    }

    function renderContent(items) {
        const content = document.getElementById('catalogContent');
        if (!items.length) { content.innerHTML = '<div class="state-msg">No items found</div>'; return; }

        const grouped = {};
        CAT_ORDER.forEach(c => grouped[c] = []);
        items.forEach(i => {
            const cat = i.category || 'Other';
            if (!grouped[cat]) grouped[cat] = [];
            grouped[cat].push(i);
        });

        let html = '';
        CAT_ORDER.forEach(cat => {
            const catItems = grouped[cat];
            if (!catItems || !catItems.length) return;
            html += `<div class="section-block">`;
            html += `<div class="section-header"><div class="section-title">${CAT_LABELS[cat] || cat}</div><div class="section-line"></div></div>`;

            if (cat === 'Accessories' || cat === 'Characters') {
                const typeOrder = CAT_TYPES[cat];
                const byType = {};
                typeOrder.forEach(t => byType[t] = []);
                catItems.forEach(i => {
                    const t = i.type || 'Other';
                    if (!byType[t]) byType[t] = [];
                    byType[t].push(i);
                });
                let first = true;
                typeOrder.forEach(type => {
                    if (!byType[type] || !byType[type].length) return;
                    html += `<div class="subsection-header">`;
                    if (!first) html += `<div class="section-line"></div>`;
                    html += `<div class="subsection-title">${type}</div><div class="section-line"></div></div>`;
                    first = false;
                    html += `<div class="catalog-grid" style="margin-bottom:8px;">`;
                    byType[type].forEach(i => { html += itemCard(i); });
                    html += `</div>`;
                });
            } else if (cat === 'Scripts') {
                const byType = {};
                catItems.forEach(i => {
                    const t = i.type || 'Other';
                    if (!byType[t]) byType[t] = [];
                    byType[t].push(i);
                });
                let first = true;
                Object.keys(byType).forEach(type => {
                    if (!byType[type].length) return;
                    html += `<div class="subsection-header">`;
                    if (!first) html += `<div class="section-line"></div>`;
                    html += `<div class="subsection-title">${type}</div><div class="section-line"></div></div>`;
                    first = false;
                    html += `<div class="catalog-grid" style="margin-bottom:8px;">`;
                    byType[type].forEach(i => { html += itemCard(i); });
                    html += `</div>`;
                });
            } else {
                html += `<div class="catalog-grid">`;
                catItems.forEach(i => { html += itemCard(i); });
                html += `</div>`;
            }
            html += `</div>`;
        });
        content.innerHTML = html;
    }

    function itemCard(item) {
        const prev = item.preview
            ? `<img src="/${item.preview}" alt="${item.name}" onerror="this.parentElement.innerHTML='<span class=\\'no-preview\\'>No preview</span>'">`
            : '<span class="no-preview">No preview</span>';
        return `<div class="item-card" onclick="goToItem('${item.id}')">
            <div class="item-preview">${prev}</div>
            <div class="item-info">
                <div class="item-name">${item.name}</div>
                <button class="item-btn" onclick="event.stopPropagation();goToItem('${item.id}')">Get Command</button>
            </div>
        </div>`;
    }

    function goToItem(id) { window.location.href = '/catalog/' + id; }

    function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
    function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

    function setVerified(val) {
        filterVerified = val;
        document.getElementById('toggleVerified').classList.toggle('active', val);
        document.getElementById('toggleUnverified').classList.toggle('active', !val);
    }

    function setCat(el, val) {
        filterCat = val; filterType = '';
        document.querySelectorAll('[data-cat]').forEach(b => b.classList.remove('active'));
        el.classList.add('active');

        const typeSection = document.getElementById('typeSection');
        const scriptSection = document.getElementById('scriptSearchSection');
        typeSection.style.display = 'none';
        scriptSection.style.display = 'none';
        document.getElementById('scriptSearchInput').value = '';

        if (val === 'Accessories' || val === 'Characters') {
            const types = CAT_TYPES[val] || [];
            document.getElementById('typeLabel').textContent = val === 'Characters' ? 'Character Type' : 'Accessory Type';
            document.getElementById('typeRow').innerHTML =
                `<button class="cat-btn active" data-type="" onclick="setType(this,'')">All</button>` +
                types.map(t => `<button class="cat-btn" data-type="${t}" onclick="setType(this,'${t}')">${t}</button>`).join('');
            typeSection.style.display = 'block';
        } else if (val === 'Scripts') {
            scriptSection.style.display = 'block';
        }
    }

    function setType(el, val) {
        filterType = val;
        document.querySelectorAll('[data-type]').forEach(b => b.classList.remove('active'));
        el.classList.add('active');
    }

    function applyFilter() {
        closeModal();
        let filtered = allItems;

        if (filterVerified) {
            filtered = filtered.filter(i => verifiedAuthors.includes(i.author));
        } else {
            filtered = filtered.filter(i => !verifiedAuthors.includes(i.author));
        }

        if (filterCat) filtered = filtered.filter(i => i.category === filterCat);
        if (filterType) filtered = filtered.filter(i => i.type === filterType);

        if (filterCat === 'Scripts') {
            const q = document.getElementById('scriptSearchInput').value.trim().toLowerCase();
            if (q) filtered = filtered.filter(i => (i.type || '').toLowerCase().includes(q) || (i.name || '').toLowerCase().includes(q));
        }

        renderContent(filtered);
    }

    loadData();
</script>
</body>
</html>
