<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Expert | Catalog</title>
    <link rel="icon" type="image/png" href="/ss/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #ff0073;
            --bg-dark: #050204;
            --card-bg: rgba(15, 10, 13, 0.55);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-dark); color: #d1d1d1; font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; }

        /* === ФОН С БЛОБАМИ (из catalog_NEW__.html) === */
        .bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; background-position: center; z-index: -5; }
        .bg-grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            z-index: -4;
        }
        .blob {
            position: fixed; border-radius: 50%; filter: blur(150px); opacity: 0.08;
            animation: floatBlob 20s infinite alternate ease-in-out; z-index: -3;
        }
        .blob-1 { top: -10%; left: -10%; width: 40vw; height: 40vw; background: var(--primary); }
        .blob-2 { bottom: -10%; right: 10%; width: 35vw; height: 35vw; background: var(--primary); animation-delay: -7s; }
        @keyframes floatBlob {
            0%   { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 5%) scale(1.1); }
        }
        .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 120px at var(--x,50%) var(--y,50%), rgba(255,255,255,0.05) 0%, transparent 100%); z-index: -2; pointer-events: none; }

        /* === LAYOUT === */
        .main { position: relative; z-index: 2; padding: 36px 36px 120px; height: 100vh; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; }
        .main::-webkit-scrollbar { display: none; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
        .page-title {
            font-size: 32px; font-weight: 800; color: white; letter-spacing: -0.5px;
            background: linear-gradient(to bottom, #fff, #999); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .search-btn {
            font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 700; padding: 10px 24px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08); background: rgba(15,10,13,0.6); backdrop-filter: blur(20px);
            color: white; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .search-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* === СЕКЦИИ === */
        .section-block { margin-bottom: 40px; }
        .section-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
        .section-title { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.25); letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }
        .section-line { flex: 1; height: 1px; background: rgba(255,255,255,0.05); }
        .subsection-header { display: flex; align-items: center; gap: 12px; margin: 20px 0 12px; }
        .subsection-title { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.15); letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; }

        /* === КАРТОЧКИ === */
        .catalog-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
        .item-card { background: var(--card-bg); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; overflow: hidden; cursor: pointer; transition: 0.25s; display: flex; flex-direction: column; }
        .item-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: 0 10px 30px -10px rgba(255,0,115,0.2); }
        .item-preview { width: 100%; aspect-ratio: 1; background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .item-preview img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .item-card:hover .item-preview img { scale: 1.05; }
        .no-preview { font-size: 11px; color: rgba(255,255,255,0.2); font-weight: 600; letter-spacing: 0.5px; }
        .item-info { padding: 12px 14px 14px; }
        .item-name { font-size: 12px; font-weight: 700; color: white; margin-bottom: 10px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .item-btn { width: 100%; font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 700; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.7); cursor: pointer; transition: all 0.2s; }
        .item-btn:hover { background: rgba(255,0,115,0.15); border-color: var(--primary); color: white; }
        .state-msg { text-align: center; padding: 80px 0; font-size: 13px; color: rgba(255,255,255,0.2); font-weight: 600; letter-spacing: 0.5px; }

        /* === МОДАЛ === */
        .modal-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal { background: rgba(10,8,9,0.98); backdrop-filter: blur(30px); border: 1px solid rgba(255,0,115,0.15); border-radius: 16px; padding: 32px; width: 500px; max-width: 92vw; transform: translateY(16px); transition: transform 0.2s; max-height: 90vh; overflow-y: auto; }
        .modal-overlay.open .modal { transform: translateY(0); }
        .modal-title { font-size: 16px; font-weight: 800; color: white; text-align: center; margin-bottom: 22px; }
        .modal-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.25); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
        .modal-divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 20px 0; }
        .toggle-row { display: flex; gap: 10px; }
        .toggle-btn { flex: 1; font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 700; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.2s; }
        .toggle-btn.active { border-color: var(--primary); background: rgba(255,0,115,0.1); color: white; }
        .cat-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .cat-btn { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 700; padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.07); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.4); cursor: pointer; transition: all 0.2s; }
        .cat-btn.active { border-color: var(--primary); background: rgba(255,0,115,0.1); color: white; }
        .type-row { display: flex; gap: 8px; flex-wrap: wrap; }
        .script-search-input { width: 100%; font-family: 'Poppins', sans-serif; font-size: 12px; font-weight: 600; padding: 11px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: white; outline: none; transition: border-color 0.2s; }
        .script-search-input::placeholder { color: rgba(255,255,255,0.2); }
        .script-search-input:focus { border-color: rgba(255,0,115,0.4); }
        .modal-search-btn { width: 100%; margin-top: 22px; font-family: 'Poppins', sans-serif; font-size: 13px; font-weight: 700; padding: 13px; border-radius: 10px; border: 1px solid var(--primary); background: rgba(255,0,115,0.1); color: white; cursor: pointer; transition: all 0.2s; }
        .modal-search-btn:hover { background: var(--primary); }

        /* === NAV === */
        .bottom-nav { position: fixed; bottom: 25px; left: 25px; z-index: 9999; background: rgba(15,10,13,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 20px; display: flex; gap: 25px; align-items: center; }
        .nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer; }
        .nav-link:hover { color: white; }
        .nav-link.active-page { color: var(--primary); }

        /* === TOAST === */
        .toast { position: fixed; bottom: 24px; right: 24px; background: rgba(255,0,115,0.2); backdrop-filter: blur(20px); border: 1px solid var(--primary); color: white; font-size: 12px; font-weight: 600; padding: 10px 20px; border-radius: 10px; transform: translateY(14px); opacity: 0; transition: all 0.22s ease; z-index: 100; pointer-events: none; }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* === CONTEXT MENU === */
        .ctx-menu { position: fixed; z-index: 200; background: rgba(15,10,12,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,0,115,0.2); border-radius: 10px; padding: 6px; min-width: 160px; }
        .ctx-item { font-family: 'Poppins', sans-serif; font-size: 11px; font-weight: 700; padding: 9px 14px; border-radius: 7px; cursor: pointer; color: rgba(255,255,255,0.6); transition: all 0.15s; display: flex; align-items: center; gap: 8px; }
        .ctx-item:hover { background: rgba(255,0,115,0.15); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        body { animation: fadeIn 0.35s ease forwards; }
    </style>
</head>
<body>
<div class="bg-base"></div>
<div class="bg-grid"></div>
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="bg-glow"></div>

<div class="main">
    <div class="page-header">
        <div class="page-title">Catalog</div>
        <button class="search-btn" onclick="openModal()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            Filter
        </button>
    </div>
    <div id="catalogContent"></div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
    <div class="modal">
        <div class="modal-title">Filter</div>
        <div class="modal-label">Verification</div>
        <div class="toggle-row">
            <button class="toggle-btn active" id="toggleVerified" onclick="setVerified(true)">Verified &amp; Official</button>
            <button class="toggle-btn" id="toggleUnverified" onclick="setVerified(false)">Not Verified</button>
        </div>
        <hr class="modal-divider">
        <div class="modal-label">Category</div>
        <div class="cat-row">
            <button class="cat-btn active" data-cat="" onclick="setCat(this,'')">All</button>
            <button class="cat-btn" data-cat="Accessories" onclick="setCat(this,'Accessories')">Accessories</button>
            <button class="cat-btn" data-cat="Outfits" onclick="setCat(this,'Outfits')">Outfits</button>
            <button class="cat-btn" data-cat="Characters" onclick="setCat(this,'Characters')">Character's</button>
            <button class="cat-btn" data-cat="Scripts" onclick="setCat(this,'Scripts')">Scripts</button>
        </div>
        <div id="typeSection" style="display:none;">
            <hr class="modal-divider">
            <div class="modal-label" id="typeLabel">Type</div>
            <div class="type-row" id="typeRow"></div>
        </div>
        <div id="scriptSearchSection" style="display:none;">
            <hr class="modal-divider">
            <div class="modal-label">Search by game / type</div>
            <input class="script-search-input" id="scriptSearchInput" type="text" placeholder="e.g. Fav, Place, Roleplay...">
        </div>
        <button class="modal-search-btn" onclick="applyFilter()">Search</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<div class="ctx-menu" id="ctxMenu" style="display:none;">
    <div class="ctx-item" onclick="ctxCopy()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy Command
    </div>
    <div class="ctx-item" onclick="ctxCopyLink()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        Copy Link
    </div>
    <div class="ctx-item" onclick="ctxOpen()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open Item
    </div>
</div>

<div class="bottom-nav">
    <span onclick="window.location.href='/'" class="nav-link">Home</span>
    <span onclick="window.location.href='/catalog'" class="nav-link active-page">Catalog</span>
    <span onclick="window.location.href='/obfuscator'" class="nav-link">Obfuscator</span>
    <span onclick="window.location.href='/getkey'" class="nav-link">Authentication</span>
    <span onclick="window.location.href='/status'" class="nav-link">Status</span>
    <span onclick="window.open('https://discord.gg/TRPZg4Xfkq','_blank')" class="nav-link">Discord</span>
</div>

<script>
    const INFO_URL = 'https://aqusu.pages.dev/v3/ff/catalog/info.json';
    const VER_URL = 'https://aqusu.pages.dev/v3/ff/catalog/verified.json';

    window.addEventListener('mousemove', e => {
        document.body.style.setProperty('--x', e.clientX + 'px');
        document.body.style.setProperty('--y', e.clientY + 'px');
    });

    let allItems = [], verifiedAuthors = [];
    let filterVerified = true, filterCat = '', filterType = '';

    const CAT_ORDER = ['Accessories', 'Outfits', 'Characters', 'Scripts'];
    const CAT_LABELS = {
        Accessories: 'Accessories',
        Outfits: "Outfit's",
        Characters: "Character's",
        Scripts: 'Scripts'
    };

    const ACC_TYPES = [
        { code: 'Head',     label: 'Head' },
        { code: 'Face',     label: 'Face' },
        { code: 'Neck',     label: 'Neck' },
        { code: 'Shoulder', label: 'Shoulder' },
        { code: 'Front',    label: 'Front' },
        { code: 'Back',     label: 'Back' }
    ];

    const CHAR_TYPES = [
        { code: 'body',  label: "Body's" },
        { code: 'face',  label: "Face's" },
        { code: 'dhead', label: 'Dynamic Head' },
        { code: 'hair',  label: 'Hair' }
    ];

    async function loadData() {
        try {
            const infoRes = await fetch(INFO_URL);
            const info = JSON.parse(await infoRes.text());
            const verRes = await fetch(VER_URL);
            const ver = JSON.parse(await verRes.text());
            allItems = info.items || [];
            verifiedAuthors = ver.verified || [];
            renderContent(allItems);
        } catch(e) {
            document.getElementById('catalogContent').innerHTML = '<div class="state-msg">Error: ' + e.message + '</div>';
        }
    }

    function renderContent(items) {
        const content = document.getElementById('catalogContent');
        if (!items.length) { content.innerHTML = '<div class="state-msg">No items found</div>'; return; }

        const grouped = {};
        CAT_ORDER.forEach(c => grouped[c] = []);
        items.forEach(function(i) {
            var cat = i.category || 'Other';
            if (!grouped[cat]) grouped[cat] = [];
            grouped[cat].push(i);
        });

        var html = '';
        CAT_ORDER.forEach(function(cat) {
            var catItems = grouped[cat];
            if (!catItems || !catItems.length) return;
            html += '<div class="section-block">';
            html += '<div class="section-header"><div class="section-title">' + (CAT_LABELS[cat] || cat) + '</div><div class="section-line"></div></div>';
            if (cat === 'Accessories') {
                html += renderTypedSection(catItems, ACC_TYPES);
            } else if (cat === 'Characters') {
                html += renderTypedSection(catItems, CHAR_TYPES);
            } else if (cat === 'Scripts') {
                var byType = {};
                catItems.forEach(function(i) {
                    var t = i.type || 'Other';
                    if (!byType[t]) byType[t] = [];
                    byType[t].push(i);
                });
                var first = true;
                Object.keys(byType).forEach(function(type) {
                    if (!byType[type].length) return;
                    html += '<div class="subsection-header">';
                    if (!first) html += '<div class="section-line"></div>';
                    html += '<div class="subsection-title">' + type + '</div><div class="section-line"></div></div>';
                    first = false;
                    html += '<div class="catalog-grid" style="margin-bottom:8px;">';
                    byType[type].forEach(function(i) { html += itemCard(i); });
                    html += '</div>';
                });
            } else {
                html += '<div class="catalog-grid">';
                catItems.forEach(function(i) { html += itemCard(i); });
                html += '</div>';
            }
            html += '</div>';
        });
        content.innerHTML = html;
    }

    function renderTypedSection(items, typeList) {
        var byType = {};
        typeList.forEach(function(t) { byType[t.code] = []; });
        items.forEach(function(i) {
            var t = i.type || '';
            if (!byType[t]) byType[t] = [];
            byType[t].push(i);
        });
        var html = '';
        var first = true;
        typeList.forEach(function(t) {
            if (!byType[t.code] || !byType[t.code].length) return;
            html += '<div class="subsection-header">';
            if (!first) html += '<div class="section-line"></div>';
            html += '<div class="subsection-title">' + t.label + '</div><div class="section-line"></div></div>';
            first = false;
            html += '<div class="catalog-grid" style="margin-bottom:8px;">';
            byType[t.code].forEach(function(i) { html += itemCard(i); });
            html += '</div>';
        });
        return html;
    }

    function itemCard(item) {
        var id = item.id;
        var name = item.name || '';
        var preview = item.preview || '';
        var cmd = (item.command || '').replace(/"/g, '&quot;');
        var prevHtml = preview
            ? '<img src="/' + preview + '" alt="" onerror="this.parentElement.innerHTML=\'<span class=no-preview>No preview</span>\'">'
            : '<span class="no-preview">No preview</span>';
        return '<div class="item-card" data-id="' + id + '" data-cmd="' + cmd + '" onclick="goToItem(\'' + id + '\')">'
            + '<div class="item-preview">' + prevHtml + '</div>'
            + '<div class="item-info">'
            + '<div class="item-name">' + name + '</div>'
            + '<button class="item-btn" onclick="event.stopPropagation();goToItem(\'' + id + '\')">Get Command</button>'
            + '</div></div>';
    }

    function goToItem(id) { window.location.href = '/catalog/' + id; }

    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2200);
    }

    var ctxItemId = null;
    var ctxItemCmd = null;

    document.addEventListener('contextmenu', function(e) {
        var card = e.target.closest('.item-card');
        if (!card) { hideCtx(); return; }
        e.preventDefault();
        ctxItemId = card.dataset.id;
        ctxItemCmd = card.dataset.cmd;
        var menu = document.getElementById('ctxMenu');
        menu.style.display = 'block';
        var x = e.clientX, y = e.clientY;
        if (x + 170 > window.innerWidth) x = window.innerWidth - 175;
        if (y + 100 > window.innerHeight) y = window.innerHeight - 105;
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';
    });

    document.addEventListener('click', function() { hideCtx(); });
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') hideCtx(); });

    function hideCtx() { document.getElementById('ctxMenu').style.display = 'none'; }
    function ctxCopy() { hideCtx(); if (!ctxItemCmd) return; navigator.clipboard.writeText(ctxItemCmd).then(function() { showToast('Command copied \u2713'); }); }
    function ctxCopyLink() { hideCtx(); if (!ctxItemId) return; var link = window.location.origin + '/catalog/' + ctxItemId; navigator.clipboard.writeText(link).then(function() { showToast('Link copied \u2713'); }); }
    function ctxOpen() { hideCtx(); if (ctxItemId) window.location.href = '/catalog/' + ctxItemId; }

    function openModal() { document.getElementById('modalOverlay').classList.add('open'); }
    function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
    function closeModalOutside(e) { if (e.target === document.getElementById('modalOverlay')) closeModal(); }

    function setVerified(val) {
        filterVerified = val;
        document.getElementById('toggleVerified').classList.toggle('active', val);
        document.getElementById('toggleUnverified').classList.toggle('active', !val);
    }

    function setCat(el, val) {
        filterCat = val; filterType = '';
        document.querySelectorAll('[data-cat]').forEach(function(b) { b.classList.remove('active'); });
        el.classList.add('active');
        var typeSection = document.getElementById('typeSection');
        var scriptSection = document.getElementById('scriptSearchSection');
        typeSection.style.display = 'none';
        scriptSection.style.display = 'none';
        document.getElementById('scriptSearchInput').value = '';
        if (val === 'Accessories') {
            document.getElementById('typeLabel').textContent = 'Accessory Type';
            buildTypeButtons(ACC_TYPES);
            typeSection.style.display = 'block';
        } else if (val === 'Characters') {
            document.getElementById('typeLabel').textContent = 'Character Type';
            buildTypeButtons(CHAR_TYPES);
            typeSection.style.display = 'block';
        } else if (val === 'Scripts') {
            scriptSection.style.display = 'block';
        }
    }

    function buildTypeButtons(typeList) {
        var row = document.getElementById('typeRow');
        var html = '<button class="cat-btn active" data-type="" onclick="setType(this,\'\')">All</button>';
        typeList.forEach(function(t) {
            html += '<button class="cat-btn" data-type="' + t.code + '" onclick="setType(this,\'' + t.code + '\')">' + t.label + '</button>';
        });
        row.innerHTML = html;
    }

    function setType(el, val) {
        filterType = val;
        document.querySelectorAll('[data-type]').forEach(function(b) { b.classList.remove('active'); });
        el.classList.add('active');
    }

    function applyFilter() {
        closeModal();
        var filtered = allItems.slice();
        if (filterVerified) {
            filtered = filtered.filter(function(i) { return verifiedAuthors.indexOf(i.author) !== -1; });
        } else {
            filtered = filtered.filter(function(i) { return verifiedAuthors.indexOf(i.author) === -1; });
        }
        if (filterCat) filtered = filtered.filter(function(i) { return i.category === filterCat; });
        if (filterType) filtered = filtered.filter(function(i) { return i.type === filterType; });
        if (filterCat === 'Scripts') {
            var q = document.getElementById('scriptSearchInput').value.trim().toLowerCase();
            if (q) filtered = filtered.filter(function(i) {
                return (i.type || '').toLowerCase().indexOf(q) !== -1 || (i.name || '').toLowerCase().indexOf(q) !== -1;
            });
        }
        renderContent(filtered);
    }

    loadData();
</script>
</body>
</html>
