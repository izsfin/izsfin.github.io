<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celius | Obfuscator</title>
    <link rel="icon" type="image/png" href="/site/html/celius.nobg.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: #02040a;
            color: #d1d1d1;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .bg-base {
            position: fixed; inset: 0;
            background-image: url("/site/html/bg.svg");
            background-size: cover; background-position: center;
            z-index: -3;
        }
        .bg-glow {
            position: fixed; inset: 0;
            background: radial-gradient(circle 120px at var(--x, 50%) var(--y, 50%), rgba(255,255,255,0.05) 0%, transparent 100%);
            z-index: -2; pointer-events: none;
        }
        .grid-layer {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.01) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }

        /* Layout */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 28px 28px 0;
            gap: 14px;
            min-height: 0;
            position: relative;
            z-index: 2;
        }

        .editors-row {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            min-height: 0;
        }

        .panel {
            background: rgba(10, 11, 15, 0.55);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .panel:focus-within {
            border-color: rgba(99, 102, 241, 0.3);
        }

        .panel-title {
            font-size: 12px;
            font-weight: 700;
            color: rgba(255,255,255,0.8);
            padding: 13px 16px 11px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            flex-shrink: 0;
            letter-spacing: 0.2px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            padding: 14px 16px !important;
            font-family: 'Poppins', monospace;
            font-size: 12px;
            line-height: 1.75;
            color: rgba(255,255,255,0.7);
            width: 100%;
            }
            textarea:focus {
               outline: none;
            }
        textarea::placeholder { color: rgba(255,255,255,0.15); }
        textarea::-webkit-scrollbar { width: 3px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }

        #outputCode { color: rgba(155, 135, 245, 0.8); font-size: 11px; }

        /* Buttons */
        .buttons-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-group { display: flex; gap: 10px; }

        .btn {
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 700;
            padding: 11px 30px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(10, 11, 15, 0.6);
            backdrop-filter: blur(20px);
            color: white;
            cursor: pointer;
            transition: border-color 0.25s, background 0.25s, transform 0.15s, box-shadow 0.25s;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--bx,50%) var(--by,50%), rgba(255,255,255,0.07) 0%, transparent 55%);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .btn:hover::after { opacity: 1; }

        .btn:hover {
            border-color: rgba(255,255,255,0.15);
            background: rgba(18, 19, 26, 0.75);
            transform: translateY(-1px);
        }
        .btn:active { transform: translateY(0px); }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        .btn-obfuscate {
            border-color: rgba(99, 102, 241, 0.35);
        }
        .btn-obfuscate:hover {
            border-color: rgba(99, 102, 241, 0.65);
            box-shadow: 0 0 18px rgba(99,102,241,0.12);
        }

        /* Limit toggle */
        .limit-toggle {
            display: flex;
            align-items: center;
            background: rgba(10,11,15,0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            overflow: hidden;
            height: 42px;
        }
        .limit-opt {
            font-family: 'Poppins', sans-serif;
            font-size: 11px; font-weight: 700;
            padding: 0 16px; height: 100%;
            display: flex; align-items: center;
            cursor: pointer; transition: all 0.2s;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.3px;
            border: none; background: transparent;
        }
        .limit-opt.active {
            background: rgba(255,255,255,0.06);
            color: white;
        }
        .limit-opt:hover:not(.active) { color: rgba(255,255,255,0.6); }
        .limit-sep { width: 1px; height: 60%; background: rgba(255,255,255,0.07); flex-shrink: 0; }

        /* Status */
        .status-row {
            display: flex;
            align-items: center;
            gap: 8px;
            height: 24px;
            flex-shrink: 0;
            padding: 0 2px;
        }

        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,255,255,0.15);
            flex-shrink: 0;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .status-dot.busy { background: #6366f1; box-shadow: 0 0 7px #6366f1; animation: sdpulse 0.9s ease-in-out infinite; }
        .status-dot.ok   { background: #4ade80; box-shadow: 0 0 7px #4ade80; }
        .status-dot.err  { background: #f87171; box-shadow: 0 0 7px #f87171; }

        @keyframes sdpulse { 0%,100%{opacity:1} 50%{opacity:0.25} }

        .status-text {
            font-size: 11px;
            color: rgba(255,255,255,0.25);
            transition: color 0.3s;
        }
        .status-text.ok   { color: rgba(74,222,128,0.65); }
        .status-text.err  { color: rgba(248,113,113,0.65); }
        .status-text.busy { color: rgba(99,102,241,0.75); }

        /* Bottom nav */
        .bottom-nav {
            position: fixed; bottom: 25px; left: 25px;
            background: rgba(10, 11, 15, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px; padding: 10px 20px;
            display: flex; gap: 25px; z-index: 10; align-items: center;
        }
        .nav-link {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 2px;
            color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer;
        }
        .nav-link:hover { color: white; }
        .nav-link.active-page { color: rgba(160,140,255,0.8); }

        /* Toast */
        .toast {
            position: fixed; bottom: 24px; right: 24px;
            background: rgba(10,11,15,0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(99,102,241,0.35);
            color: rgba(160,140,255,0.9);
            font-size: 12px; font-weight: 600;
            padding: 10px 20px; border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            transform: translateY(14px); opacity: 0;
            transition: all 0.22s ease;
            z-index: 100; pointer-events: none;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        .spacer { height: 68px; flex-shrink: 0; }
        .char-counter { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.18); letter-spacing: 0.5px; white-space: nowrap; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        body { animation: fadeIn 0.35s ease forwards; }
</style>
</head>
<body>

<div class="bg-base"></div>
<div class="bg-glow"></div>
<div class="grid-layer"></div>

<div class="main">

    <div class="editors-row">
        <div class="panel">
            <div class="panel-title">Not Obfuscated Lua Code</div>
            <textarea id="inputCode" placeholder="-- paste your Lua code here..."></textarea>
        </div>
        <div class="panel">
            <div class="panel-title">Obfuscated Lua Code</div>
            <textarea id="outputCode" readonly placeholder="-- obfuscated code will appear here..."></textarea>
        </div>
    </div>

    <div class="buttons-row">
        <div class="btn-group">
            <button class="btn btn-obfuscate" id="runBtn" onclick="runObfuscate()">Obfuscate</button>
            <div class="limit-toggle">
                <button class="limit-opt active" id="limit16k" onclick="setLimit('16k')">16k</button>
                <div class="limit-sep"></div>
                <button class="limit-opt" id="limitInf" onclick="setLimit('inf')">∞</button>
            </div>
            <div class="limit-toggle">
                <button class="limit-opt active" id="modeOriginal" onclick="setMode('original')">Original</button>
                <div class="limit-sep"></div>
                <button class="limit-opt" id="modeVelocity" onclick="setMode('velocity')">Velocity Fix</button>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn" onclick="copyOutput()">Copy</button>
            <button class="btn" onclick="downloadOutput()">Download</button>
        </div>
    </div>

    <div class="status-row">
        <div class="status-dot" id="sDot"></div>
        <span class="status-text" id="sTxt">Ready</span>
        <span style="flex:1"></span>
        <span class="char-counter" id="inCounter">Input: 0 chars</span>
        <span style="width:18px"></span>
        <span class="char-counter" id="outCounter">Output: 0 chars</span>
    </div>

    <div class="spacer"></div>
</div>

<div class="bottom-nav">
    <span onclick="window.location.href='/'" class="nav-link">Home</span>
    <span onclick="window.location.href='/catalog'" class="nav-link">Catalog</span>
    <span onclick="window.location.href='/obfuscator'" class="nav-link active-page">Obfuscator</span>
    <span onclick="window.location.href='/status'" class="nav-link">Status</span>
    <span onclick="window.open('https://discord.gg/TRPZg4Xfkq','_blank')" class="nav-link">Discord</span>
</div>

<div class="toast" id="toast"></div>

<script>
    // Mouse glow tracking
    window.addEventListener('mousemove', e => {
        document.body.style.setProperty('--x', e.clientX + 'px');
        document.body.style.setProperty('--y', e.clientY + 'px');
    });

    // Per-button radial hover
    document.querySelectorAll('.btn').forEach(btn => {
        btn.addEventListener('mousemove', e => {
            const r = btn.getBoundingClientRect();
            btn.style.setProperty('--bx', ((e.clientX - r.left) / r.width * 100) + '%');
            btn.style.setProperty('--by', ((e.clientY - r.top) / r.height * 100) + '%');
        });
    });

    function setStatus(msg, type) {
        const dot = document.getElementById('sDot');
        const txt = document.getElementById('sTxt');
        dot.className = 'status-dot' + (type ? ' ' + type : '');
        txt.className = 'status-text' + (type ? ' ' + type : '');
        txt.textContent = msg;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2200);
    }

    let currentLimit = '16k';
    let currentMode = 'original';

    function setLimit(val) {
        currentLimit = val;
        document.getElementById('limit16k').classList.toggle('active', val === '16k');
        document.getElementById('limitInf').classList.toggle('active', val === 'inf');
    }

    function setMode(val) {
        currentMode = val;
        document.getElementById('modeOriginal').classList.toggle('active', val === 'original');
        document.getElementById('modeVelocity').classList.toggle('active', val === 'velocity');
    }

    async function runObfuscate() {
        const code = document.getElementById('inputCode').value.trim();
        if (!code) { setStatus('No input code', 'err'); return; }

        const btn = document.getElementById('runBtn');
        btn.disabled = true;
        document.getElementById('outputCode').value = '';
        setStatus('Obfuscating...', 'busy');

        try {
            const res = await fetch('/api/obfuscator', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code, limit: currentLimit, velocityFix: currentMode === 'velocity' })
            });
            const data = await res.json();

            if (!res.ok || !data.success) {
                setStatus(data.error || 'Obfuscation failed', 'err');
                return;
            }

            let result = data.result;

            // Обрезаем до 16000 символов если режим 16k
            if (currentLimit === '16k' && result.length > 16000) {
                // Найдём последний перенос строки до 16000
                let cutAt = result.lastIndexOf('\n', 15999);
                if (cutAt < 0) cutAt = 15999;
                result = result.substring(0, cutAt);
                setStatus(`Done — trimmed to 16k  ·  ${result.length} chars`, 'ok');
            } else {
                const kb = (data.size / 1024).toFixed(1);
                const ratio = Math.round(data.size / code.length);
                setStatus(`Done — ${kb} KB  ·  ${ratio}× size increase`, 'ok');
            }

            document.getElementById('outputCode').value = result;
            updateOutCounter(result.length);

        } catch (e) {
            setStatus('Request failed: ' + e.message, 'err');
        } finally {
            btn.disabled = false;
        }
    }

    function copyOutput() {
        const out = document.getElementById('outputCode').value;
        if (!out) { setStatus('Nothing to copy', 'err'); return; }
        navigator.clipboard.writeText(out).then(() => showToast('Copied to clipboard ✓'));
    }

    function downloadOutput() {
        const out = document.getElementById('outputCode').value;
        if (!out) { setStatus('Nothing to download', 'err'); return; }
        const rand = Math.floor(Math.random() * 900000 + 100000);
        const name = `obfuscated-${rand}.lua`;
        const blob = new Blob([out], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        URL.revokeObjectURL(a.href);
        showToast(`Downloaded ${name}`);
    }

    // Char counters
    document.getElementById('inputCode').addEventListener('input', function() {
        var len = this.value.length;
        document.getElementById('inCounter').textContent = 'Input: ' + len.toLocaleString() + ' chars';
    });

    function updateOutCounter(val) {
        document.getElementById('outCounter').textContent = 'Output: ' + (val || 0).toLocaleString() + ' chars';
    }
    document.getElementById('inputCode').addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'Enter') runObfuscate();
    });
</script>
</body>
</html>
