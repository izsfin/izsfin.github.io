<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vellote Forum | Auth</title>
<link rel="icon" type="image/png" href="/site/html/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #ff0073; --bg: #050204; --border: rgba(255,255,255,0.06); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--bg); color: #d1d1d1; font-family: 'Poppins', sans-serif; min-height: 100vh; overflow-x: hidden; animation: fadeIn 0.35s ease forwards; display: flex; flex-direction: column; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

.bg-grid { position: fixed; inset: 0; z-index: -3; background-color: #050204; background-image: linear-gradient(rgba(209,209,209,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(209,209,209,0.04) 1px, transparent 1px); background-size: 40px 40px; }
.bg-svg { position: fixed; inset: 0; z-index: -2; background-image: url("/site/html/tools/bg.svg"); background-size: cover; background-position: center; opacity: 0.55; }
.bg-fade { position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(5,2,4,0) 0%, rgba(5,2,4,0.85) 100%); }

/* ── TOPBAR ── */
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 52px; background: rgba(5,2,4,0.75); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 28px; gap: 8px; }
.topbar-logo { font-size: 11px; font-weight: 800; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-right: 24px; }
.topbar-nav { display: flex; align-items: center; gap: 2px; flex: 1; justify-content: center; }
.topbar-link { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.35); padding: 6px 12px; border-radius: 8px; transition: color 0.2s, background 0.2s; cursor: pointer; border: none; background: none; font-family: 'Poppins',sans-serif; }
.topbar-link:hover, .topbar-link.active-tab { color: rgba(255,145,207,0.9); background: rgba(255,0,115,0.04); }
.topbar-sep { color: rgba(255,255,255,0.15); font-size: 12px; margin: 0 2px; }
.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: 24px; }
.btn-go { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 7px 18px; border-radius: 8px; border: 1px solid rgba(255,0,115,0.35); background: rgba(255,0,115,0.08); color: var(--primary); cursor: pointer; transition: all 0.2s; text-decoration: none; }
.btn-go:hover { background: var(--primary); color: white; }

/* ── CENTER ── */
.page-center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 72px 20px 100px; position: relative; z-index: 2; }

/* ── AUTH CARD ── */
.auth-wrap { width: 100%; max-width: 360px; }
.auth-brand { text-align: center; margin-bottom: 28px; }
.auth-brand-name { font-size: 18px; font-weight: 800; color: white; letter-spacing: 4px; text-transform: uppercase; }
.auth-brand-sub { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.2); margin-top: 4px; }

.auth-card { background: rgba(12,8,11,0.9); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }

/* Tabs */
.auth-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--border); }
.auth-tab { padding: 18px; text-align: center; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; color: rgba(255,255,255,0.2); border: none; background: none; font-family: 'Poppins',sans-serif; transition: color 0.2s, background 0.2s; }
.auth-tab + .auth-tab { border-left: 1px solid var(--border); }
.auth-tab.active { color: white; background: rgba(255,255,255,0.02); }

/* Fields */
.auth-fields { display: flex; flex-direction: column; }
.auth-field { border-bottom: 1px solid var(--border); position: relative; }
.auth-input { width: 100%; background: transparent; border: none; outline: none; font-family: 'Poppins',sans-serif; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); text-align: center; padding: 20px; transition: color 0.2s; }
.auth-input::placeholder { color: rgba(255,255,255,0.18); font-weight: 600; }
.auth-input:focus { color: white; }
.auth-input:focus::placeholder { color: rgba(255,255,255,0.08); }

/* Submit */
.auth-submit { width: 100%; background: transparent; border: none; border-top: 1px solid var(--border); font-family: 'Poppins',sans-serif; font-size: 13px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.55); padding: 20px; cursor: pointer; transition: color 0.2s, background 0.2s; }
.auth-submit:hover { color: white; background: rgba(255,255,255,0.03); }
.auth-submit:disabled { opacity: 0.4; cursor: not-allowed; }

/* Message */
.auth-msg { text-align: center; padding: 12px 20px; font-size: 10px; font-weight: 700; color: rgba(255,145,207,0.8); border-top: 1px solid rgba(255,255,255,0.04); min-height: 40px; display: flex; align-items: center; justify-content: center; }
.auth-msg.err { color: rgba(248,113,113,0.8); }
.auth-msg.ok { color: rgba(74,222,128,0.8); }

.auth-footer { text-align: center; margin-top: 16px; font-size: 9px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,0.15); }
.auth-footer a { color: rgba(255,255,255,0.3); text-decoration: none; transition: color 0.2s; }
.auth-footer a:hover { color: white; }

/* ── BOTTOM NAV ── */
.bottom-nav { position: fixed; bottom: 25px; left: 25px; background: rgba(5,2,4,0.7); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 12px; padding: 10px 20px; display: flex; gap: 25px; z-index: 10; align-items: center; }
.nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer; text-decoration: none; }
.nav-link:hover { color: white; }
.nav-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.1); }
.lang-box { display: flex; gap: 10px; }
.lang-btn { font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.3s; color: rgba(255,255,255,0.2); background: none; border: none; font-family: 'Poppins',sans-serif; }
.lang-btn.active { color: var(--primary); }
.bottom-credit { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: rgba(255,255,255,0.1); text-transform: uppercase; z-index: 10; white-space: nowrap; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-svg"></div>
<div class="bg-fade"></div>

<nav class="topbar">
  <a href="/docs" class="topbar-logo">Vellote</a>
  <div class="topbar-nav">
    <button class="topbar-link" id="tl-login" onclick="switchTab('login')">Login</button>
    <span class="topbar-sep">\</span>
    <button class="topbar-link" id="tl-register" onclick="switchTab('register')">Register</button>
  </div>
  <div class="topbar-right">
    <a href="/docs" class="btn-go">← Forum</a>
  </div>
</nav>

<div class="page-center">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="auth-brand-name">Vellote</div>
      <div class="auth-brand-sub">Forum / Docs</div>
    </div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-register" onclick="switchTab('register')">Register</button>
        <button class="auth-tab" id="tab-login" onclick="switchTab('login')">Login</button>
      </div>
      <div class="auth-fields">
        <div class="auth-field">
          <input class="auth-input" id="field-user" placeholder="Username" autocomplete="username">
        </div>
        <div class="auth-field">
          <input class="auth-input" type="password" id="field-pass" placeholder="Password" autocomplete="current-password">
        </div>
      </div>
      <button class="auth-submit" id="submitBtn" onclick="doSubmit()">Create Account</button>
      <div class="auth-msg" id="authMsg"></div>
    </div>
    <div class="auth-footer">
      <a href="/docs">← Back to forum</a>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="/" class="nav-link">Home</a>
  <a href="/catalog" class="nav-link">Catalog</a>
  <a href="/obfuscator" class="nav-link">Obfuscator</a>
  <a href="/getkey" class="nav-link">Authentication</a>
  <a href="/status" class="nav-link">Status</a>
  <a href="https://discord.gg/TRPZg4Xfkq" class="nav-link" target="_blank">Discord</a>
  <div class="nav-divider"></div>
  <div class="lang-box">
    <button class="lang-btn active">RU</button>
    <button class="lang-btn">EN</button>
  </div>
</nav>
<div class="bottom-credit">© 2026 Vellote. All rights reserved.</div>

<script>
let currentTab = 'register';
const urlTab = new URLSearchParams(window.location.search).get('tab');
if (urlTab === 'login') switchTab('login');

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tl-login').classList.toggle('active-tab', tab==='login');
  document.getElementById('tl-register').classList.toggle('active-tab', tab==='register');
  document.getElementById('submitBtn').textContent = tab==='register' ? 'Create Account' : 'Login';
  document.getElementById('authMsg').textContent = '';
  document.getElementById('authMsg').className = 'auth-msg';
}

function setMsg(text, type) {
  const el = document.getElementById('authMsg');
  el.textContent = text;
  el.className = 'auth-msg' + (type ? ' '+type : '');
}

async function doSubmit() {
  const u = document.getElementById('field-user').value.trim();
  const p = document.getElementById('field-pass').value;
  if (!u || !p) { setMsg('Fill all fields', 'err'); return; }
  if (currentTab==='register' && p.length < 8) { setMsg('Password min 8 chars', 'err'); return; }
  setMsg('Please wait...', '');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  try {
    const r = await fetch('https://misslua.pages.dev/functions/docs/universal.js?action=auth', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({subaction: currentTab, username: u, password: p})
    });
    const d = await r.json();
    if (d.ok && d.token) {
      localStorage.setItem('nq-docs-user', JSON.stringify({username: d.username||u, token: d.token}));
      setMsg(currentTab==='register' ? 'Account created!' : 'Welcome back!', 'ok');
      setTimeout(() => { window.location.href='/docs'; }, 800);
    } else {
      setMsg(d.error || 'Something went wrong', 'err');
      btn.disabled = false;
    }
  } catch(e) {
    setMsg('Network error', 'err');
    btn.disabled = false;
  }
}

document.addEventListener('keydown', e => { if (e.key==='Enter') doSubmit(); });
</script>
</body>
</html>
