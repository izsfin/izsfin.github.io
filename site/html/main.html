<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Aqusu | Main </title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/v3/ss/css/tailwind.css">

    <style>
        :root {
            --primary: #ff0073;
        }

        body {
            margin: 0; padding: 0; background-color: #050204;
            color: #d1d1d1; font-family: 'Poppins', sans-serif;
            display: flex; justify-content: flex-start; align-items: center;
            height: 100vh; overflow: hidden;
        }

        /* Фоновые слои */
        .bg-base { position: fixed; inset: 0; background-image: url("/bg.svg"); background-size: cover; background-position: center; z-index: -5; }

        .bg-grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            z-index: -4;
        }

        .blob {
            position: fixed; border-radius: 50%; filter: blur(150px); opacity: 0.08;
            will-change: transform; animation: floatBlob 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -3;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, var(--primary), transparent 70%); }
        .blob-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: radial-gradient(circle, var(--primary), transparent 70%); animation-delay: -5s; }

        @keyframes floatBlob {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.1); }
        }

        .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 120px at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.05) 0%, transparent 100%); z-index: -2; pointer-events: none; }
        
        .content { max-width: 650px; margin-left: 10%; z-index: 2; }
        
        /* Навигация */
        .bottom-nav {
            position: fixed; bottom: 25px; left: 25px;
            background: rgba(15, 10, 13, 0.4); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px; padding: 10px 20px;
            display: flex; gap: 25px; z-index: 10; align-items: center;
        }
        .nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer; }
        .nav-link:hover { color: white; }
        .nav-link.active-page { color: rgba(255, 145, 207, 0.8); }
        .nav-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.1); }

        .lang-btn { font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.3s; color: rgba(255,255,255,0.2); }
        .lang-btn.active { color: var(--primary); }

        .bottom-credit {
            position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
            font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
            color: rgba(255,255,255,0.15); text-transform: uppercase;
            z-index: 10; white-space: nowrap;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        body { animation: fadeIn 0.35s ease forwards; }
    </style>
</head>
<body>
    <div class="bg-base"></div>
    <div class="bg-grid"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div id="glow" class="bg-glow"></div>

    <div class="content">
        <h1 class="text-white text-5xl font-extrabold tracking-wider mb-6">Aqusu</h1>
        <div id="text-container" class="leading-relaxed text-sm mb-5 text-white/70"></div>
        <div id="signature-container" class="mt-10 text-sm text-white"></div>
        <div class="mt-2 text-[11px] opacity-30 uppercase tracking-widest">Xeln © 2026</div>
    </div>

    <div class="bottom-nav">
        <span onclick="window.location.href='/'" class="nav-link active-page">Home</span>
        <span onclick="window.location.href='/catalog'" class="nav-link">Catalog</span>
        <span onclick="window.location.href='/obfuscator'" class="nav-link">Obfuscator</span>
        <span onclick="window.location.href='/getkey'" class="nav-link">Authentication</span>
        <span onclick="window.location.href='/status'" class="nav-link">Status</span>
        <span onclick="window.open('https://discord.gg/TRPZg4Xfkq','_blank')" class="nav-link">Discord</span>
        <div class="nav-divider"></div>
        <div class="flex gap-2.5">
            <span onclick="setLang('RU')" id="lang-RU" class="lang-btn">RU</span>
            <span onclick="setLang('EN')" id="lang-EN" class="lang-btn">EN</span>
        </div>
    </div>

    <div class="bottom-credit" id="bottomCredit"></div>

    <script>
        // Движение свечения за мышью
        window.addEventListener('mousemove', (e) => {
            document.body.style.setProperty('--x', e.clientX + 'px');
            document.body.style.setProperty('--y', e.clientY + 'px');
        });

        function setLang(lang) {
            const url = new URL(window.location.href);
            url.searchParams.set('lang', lang);
            window.location.href = url.href;
        }

        const currentLang = "{{LANG}}".trim() || "RU";
        const translations = {
            RU: {
                text: `<p><strong>Привет пользователь!</strong> Это файловый хостинг для проектов от <strong>Xeln</strong>. Мы поддерживаем и патчим скрипты каждый день нашей командой!</p><p>Aqusu настроен максимально удобно для поиска и использования наших проектов.</p>`,
                sign: `Искренне,<br><strong>Команда Xeln.</strong>`,
                credit: `Написано ellyMS`
            },
            EN: {
                text: `<p><strong>Hii user!</strong> This is file hosting for <strong>Xeln</strong> projects. Our team maintains and patches scripts daily!</p><p>Aqusu is designed to be user-friendly, making it easy to find and use our projects.</p>`,
                sign: `Sincerely,<br><strong>Xeln.</strong>`,
                credit: `Written by ellyMS`
            }
        };

        const data = translations[currentLang] || translations.RU;
        document.getElementById('text-container').innerHTML = data.text;
        document.getElementById('signature-container').innerHTML = data.sign;
        document.getElementById('bottomCredit').textContent = data.credit;

        const btn = document.getElementById('lang-' + currentLang);
        if (btn) btn.classList.add('active');
    </script>
</body>
</html>
