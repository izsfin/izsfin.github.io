<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting | ML Expert</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #d1d1d1;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Сетка (Фон №2) */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 0, 0, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 0, 0, 0.08) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
        }

        /* bg.svg (Фон №3 - поверх сетки) */
        .bg-svg {
            position: fixed;
            inset: 0;
            background-image: url("/bg.svg");
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            z-index: 2;
        }

        /* Основной контент */
        .main-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            margin: 0 20px;
        }

        /* Центральный блок с blur */
        .redirect-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .redirect-card h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .dots {
            display: inline-block;
            font-size: 32px;
            letter-spacing: 4px;
        }

        .dots span {
            animation: blink 1.4s infinite;
            opacity: 0;
        }

        .dots span:nth-child(1) { animation-delay: 0s; }
        .dots span:nth-child(2) { animation-delay: 0.3s; }
        .dots span:nth-child(3) { animation-delay: 0.6s; }

        @keyframes blink {
            0%, 50% { opacity: 0; }
            60%, 100% { opacity: 1; }
        }

        /* Нижний серый прозрачный контейнер */
        .thanks-card {
            background: rgba(128, 128, 128, 0.25);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .thanks-card p {
            font-size: 18px;
            font-weight: 500;
            color: #2a2a2a;
        }

        /* Меню внизу */
        .bottom-menu {
            position: fixed;
            bottom: 3px;
            left: 0;
            right: 0;
            text-align: center;
            z-index: 20;
        }

        .menu-line {
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #4a4a4a;
        }

        .menu-line.top-line {
            margin-bottom: 2px;
            font-weight: 600;
            color: #3a3a3a;
        }

        .menu-line.bottom-line {
            font-size: 10px;
            color: #5a5a5a;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            .redirect-card {
                padding: 30px 20px;
            }
            .redirect-card h1 {
                font-size: 22px;
            }
            .thanks-card p {
                font-size: 15px;
            }
        }

        /* Анимация появления */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .main-content {
            animation: fadeInUp 0.5s ease forwards;
        }
    </style>
</head>
<body>

    <!-- Фон №2: Сетка -->
    <div class="bg-grid"></div>
    
    <!-- Фон №3: bg.svg -->
    <div class="bg-svg"></div>

    <div class="main-content">
        <!-- Центральный блок с blur -->
        <div class="redirect-card">
            <h1>
                Redirecting to site
                <span class="dots">
                    <span>.</span><span>.</span><span>.</span>
                </span>
            </h1>
        </div>

        <!-- Нижний серый прозрачный контейнер -->
        <div class="thanks-card">
            <p>Thanks for using ML!</p>
        </div>
    </div>

    <!-- Меню внизу (отступ 3px от низа) -->
    <div class="bottom-menu">
        <div class="menu-line top-line">Mister Lerp</div>
        <div class="menu-line bottom-line">by absolute.lerp — YOMKA PDRILLA</div>
    </div>

    <script>
        // Перенаправление на главный сайт через 2 секунды
        setTimeout(function() {
            window.location.href = "https://misslua.pages.dev/";
        }, 2000);

        // Добавляем анимацию для точек
        const dots = document.querySelectorAll('.dots span');
        if (dots.length === 0) {
            const dotsContainer = document.querySelector('.dots');
            if (dotsContainer) {
                dotsContainer.innerHTML = '<span>.</span><span>.</span><span>.</span>';
            }
        }
    </script>
</body>
</html>
