<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vellote | Key System</title>
    <link rel="icon" type="image/png" href="/site/html/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --accent: #a78bfa; }

        body {
            background-color: #02040a; color: #d1d1d1;
            font-family: 'Poppins', sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        .bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; background-position: center; z-index: -3; }
        .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 160px at var(--x,50%) var(--y,50%), rgba(167,139,250,0.1) 0%, transparent 100%); z-index: -2; pointer-events: none; }
        .grid-layer { position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.01) 1px,transparent 1px); background-size: 50px 50px; z-index: -1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes stepIn { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: translateX(0); } }

        body { animation: fadeIn 0.35s ease forwards; }

        /* Loader */
        .loader-wrap { text-align: center; z-index: 10; }
        .cup { font-size: 52px; display: inline-block; animation: spin 2s linear infinite; margin-bottom: 16px; }
        .loader-text { font-size: 9px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,0.25); }

        /* Card */
        .glass-card {
            background: rgba(10,11,15,0.75); backdrop-filter: blur(28px);
            border: 1px solid rgba(255,255,255,0.07); border-radius: 22px;
            padding: 36px 38px; width: 420px; max-width: 94vw;
            position: relative; z-index: 10;
            display: none;
        }

        /* Back button */
        .back-btn {
            position: absolute; top: 18px; left: 18px;
            width: 32px; height: 32px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.07);
            background: rgba(255,255,255,0.03);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s; color: rgba(255,255,255,0.4);
            font-size: 14px;
        }
        .back-btn:hover { border-color: rgba(167,139,250,0.4); color: var(--accent); }

        /* Step */
        .step { animation: stepIn 0.22s ease forwards; }

        /* Title */
        .card-title { font-size: 22px; font-weight: 800; color: white; letter-spacing: 0.5px; margin-bottom: 6px; text-align: center; }
        .card-sub { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.2); letter-spacing: 3px; text-transform: uppercase; text-align: center; margin-bottom: 28px; }

        /* Duration grid */
        .duration-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .dur-btn {
            font-family: 'Poppins', sans-serif;
            font-size: 12px; font-weight: 700; padding: 16px 12px;
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.6);
            cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
            position: relative;
        }
        .dur-btn:hover:not(.soon) { border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); color: white; transform: translateY(-1px); }
        .dur-btn.soon { opacity: 0.3; cursor: not-allowed; }
        .dur-btn.soon::after { content: 'SOON'; position: absolute; top: -6px; right: -6px; font-size: 8px; background: var(--accent); color: #02040a; padding: 2px 5px; border-radius: 4px; font-weight: 800; }
        .dur-btn.promo { border-color: rgba(167,139,250,0.2); color: var(--accent); }
        .dur-btn.promo:hover { border-color: rgba(167,139,250,0.5); background: rgba(167,139,250,0.1); }

        /* Progress */
        .progress-label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.45); letter-spacing: 1.5px; text-transform: uppercase; text-align: center; margin-bottom: 20px; }
        .bar-wrap { background: rgba(0,0,0,0.5); height: 6px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.04); margin-bottom: 10px; }
        .bar-fill { height: 100%; width: 0%; background: var(--accent); box-shadow: 0 0 12px var(--accent); transition-property: width; transition-timing-function: linear; }
        .bar-time { font-size: 10px; color: rgba(255,255,255,0.2); font-weight: 600; text-align: center; margin-bottom: 24px; }

        .discord-gate { text-align: center; margin-top: 8px; }
        .discord-btn {
            display: inline-block; font-family: 'Poppins', sans-serif;
            font-size: 11px; font-weight: 700; padding: 12px 28px;
            border-radius: 10px; background: #5865F2; color: white;
            border: none; cursor: pointer; transition: all 0.2s; letter-spacing: 0.5px;
            text-decoration: none;
        }
        .discord-btn:hover { background: #4752c4; transform: translateY(-1px); }

        /* Get Key button */
        .get-key-btn {
            width: 100%; font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 700; padding: 13px;
            border-radius: 11px; border: 1px solid rgba(74,222,128,0.3);
            background: rgba(74,222,128,0.08); color: #4ade80;
            cursor: pointer; transition: all 0.2s; margin-top: 14px;
        }
        .get-key-btn:hover { background: rgba(74,222,128,0.15); border-color: rgba(74,222,128,0.5); }

        /* Promo input */
        .promo-input {
            width: 100%; font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 700; padding: 14px 16px;
            border-radius: 11px; border: 1px solid rgba(255,255,255,0.07);
            background: rgba(0,0,0,0.4); color: white;
            outline: none; text-align: center; letter-spacing: 2px;
            text-transform: uppercase; transition: border-color 0.2s;
            margin-bottom: 12px;
        }
        .promo-input:focus { border-color: rgba(167,139,250,0.4); }
        .promo-input::placeholder { color: rgba(255,255,255,0.15); letter-spacing: 1px; }

        /* Action btn */
        .action-btn {
            width: 100%; font-family: 'Poppins', sans-serif;
            font-size: 13px; font-weight: 700; padding: 13px;
            border-radius: 11px; border: 1px solid rgba(255,255,255,0.07);
            background: rgba(255,255,255,0.04); color: white;
            cursor: pointer; transition: all 0.2s;
        }
        .action-btn:hover { border-color: rgba(167,139,250,0.4); background: rgba(167,139,250,0.08); }

        /* Key result */
        .key-box {
            background: rgba(0,0,0,0.5); border: 1px dashed rgba(167,139,250,0.4);
            border-radius: 10px; padding: 16px; font-family: monospace;
            font-size: 18px; font-weight: 700; color: var(--accent);
            text-align: center; margin: 20px 0; letter-spacing: 2px;
            user-select: all; word-break: break-all;
        }
        .key-expires { font-size: 10px; color: rgba(255,255,255,0.2); font-weight: 600; text-align: center; margin-bottom: 16px; letter-spacing: 0.5px; }

        /* Toast */
        .toast { position: fixed; bottom: 24px; right: 24px; background: rgba(10,11,15,0.9); backdrop-filter: blur(20px); border: 1px solid rgba(167,139,250,0.35); color: var(--accent); font-size: 12px; font-weight: 600; padding: 10px 20px; border-radius: 10px; transform: translateY(14px); opacity: 0; transition: all 0.22s ease; z-index: 100; pointer-events: none; }
        .toast.show { transform: translateY(0); opacity: 1; }

        /* Bottom nav */
        .bottom-nav { position: fixed; bottom: 25px; left: 25px; background: rgba(10,11,15,0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 10px 20px; display: flex; gap: 25px; z-index: 10; align-items: center; }
        .nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer; }
        .nav-link:hover { color: white; }
        .nav-link.active-page { color: rgba(160,140,255,0.8); }
    </style>
</head>
<body>
<div class="bg-base"></div>
<div class="bg-glow"></div>
<div class="grid-layer"></div>

<!-- Loader -->
<div id="loaderScreen" class="loader-wrap">
    <div class="cup">☕</div>
    <div class="loader-text">Initializing Key System</div>
</div>

<!-- Card -->
<div class="glass-card" id="mainCard">

    <!-- Back button (hidden on selection screen) -->
    <div class="back-btn" id="backBtn" style="display:none;" onclick="goBack()">←</div>

    <!-- Step: Select duration -->
    <div id="stepSelect" class="step">
        <div class="card-title">Key System</div>
        <div class="card-sub">Select access duration</div>
        <div class="duration-grid">
            <button class="dur-btn" onclick="startTask(0.5, 20)">12 Hours</button>
            <button class="dur-btn" onclick="startTask(1, 30)">1 Day</button>
            <button class="dur-btn" onclick="startTask(3, 60)">3 Days</button>
            <button class="dur-btn" onclick="startTask(7, 90)">7 Days</button>
            <button class="dur-btn soon">12 Days</button>
            <button class="dur-btn promo" onclick="goStep('stepPromo')">Promo Code</button>
        </div>
    </div>

    <!-- Step: Progress -->
    <div id="stepProgress" class="step" style="display:none;">
        <div class="card-title" style="margin-bottom:24px;">Verifying</div>
        <div class="progress-label" id="progressLabel">Generating secure link...</div>
        <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
        <div class="bar-time" id="barTime">Please wait...</div>
        <div class="discord-gate" id="discordGate" style="display:none;">
            <a href="https://discord.gg/TRPZg4Xfkq" target="_blank" class="discord-btn" onclick="revealGetKey()">Join Discord</a>
        </div>
        <button class="get-key-btn" id="getKeyBtn" style="display:none;" onclick="generateKey()">Get Key</button>
    </div>

    <!-- Step: Promo -->
    <div id="stepPromo" class="step" style="display:none;">
        <div class="card-title">Promo Code</div>
        <div class="card-sub">Enter your code below</div>
        <input class="promo-input" id="promoInput" type="text" placeholder="ENTER CODE" autocomplete="off">
        <button class="action-btn" onclick="checkPromo()">Redeem</button>
    </div>

    <!-- Step: Result -->
    <div id="stepResult" class="step" style="display:none;">
        <div class="card-title">Your Key</div>
        <div class="card-sub">Click the key to select all</div>
        <div class="key-box" id="finalKey">—</div>
        <div class="key-expires" id="keyExpires"></div>
        <button class="action-btn" onclick="copyKey()">Copy to Clipboard</button>
    </div>

</div>

<div class="toast" id="toast"></div>

<div class="bottom-nav">
    <span onclick="window.location.href='/'" class="nav-link">Home</span>
    <span onclick="window.location.href='/catalog'" class="nav-link">Catalog</span>
    <span onclick="window.location.href='/obfuscator'" class="nav-link">Obfuscator</span>
    <span onclick="window.location.href='/getkey'" class="nav-link active-page">Authentication</span>
    <span onclick="window.location.href='/status'" class="nav-link">Status</span>
    <span onclick="window.open('https://discord.gg/TRPZg4Xfkq','_blank')" class="nav-link">Discord</span>
</div>

<script>
    window.addEventListener('mousemove', e => {
        document.body.style.setProperty('--x', e.clientX + 'px');
        document.body.style.setProperty('--y', e.clientY + 'px');
    });

    // Loader
    setTimeout(function() {
        document.getElementById('loaderScreen').style.display = 'none';
        document.getElementById('mainCard').style.display = 'block';
    }, 2500);

    var selectedDays = 0;
    var currentStep = 'stepSelect';
    var stepHistory = [];
    var timerInterval = null;

    var PROMOS = {};

    // Duration label → days number
    var LABEL_TO_DAYS = { '12H': 0.5, '1D': 1, '3D': 3, '7D': 7, '30D': 30, '90D': 90 };

    async function loadPromos() {
        try {
            var res = await fetch('https://vellote.vercel.app/api/promocodes');
            var data = await res.json();
            // data = { "Spectral": { days: "7D", uses: 15 }, ... }
            Object.keys(data).forEach(function(code) {
                var entry = data[code];
                var days = LABEL_TO_DAYS[entry.days];
                if (days && entry.uses > 0) {
                    PROMOS[code.toUpperCase()] = days;
                }
            });
        } catch(e) {
            // fallback if API unreachable
            PROMOS = { 'FREEVEX': 1, 'OWNER': 90 };
        }
    }

    loadPromos();

    function showToast(msg) {
        var t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(function() { t.classList.remove('show'); }, 2200);
    }

    function goStep(id) {
        document.getElementById(currentStep).style.display = 'none';
        document.getElementById(id).classList.remove('step');
        void document.getElementById(id).offsetWidth;
        document.getElementById(id).classList.add('step');
        document.getElementById(id).style.display = 'block';
        stepHistory.push(currentStep);
        currentStep = id;
        document.getElementById('backBtn').style.display = (id === 'stepSelect') ? 'none' : 'flex';
    }

    function goBack() {
        if (!stepHistory.length) return;
        // Reset progress if going back from progress step
        if (currentStep === 'stepProgress') {
            clearInterval(timerInterval);
            document.getElementById('barFill').style.width = '0%';
            document.getElementById('barFill').style.transition = 'none';
            document.getElementById('discordGate').style.display = 'none';
            document.getElementById('getKeyBtn').style.display = 'none';
            document.getElementById('progressLabel').textContent = 'Generating secure link...';
            document.getElementById('barTime').style.display = 'block';
            document.getElementById('barTime').textContent = 'Please wait...';
        }
        var prev = stepHistory.pop();
        document.getElementById(currentStep).style.display = 'none';
        document.getElementById(prev).classList.remove('step');
        void document.getElementById(prev).offsetWidth;
        document.getElementById(prev).classList.add('step');
        document.getElementById(prev).style.display = 'block';
        currentStep = prev;
        document.getElementById('backBtn').style.display = (prev === 'stepSelect') ? 'none' : 'flex';
    }

    function startTask(days, sec) {
        selectedDays = days;
        goStep('stepProgress');

        var fill = document.getElementById('barFill');
        fill.style.transition = 'none';
        fill.style.width = '0%';
        void fill.offsetWidth;
        fill.style.transition = 'width ' + sec + 's linear';
        setTimeout(function() { fill.style.width = '100%'; }, 80);

        // Countdown timer
        var remaining = sec;
        document.getElementById('barTime').textContent = remaining + 's remaining...';
        timerInterval = setInterval(function() {
            remaining--;
            if (remaining > 0) {
                document.getElementById('barTime').textContent = remaining + 's remaining...';
            }
        }, 1000);

        setTimeout(function() {
            clearInterval(timerInterval);
            document.getElementById('progressLabel').textContent = 'Security check passed ✓';
            document.getElementById('barTime').style.display = 'none';
            document.getElementById('discordGate').style.display = 'block';
        }, sec * 1000);
    }

    function revealGetKey() {
        setTimeout(function() {
            document.getElementById('getKeyBtn').style.display = 'block';
        }, 1500);
    }

    async function generateKey() {
        document.getElementById('getKeyBtn').disabled = true;
        document.getElementById('getKeyBtn').textContent = 'Generating...';
        try {
            var res = await fetch('/api/gen?days=' + selectedDays + '&client=web');
            var data = await res.json();
            if (data.key) {
                showResult(data.key, data.expires);
            } else {
                showToast('Error: ' + (data.error || 'Unknown error'));
                document.getElementById('getKeyBtn').disabled = false;
                document.getElementById('getKeyBtn').textContent = 'Get Key';
            }
        } catch(e) {
            showToast('Server error');
            document.getElementById('getKeyBtn').disabled = false;
            document.getElementById('getKeyBtn').textContent = 'Get Key';
        }
    }

    function checkPromo() {
        var val = document.getElementById('promoInput').value.toUpperCase().trim();
        if (PROMOS[val] !== undefined) {
            selectedDays = PROMOS[val];
            generateKeyDirect();
        } else {
            showToast('Invalid promo code');
        }
    }

    async function generateKeyDirect() {
        try {
            var res = await fetch('/api/gen?days=' + selectedDays + '&client=promo');
            var data = await res.json();
            if (data.key) {
                showResult(data.key, data.expires);
            } else {
                showToast('Error: ' + (data.error || 'Unknown'));
            }
        } catch(e) { showToast('Server error'); }
    }

    function showResult(key, expires) {
        goStep('stepResult');
        document.getElementById('finalKey').textContent = key;
        if (expires) {
            var d = new Date(expires);
            document.getElementById('keyExpires').textContent = 'Expires: ' + d.toLocaleString();
        }
    }

    function copyKey() {
        var k = document.getElementById('finalKey').textContent;
        navigator.clipboard.writeText(k).then(function() { showToast('Key copied ✓'); });
    }
</script>
</body>
</html>
