<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winxs | Key System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --main: #d68efa; }
        body {
            margin: 0; padding: 0; background-color: #02040a;
            color: #d1d1d1; font-family: 'Poppins', sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }

        /* ТВОЙ ФОН */
        .bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; background-position: center; z-index: -3; }
        .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 150px at var(--x, 50%) var(--y, 50%), rgba(214, 142, 250, 0.15) 0%, transparent 100%); z-index: -2; pointer-events: none; }
        .grid-layer { position: fixed; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 50px 50px; z-index: -1; }

        /* ГЛАСС-МОРФИЗМ КОНТЕЙНЕР */
        .glass-card {
            background: rgba(10, 11, 15, 0.8);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        /* ЛОАДЕР КРУЖКА */
        .cup-loader { font-size: 60px; animation: spin 2s infinite linear; display: inline-block; margin-bottom: 20px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* КНОПКИ */
        .grid-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 25px; }
        .btn-vex {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 16px; border-radius: 12px;
            font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-vex:hover { border-color: var(--main); background: rgba(214, 142, 250, 0.1); color: white; transform: translateY(-2px); }

        /* ПРОГРЕСС БАР */
        .progress-container { margin-top: 30px; display: none; }
        .bar-bg { background: rgba(0,0,0,0.4); height: 8px; border-radius: 10px; overflow: hidden; margin: 15px 0; border: 1px solid rgba(255,255,255,0.05); }
        .bar-fill { background: var(--main); height: 100%; width: 0%; transition: linear; box-shadow: 0 0 15px var(--main); }

        .back-arrow {
            position: absolute; top: 20px; left: 20px;
            cursor: pointer; opacity: 0.5; transition: 0.3s;
            font-size: 20px;
        }
        .back-arrow:hover { opacity: 1; color: var(--main); }

        .key-box {
            background: rgba(0,0,0,0.5); border: 1px dashed var(--main);
            padding: 15px; font-family: monospace; font-size: 18px;
            color: var(--main); margin: 20px 0; user-select: all;
        }

        .soon { opacity: 0.4; cursor: not-allowed; position: relative; }
        .soon::after { content: 'SOON'; position: absolute; top: -5px; right: -5px; font-size: 8px; background: var(--main); color: black; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="bg-base"></div>
    <div id="glow" class="bg-glow"></div>
    <div class="grid-layer"></div>

    <div id="loader-screen" class="text-center z-50">
        <div class="cup-loader">☕</div>
        <p class="text-[10px] font-bold tracking-[0.5em] uppercase text-white/50">Initializing VexPass</p>
    </div>

    <div class="glass-card" id="main-card" style="display: none;">
        <div class="back-arrow" onclick="location.reload()">←</div>
        
        <div id="step-selection">
            <h2 class="text-2xl font-extrabold tracking-tighter text-white mb-2">KEY SYSTEM</h2>
            <p class="text-[9px] text-gray-500 font-bold tracking-[0.3em] uppercase mb-6">Select Access Duration</p>
            
            <div class="grid-menu">
                <button class="btn-vex" onclick="startTask(0.5, 30)">12 Hours</button>
                <button class="btn-vex" onclick="startTask(1, 60)">1 Day</button>
                <button class="btn-vex" onclick="startTask(3, 120)">3 Days</button>
                <button class="btn-vex" onclick="startTask(7, 300)">7 Days</button>
                <button class="btn-vex soon">12 Days</button>
                <button class="btn-vex" onclick="showPromo()">Promo Code</button>
            </div>
        </div>

        <div id="step-progress" class="progress-container">
            <h3 id="status-label" class="text-[10px] font-bold tracking-[0.2em] uppercase text-white/70">Generating secure link...</h3>
            <div class="bar-bg">
                <div id="fill" class="bar-fill"></div>
            </div>
            <p id="timer-text" class="text-[10px] text-gray-500 mt-2">Please wait...</p>
            
            <div id="discord-gate" style="display:none;" class="mt-6 animate-bounce">
                <a href="https://discord.gg/YOUR_LINK" target="_blank" onclick="revealGetKey()" class="text-white bg-[#5865F2] px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest">Join Discord</a>
            </div>
            
            <button id="get-key-final" style="display:none;" class="btn-vex w-full mt-4 !border-[#4ade80] text-[#4ade80]" onclick="generateKey()">Get Key</button>
        </div>

        <div id="step-promo" style="display:none;">
            <h2 class="text-xl font-bold text-white mb-4 uppercase tracking-widest">Enter Code</h2>
            <input type="text" id="promo-val" placeholder="WRITE CODE" class="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-center text-white focus:outline-none focus:border-purple-400 transition-all uppercase tracking-widest">
            <button class="btn-vex w-full mt-4" onclick="checkPromo()">Redeem</button>
        </div>

        <div id="step-result" style="display:none;">
            <h2 class="text-white font-bold tracking-widest uppercase text-sm">Your Access Key</h2>
            <div class="key-box" id="final-key">VEX-ERROR-001</div>
            <button class="btn-vex w-full" onclick="copyKey()">Copy to Clipboard</button>
        </div>
    </div>

    <script>
        let selectedDays = 0;

        // Mouse Glow
        window.addEventListener('mousemove', (e) => {
            document.body.style.setProperty('--x', e.clientX + 'px');
            document.body.style.setProperty('--y', e.clientY + 'px');
        });

        // ПЕРВАЯ ЗАГРУЗКА 5 СЕК
        setTimeout(() => {
            document.getElementById('loader-screen').style.display = 'none';
            document.getElementById('main-card').style.display = 'block';
        }, 5000);

        function startTask(days, sec) {
            selectedDays = days;
            document.getElementById('step-selection').style.display = 'none';
            document.getElementById('step-progress').style.display = 'block';
            
            const fill = document.getElementById('fill');
            fill.style.transition = `width ${sec}s linear`;
            
            setTimeout(() => {
                fill.style.width = '100%';
            }, 100);

            setTimeout(() => {
                document.getElementById('status-label').innerText = "Security Check Passed";
                document.getElementById('discord-gate').style.display = 'block';
                document.getElementById('timer-text').style.display = 'none';
            }, sec * 1000);
        }

        function revealGetKey() {
            document.getElementById('get-key-final').style.display = 'block';
        }

        async function generateKey() {
            try {
                const res = await fetch(`/api/gen?days=${selectedDays}&client=web`);
                const data = await res.json();
                if(data.key) {
                    showResult(data.key);
                }
            } catch(e) { alert("Server Error"); }
        }

        function showPromo() {
            document.getElementById('step-selection').style.display = 'none';
            document.getElementById('step-promo').style.display = 'block';
        }

        function checkPromo() {
            const val = document.getElementById('promo-val').value.toUpperCase();
            // Пример промокодов
            const promos = {"FREEVEX": 1, "VEX30": 30, "OWNER": 90};
            if(promos[val]) {
                selectedDays = promos[val];
                generateKey();
            } else {
                alert("Invalid Code");
            }
        }

        function showResult(key) {
            document.getElementById('step-progress').style.display = 'none';
            document.getElementById('step-promo').style.display = 'none';
            document.getElementById('step-result').style.display = 'block';
            document.getElementById('final-key').innerText = key;
        }

        function copyKey() {
            const k = document.getElementById('final-key').innerText;
            navigator.clipboard.writeText(k);
            alert("KEY COPIED!");
        }
    </script>
</body>
</html>
