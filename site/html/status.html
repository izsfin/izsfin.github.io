<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereos | Status</title>
    <link rel="icon" type="image/png" href="/site/html/celius.nobg.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #02040a; color: #d1d1d1;
            font-family: 'Poppins', sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .bg-base { position: fixed; inset: 0; background-image: url("/site/html/bg.svg"); background-size: cover; background-position: center; z-index: -3; }
        .bg-glow { position: fixed; inset: 0; background: radial-gradient(circle 120px at var(--x,50%) var(--y,50%), rgba(255,255,255,0.05) 0%, transparent 100%); z-index: -2; pointer-events: none; }
        .grid-layer { position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,0.01) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.01) 1px,transparent 1px); background-size: 50px 50px; z-index: -1; }

        /* Header */
        .page-header {
            position: relative; z-index: 2;
            padding: 28px 32px 0;
            display: flex; align-items: flex-end; justify-content: space-between;
        }
        .page-title { font-size: 28px; font-weight: 800; color: white; letter-spacing: 1px; }
        .page-sub { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.2); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }

        /* Platform toggle */
        .platform-toggle {
            display: flex; align-items: center;
            background: rgba(10,11,15,0.7); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.07); border-radius: 10px;
            overflow: hidden; height: 36px;
        }
        .plat-btn {
            font-family: 'Poppins', sans-serif;
            font-size: 11px; font-weight: 700; padding: 0 20px; height: 100%;
            display: flex; align-items: center; cursor: pointer;
            color: rgba(255,255,255,0.3); border: none; background: transparent;
            transition: all 0.2s; letter-spacing: 0.5px;
        }
        .plat-btn.active { background: rgba(99,102,241,0.12); color: white; }
        .plat-sep { width: 1px; height: 60%; background: rgba(255,255,255,0.07); }

        /* Main layout */
        .main-layout {
            flex: 1; display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px; padding: 16px 32px 80px;
            min-height: 0; position: relative; z-index: 2;
        }

        /* Glass panel */
        .glass-panel {
            background: rgba(10,11,15,0.6); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.06); border-radius: 16px;
            padding: 20px 22px; display: flex; flex-direction: column;
            min-height: 0; overflow: hidden;
        }
        .panel-title {
            font-size: 10px; font-weight: 700; color: rgba(99,102,241,0.8);
            letter-spacing: 2px; text-transform: uppercase;
            border-bottom: 1px solid rgba(99,102,241,0.15);
            padding-bottom: 8px; margin-bottom: 12px; flex-shrink: 0;
        }

        /* Scroll */
        .scroll-area { overflow-y: auto; flex: 1; scrollbar-width: none; -ms-overflow-style: none; }
        .scroll-area::-webkit-scrollbar { display: none; }

        /* Exploit rows */
        .exploit-list { display: flex; flex-direction: column; gap: 2px; }
        .cat-label {
            font-size: 9px; font-weight: 800; color: rgba(99,102,241,0.6);
            letter-spacing: 1.5px; text-transform: uppercase;
            margin-top: 14px; margin-bottom: 4px; display: block;
        }
        .cat-label:first-child { margin-top: 0; }
        .exploit-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 10px; font-weight: 600; padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.55);
        }
        .s-working      { color: #4ade80; }
        .s-unknown      { color: #fbbf24; opacity: 0.8; }
        .s-dead         { color: #ef4444; opacity: 0.7; }
        .s-discontinued { color: #ef4444; opacity: 0.45; }
        .s-patched      { color: #ef4444; opacity: 0.7; }

        /* Projects panel */
        .project-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 14px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(255,255,255,0.02);
            margin-bottom: 8px;
        }
        .project-name { font-size: 12px; font-weight: 700; color: white; }
        .project-badge {
            font-size: 10px; font-weight: 700; padding: 3px 12px;
            border-radius: 6px; letter-spacing: 0.5px;
        }
        .badge-working { background: rgba(74,222,128,0.1); color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
        .badge-patched { background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.2); }
        .badge-unknown { background: rgba(251,191,36,0.1); color: #fbbf24; border: 1px solid rgba(251,191,36,0.2); }

        /* Bottom nav */
        .bottom-nav {
            position: fixed; bottom: 25px; left: 25px;
            background: rgba(10,11,15,0.6); backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 12px;
            padding: 10px 20px; display: flex; gap: 25px; z-index: 10; align-items: center;
        }
        .nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer; }
        .nav-link:hover { color: white; }
        .nav-link.active-page { color: rgba(160,140,255,0.8); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        body { animation: fadeIn 0.35s ease forwards; }

        .section-fade { animation: fadeIn 0.25s ease forwards; }
    </style>
</head>
<body>
<div class="bg-base"></div>
<div class="bg-glow"></div>
<div class="grid-layer"></div>

<div class="page-header">
    <div>
        <div class="page-title">Status</div>
        <div class="page-sub" id="syncTime">Syncing...</div>
    </div>
    <div class="platform-toggle">
        <button class="plat-btn active" id="platPC" onclick="setPlatform('pc')">PC</button>
        <div class="plat-sep"></div>
        <button class="plat-btn" id="platMobile" onclick="setPlatform('mobile')">Mobile</button>
    </div>
</div>

<div class="main-layout">
    <!-- Left: Exploits -->
    <div class="glass-panel">
        <div class="panel-title" id="exploitPanelTitle">Executors</div>
        <div class="scroll-area">
            <div class="exploit-list" id="exploitList"></div>
        </div>
    </div>

    <!-- Right: Projects -->
    <div class="glass-panel">
        <div class="panel-title">Our Projects</div>
        <div class="scroll-area">
            <div id="projectList">
                <div class="project-row">
                    <div class="project-name">Nixu</div>
                    <div class="project-badge badge-working">Working</div>
                </div>
                <div class="project-row">
                    <div class="project-name">Nixu Legacy</div>
                    <div class="project-badge badge-working">Working</div>
                </div>
                <div class="project-row">
                    <div class="project-name">Nixu Spectral</div>
                    <div class="project-badge badge-working">Working</div>
                </div>
                <div class="project-row">
                    <div class="project-name">Nixu DLC</div>
                    <div class="project-badge badge-patched">Patched</div>
                </div>
                <div class="project-row">
                    <div class="project-name">Ethereos</div>
                    <div class="project-badge badge-working">Working</div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="bottom-nav">
    <span onclick="window.location.href='/'" class="nav-link">Home</span>
    <span onclick="window.location.href='/catalog'" class="nav-link">Catalog</span>
    <span onclick="window.location.href='/obfuscator'" class="nav-link">Obfuscator</span>
    <span onclick="window.location.href='/getkey'" class="nav-link">Authentication</span>
    <span onclick="window.location.href='/status'" class="nav-link active-page">Status</span>
    <span onclick="window.open('https://discord.gg/TRPZg4Xfkq','_blank')" class="nav-link">Discord</span>
</div>

<script>
    window.addEventListener('mousemove', e => {
        document.body.style.setProperty('--x', e.clientX + 'px');
        document.body.style.setProperty('--y', e.clientY + 'px');
    });

    document.getElementById('syncTime').textContent = 'Last sync: ' + new Date().toLocaleTimeString();

    const PC_DATA = [
        {
            label: 'PC Free / Key',
            items: [
                { name: 'Solara',    status: 'working' },
                { name: 'Xeno',      status: 'working' },
                { name: 'Velocity',  status: 'working' },
                { name: 'Pluto',     status: 'unknown' },
                { name: 'Electron',  status: 'unknown' },
                { name: 'Fluxus',    status: 'unknown' },
                { name: 'Comet',     status: 'unknown' },
                { name: 'Valyse',    status: 'unknown' },
                { name: 'LX63',      status: 'unknown' },
                { name: 'JJsploit',  status: 'unknown' },
                { name: 'Ronix',     status: 'unknown' },
                { name: 'Celery',    status: 'unknown' },
                { name: 'Carbon',    status: 'unknown' },
                { name: 'Skisploit', status: 'unknown' },
                { name: 'Drift',     status: 'unknown' },
                { name: 'Bunni',     status: 'unknown' },
                { name: 'Valex',     status: 'unknown' },
                { name: 'Volcano',   status: 'unknown' },
                { name: 'Nihon',     status: 'discontinued' },
                { name: 'OxygenU',   status: 'discontinued' },
                { name: 'KRNL',      status: 'discontinued' },
            ]
        },
        {
            label: 'PC Paid',
            items: [
                { name: 'Synapse Z',   status: 'unknown' },
                { name: 'Swift',       status: 'unknown' },
                { name: 'Seliwave',    status: 'unknown' },
                { name: 'DX9WARE',     status: 'unknown' },
                { name: 'Zenith',      status: 'unknown' },
                { name: 'Potassium',   status: 'unknown' },
                { name: 'Yerba',       status: 'unknown' },
                { name: 'Match',       status: 'unknown' },
                { name: 'Ronin',       status: 'unknown' },
                { name: 'Wave',        status: 'unknown' },
                { name: 'ScriptWare',  status: 'unknown' },
                { name: 'Synapse X',   status: 'discontinued' },
            ]
        },
        {
            label: 'MacOS Free / Key',
            items: [
                { name: 'Ronix',     status: 'unknown' },
                { name: 'MacSploit', status: 'unknown' },
                { name: 'Hydrogen',  status: 'unknown' },
                { name: 'Fluxus',    status: 'discontinued' },
            ]
        }
    ];

    const MOBILE_DATA = [
        {
            label: 'Android Free / Key',
            items: [
                { name: 'Ronix',    status: 'unknown' },
                { name: 'Fluxus',   status: 'unknown' },
                { name: 'Fluxus Z', status: 'unknown' },
                { name: 'Punk X',   status: 'unknown' },
                { name: 'Arceus X', status: 'unknown' },
                { name: 'Codex',    status: 'unknown' },
                { name: 'Delta X',  status: 'unknown' },
                { name: 'Vega X',   status: 'unknown' },
                { name: 'KRNL',     status: 'discontinued' },
            ]
        },
        {
            label: 'Android Paid',
            items: [
                { name: 'NCE',        status: 'unknown' },
                { name: 'ScriptWare', status: 'unknown' },
            ]
        },
        {
            label: 'iOS Free / Key',
            items: [
                { name: 'Ronix',       status: 'unknown' },
                { name: 'Hydrogen',    status: 'unknown' },
                { name: 'iExecutor',   status: 'unknown' },
                { name: 'AppleWare',   status: 'unknown' },
                { name: 'Nihon',       status: 'discontinued' },
                { name: 'KRNL',        status: 'discontinued' },
                { name: 'ScriptWare',  status: 'discontinued' },
            ]
        },
        {
            label: 'iOS Paid',
            items: []
        }
    ];

    const STATUS_LABEL = {
        working: 'Working',
        unknown: 'Unknown',
        dead: 'Dead',
        discontinued: 'Discontinued',
        patched: 'Patched'
    };
    const STATUS_CLASS = {
        working: 's-working',
        unknown: 's-unknown',
        dead: 's-dead',
        discontinued: 's-discontinued',
        patched: 's-patched'
    };

    function renderExploits(data) {
        var list = document.getElementById('exploitList');
        var html = '';
        data.forEach(function(cat) {
            html += '<span class="cat-label">' + cat.label + '</span>';
            cat.items.forEach(function(item) {
                html += '<div class="exploit-row">'
                    + '<span class="' + (STATUS_CLASS[item.status] || '') + '">' + (STATUS_LABEL[item.status] || item.status) + '</span>'
                    + '<span>' + item.name + '</span>'
                    + '</div>';
            });
        });
        list.innerHTML = html;
        list.classList.remove('section-fade');
        void list.offsetWidth;
        list.classList.add('section-fade');
    }

    var currentPlatform = 'pc';

    function setPlatform(val) {
        currentPlatform = val;
        document.getElementById('platPC').classList.toggle('active', val === 'pc');
        document.getElementById('platMobile').classList.toggle('active', val === 'mobile');
        if (val === 'pc') {
            document.getElementById('exploitPanelTitle').textContent = 'PC & MacOS Executors';
            renderExploits(PC_DATA);
        } else {
            document.getElementById('exploitPanelTitle').textContent = 'Mobile Executors';
            renderExploits(MOBILE_DATA);
        }
    }

    setPlatform('pc');
</script>
</body>
</html>
