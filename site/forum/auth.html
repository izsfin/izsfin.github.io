<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makito Forum | Auth</title>
<link rel="icon" type="image/png" href="/site/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #ff0073; --bg: #050204; --border: rgba(255,255,255,0.06); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--bg); color: #d1d1d1; font-family: 'Poppins', sans-serif; min-height: 100vh; overflow-x: hidden; animation: fadeIn 0.35s ease forwards; display: flex; flex-direction: column; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.bg-grid { position: fixed; inset: 0; z-index: -3; background-color: #050204; background-image: linear-gradient(rgba(209,209,209,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(209,209,209,0.04) 1px, transparent 1px); background-size: 40px 40px; }
.bg-svg { position: fixed; inset: 0; z-index: -2; background-image: url("/site/tools/bg.svg"); background-size: cover; background-position: center; opacity: 0.55; }
.bg-fade { position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(5,2,4,0) 0%, rgba(5,2,4,0.85) 100%); }
.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 52px; background: rgba(5,2,4,0.75); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 28px; gap: 8px; }
.topbar-logo { font-size: 11px; font-weight: 800; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-right: 24px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.btn-go { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 7px 18px; border-radius: 8px; border: 1px solid rgba(255,0,115,0.35); background: rgba(255,0,115,0.08); color: var(--primary); cursor: pointer; transition: all 0.2s; text-decoration: none; }
.btn-go:hover { background: var(--primary); color: white; }
.page-center { flex: 1; display: flex; align-items: center; justify-content: center; padding: 72px 20px 100px; position: relative; z-index: 2; }
.auth-wrap { width: 100%; max-width: 360px; }
.auth-brand { text-align: center; margin-bottom: 28px; }
.auth-brand-name { font-size: 18px; font-weight: 800; color: white; letter-spacing: 4px; text-transform: uppercase; }
.auth-brand-sub { font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.2); margin-top: 4px; }
.auth-card { background: rgba(12,8,11,0.9); backdrop-filter: blur(30px); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; padding: 32px 28px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
.discord-btn { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 20px; border-radius: 10px; border: 1px solid rgba(88,101,242,0.4); background: rgba(88,101,242,0.1); color: white; font-family: 'Poppins',sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; text-decoration: none; justify-content: center; }
.discord-btn:hover { background: rgba(88,101,242,0.25); border-color: rgba(88,101,242,0.7); }
.discord-icon { width: 22px; height: 22px; flex-shrink: 0; }
.auth-note { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,0.15); text-align: center; line-height: 1.7; }
.auth-footer { text-align: center; margin-top: 16px; font-size: 9px; font-weight: 700; letter-spacing: 1px; color: rgba(255,255,255,0.15); }
.auth-footer a { color: rgba(255,255,255,0.3); text-decoration: none; transition: color 0.2s; }
.auth-footer a:hover { color: white; }
.bottom-nav { position: fixed; bottom: 25px; left: 25px; background: rgba(5,2,4,0.7); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 12px; padding: 10px 20px; display: flex; gap: 25px; z-index: 10; align-items: center; }
.nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; text-decoration: none; }
.nav-link:hover { color: white; }
.nav-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.1); }
.bottom-credit { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: rgba(255,255,255,0.1); text-transform: uppercase; z-index: 10; white-space: nowrap; }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-svg"></div>
<div class="bg-fade"></div>
<nav class="topbar">
  <a href="/" class="topbar-logo">Makito</a>
  <div class="topbar-right">
    <a href="/" class="btn-go">← Forum</a>
  </div>
</nav>
<div class="page-center">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="auth-brand-name">Makito</div>
      <div class="auth-brand-sub">Forum / Sign In</div>
    </div>
    <div class="auth-card">
      <a href="/auth/discord" class="discord-btn">
        <svg class="discord-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057c.002.022.015.043.03.057a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/>
        </svg>
        Continue with Discord
      </a>
      <div class="auth-note">Your Discord display name will be used as your forum username.<br>No password required.</div>
    </div>
    <div class="auth-footer"><a href="/">← Back to forum</a></div>
  </div>
</div>
<nav class="bottom-nav">
  <a href="/" class="nav-link">Home</a>
  <a href="/catalog" class="nav-link">Catalog</a>
  <a href="/obfuscator" class="nav-link">Obfuscator</a>
  <a href="/getkey" class="nav-link">Auth</a>
  <a href="/status" class="nav-link">Status</a>
  <a href="https://discord.gg/TRPZg4Xfkq" class="nav-link" target="_blank">Discord</a>
</nav>
<div class="bottom-credit">© 2026 Makito. All rights reserved.</div>
<script>
fetch('/forum?action=me').then(r=>r.json()).then(d=>{
  if (d.user) window.location.href = '/';
});
</script>
</body>
</html>
