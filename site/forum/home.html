<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Makito Forum</title>
<link rel="icon" type="image/png" href="/v3/ss/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #ff0073; --bg: #050204; --card: rgba(12,8,11,0.85); --border: rgba(255,255,255,0.06); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background-color: var(--bg); color: #d1d1d1;
  font-family: 'Poppins', sans-serif;
  min-height: 100vh; overflow-x: hidden;
  animation: fadeIn 0.35s ease forwards;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

/* ── BG: grid of squares + svg overlay ── */
.bg-grid {
  position: fixed; inset: 0; z-index: -3;
  background-color: #050204;
  background-image:
    linear-gradient(rgba(209,209,209,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(209,209,209,0.04) 1px, transparent 1px);
  background-size: 40px 40px;
}
.bg-svg {
  position: fixed; inset: 0; z-index: -2;
  background-image: url("/v3/ss/tools/bg.svg");
  background-size: cover; background-position: center;
  opacity: 0.55;
}
.bg-fade {
  position: fixed; inset: 0; z-index: -1;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(5,2,4,0) 0%, rgba(5,2,4,0.85) 100%);
}

/* ── TOPBAR ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: 52px;
  background: rgba(5,2,4,0.75); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 28px; gap: 8px;
}
.topbar-logo { font-size: 11px; font-weight: 800; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-right: 24px; white-space: nowrap; }
.topbar-nav { display: flex; align-items: center; gap: 2px; flex: 1; justify-content: center; }
.topbar-link { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.35); text-decoration: none; padding: 6px 12px; border-radius: 8px; transition: color 0.2s, background 0.2s; cursor: pointer; border: none; background: none; font-family: 'Poppins',sans-serif; }
.topbar-link:hover { color: white; background: rgba(255,255,255,0.05); }
.topbar-sep { color: rgba(255,255,255,0.15); font-size: 12px; margin: 0 2px; }
.topbar-amp { color: rgba(255,255,255,0.15); font-size: 11px; margin: 0 4px; }
.topbar-right { display: flex; align-items: center; gap: 10px; margin-left: 24px; }
.btn-action { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 7px 18px; border-radius: 8px; border: 1px solid rgba(255,0,115,0.35); background: rgba(255,0,115,0.08); color: var(--primary); cursor: pointer; transition: all 0.2s; text-decoration: none; white-space: nowrap; }
.btn-action:hover { background: var(--primary); color: white; border-color: var(--primary); }
.search-wrap { display: flex; align-items: center; gap: 8px; background: rgba(5,2,4,0.6); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; transition: border-color 0.2s; }
.search-wrap:focus-within { border-color: rgba(255,0,115,0.3); }
.search-input { background: none; border: none; outline: none; font-family: 'Poppins',sans-serif; font-size: 11px; color: rgba(255,255,255,0.7); width: 130px; }
.search-input::placeholder { color: rgba(255,255,255,0.2); }
.search-icon { color: rgba(255,255,255,0.2); font-size: 15px; cursor: pointer; }
.user-chip { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: rgba(255,145,207,0.8); text-transform: uppercase; }

/* ── LAYOUT ── */
.main { padding: 68px 24px 90px; max-width: 1100px; margin: 0 auto; position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 260px; gap: 20px; }
@media(max-width: 860px) { .main { grid-template-columns: 1fr; } .sidebar { display: none; } }

/* ── FORUM HEADER ── */
.forum-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 14px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.forum-title { font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.2); }
.forum-meta { display: flex; align-items: center; gap: 20px; }
.forum-meta-item { font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.15); }
.forum-meta-item span { color: rgba(255,255,255,0.4); }

/* ── THREAD ROW ── */
.thread-list { display: flex; flex-direction: column; }
.thread-row {
  display: grid; grid-template-columns: 44px 1fr auto;
  align-items: center; gap: 0;
  border-bottom: 1px solid var(--border);
  text-decoration: none; color: inherit;
  transition: background 0.15s;
  animation: rowIn 0.35s ease both;
}
.thread-row:hover { background: rgba(255,255,255,0.02); }
@keyframes rowIn { from{opacity:0;transform:translateX(-6px)} to{opacity:1;transform:translateX(0)} }

.thread-icon {
  width: 44px; height: 100%; display: flex; align-items: center; justify-content: center;
  border-right: 1px solid var(--border); padding: 16px 0;
}
.thread-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.12); flex-shrink: 0; }
.thread-row:hover .thread-dot { background: var(--primary); }
.thread-row.pinned .thread-dot { background: rgba(255,0,115,0.4); }

.thread-body { padding: 14px 16px; min-width: 0; }
.thread-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 3px; }
.thread-name { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
.thread-row:hover .thread-name { color: white; }
.thread-badge { font-size: 8px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; border: 1px solid rgba(255,0,115,0.3); color: rgba(255,0,115,0.7); flex-shrink: 0; }
.thread-desc { font-size: 10px; color: rgba(255,255,255,0.3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 500px; }
.thread-foot { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
.thread-author { font-size: 9px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,145,207,0.6); }
.thread-date { font-size: 9px; color: rgba(255,255,255,0.15); }

.thread-stats { padding: 14px 20px; display: flex; align-items: center; gap: 18px; flex-shrink: 0; border-left: 1px solid var(--border); }
.stat-col { text-align: center; min-width: 36px; }
.stat-num { font-size: 13px; font-weight: 800; color: rgba(255,255,255,0.5); display: block; }
.stat-lbl { font-size: 8px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.15); }

/* ── LOADING / EMPTY / ERROR ── */
.state-row { padding: 48px 0; text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: rgba(255,255,255,0.12); border-bottom: 1px solid var(--border); }
.state-row.err { color: rgba(248,113,113,0.4); }

/* ── SIDEBAR ── */
.sidebar { display: flex; flex-direction: column; gap: 14px; padding-top: 52px; }
.side-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.side-head { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 9px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.2); }
.side-row { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid rgba(255,255,255,0.03); font-size: 10px; text-decoration: none; color: rgba(255,255,255,0.5); transition: color 0.15s, background 0.15s; }
.side-row:last-child { border-bottom: none; }
.side-row:hover { color: white; background: rgba(255,255,255,0.02); }
.side-num { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.2); }

.side-user { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.side-avatar { width: 28px; height: 28px; border-radius: 7px; background: rgba(255,0,115,0.1); border: 1px solid rgba(255,0,115,0.2); display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800; color: var(--primary); text-transform: uppercase; flex-shrink: 0; }
.side-uname { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.6); }
.side-urole { font-size: 8px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: rgba(255,255,255,0.2); }

/* ── BOTTOM NAV ── */
.bottom-nav { position: fixed; bottom: 25px; left: 25px; background: rgba(5,2,4,0.7); backdrop-filter: blur(20px); border: 1px solid var(--border); border-radius: 12px; padding: 10px 20px; display: flex; gap: 25px; z-index: 10; align-items: center; }
.nav-link { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: rgba(255,255,255,0.4); transition: 0.3s; cursor: pointer; text-decoration: none; }
.nav-link:hover { color: white; }
.nav-link.active-page { color: rgba(255,145,207,0.8); }
.nav-divider { width: 1px; height: 14px; background: rgba(255,255,255,0.1); }
.lang-box { display: flex; gap: 10px; }
.lang-btn { font-size: 10px; font-weight: 800; cursor: pointer; transition: 0.3s; color: rgba(255,255,255,0.2); background: none; border: none; font-family: 'Poppins',sans-serif; }
.lang-btn.active { color: var(--primary); }
.bottom-credit { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: rgba(255,255,255,0.1); text-transform: uppercase; z-index: 10; white-space: nowrap; }

/* ── AUTH PANEL ── */
.auth-panel { position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.65); backdrop-filter: blur(10px); }
.auth-card { background: #0c0809; border: 1px solid var(--border); border-radius: 14px; padding: 28px; width: 100%; max-width: 320px; position: relative; }
.auth-tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
.modal-tab { font-family: 'Poppins',sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 16px; border: none; background: none; color: rgba(255,255,255,0.25); cursor: pointer; transition: color 0.2s; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.modal-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.modal-label { display: block; font-size: 9px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.25); margin-bottom: 6px; margin-top: 2px; }
.modal-input { width: 100%; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px 12px; font-family: 'Poppins',sans-serif; font-size: 12px; color: white; outline: none; transition: border-color 0.2s; margin-bottom: 10px; }
.modal-input:focus { border-color: rgba(255,0,115,0.35); }
.modal-btn { width: 100%; padding: 11px; border-radius: 8px; border: none; background: var(--primary); color: white; font-family: 'Poppins',sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: opacity 0.2s; margin-top: 4px; }
.modal-btn:hover { opacity: 0.85; }
.modal-msg { font-size: 10px; color: rgba(255,145,207,0.8); margin-top: 10px; min-height: 14px; font-weight: 600; }
.modal-msg.err { color: rgba(248,113,113,0.8); }
.modal-msg.ok { color: rgba(74,222,128,0.8); }
.auth-close { display: block; width: 100%; margin-top: 14px; background: none; border: none; cursor: pointer; font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.2); font-family: 'Poppins',sans-serif; transition: color 0.2s; }
.auth-close:hover { color: rgba(255,255,255,0.5); }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-svg"></div>
<div class="bg-fade"></div>

<!-- TOPBAR -->
<nav class="topbar">
  <a href="/" class="topbar-logo">MissLua</a>
  <div class="topbar-nav">
    <button class="topbar-link" id="btn-login" onclick="openAuth('login')">Login</button>
    <span class="topbar-sep">\</span>
    <button class="topbar-link" id="btn-register" onclick="openAuth('register')">Register</button>
    <span class="topbar-amp" id="amp-sep">&amp;</span>
    <button class="topbar-link" id="btn-create" style="display:none" onclick="goCreate()">New Post</button>
    <span class="user-chip" id="user-chip" style="display:none"></span>
  </div>
  <div class="topbar-right">
    <div class="search-wrap">
      <input class="search-input" placeholder="Search posts..." id="searchInput" oninput="handleSearch()">
      <span class="search-icon">⌕</span>
    </div>
  </div>
</nav>

<!-- MAIN -->
<main class="main">
  <div>
    <div class="forum-header">
      <span class="forum-title">All Posts</span>
      <div class="forum-meta">
        <div class="forum-meta-item">Total: <span id="postCount">—</span></div>
      </div>
    </div>
    <div class="thread-list" id="threadList">
      <div class="state-row">Loading...</div>
    </div>
  </div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div id="sideAuth">
      <div class="side-card">
        <div class="side-head">Account</div>
        <div style="padding:14px 14px 12px">
          <div id="side-logged-out">
            <button class="btn-action" style="width:100%;margin-bottom:8px" onclick="openAuth('login')">Login</button>
            <button onclick="openAuth('register')" style="width:100%;padding:8px;background:none;border:1px solid var(--border);border-radius:8px;font-family:Poppins,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);cursor:pointer;transition:all 0.2s" onmouseover="this.style.color='white'" onmouseout="this.style.color='rgba(255,255,255,0.3)'">Register</button>
          </div>
          <div id="side-logged-in" style="display:none">
            <div class="side-user" style="padding:0 0 10px">
              <div class="side-avatar" id="side-avatar">—</div>
              <div><div class="side-uname" id="side-uname">—</div><div class="side-urole">Member</div></div>
            </div>
            <button class="btn-action" style="width:100%;margin-bottom:8px" onclick="goCreate()">+ New Post</button>
            <button onclick="doLogout()" style="width:100%;padding:8px;background:none;border:1px solid var(--border);border-radius:8px;font-family:Poppins,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.2);cursor:pointer;transition:all 0.2s" onmouseover="this.style.color='rgba(248,113,113,0.7)'" onmouseout="this.style.color='rgba(255,255,255,0.2)'">Log out</button>
          </div>
        </div>
      </div>
    </div>

    <div class="side-card">
      <div class="side-head">Navigation</div>
      <a href="/" class="side-row">Home <span class="side-num">→</span></a>
      <a href="/catalog" class="side-row">Catalog <span class="side-num">→</span></a>
      <a href="/obfuscator" class="side-row">Obfuscator <span class="side-num">→</span></a>
      <a href="/getkey" class="side-row">Authentication <span class="side-num">→</span></a>
      <a href="/status" class="side-row">Status <span class="side-num">→</span></a>
      <a href="https://discord.gg/TRPZg4Xfkq" class="side-row" target="_blank">Discord <span class="side-num">↗</span></a>
    </div>
  </aside>
</main>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <a href="/" class="nav-link">Home</a>
  <a href="/catalog" class="nav-link">Catalog</a>
  <a href="/obfuscator" class="nav-link">Obfuscator</a>
  <a href="/getkey" class="nav-link">Auth</a>
  <a href="/status" class="nav-link">Status</a>
  <a href="https://discord.gg/TRPZg4Xfkq" class="nav-link" target="_blank">Discord</a>
  <div class="nav-divider"></div>
  <div class="lang-box">
    <button class="lang-btn active" onclick="setLang('RU')">RU</button>
    <button class="lang-btn" onclick="setLang('EN')">EN</button>
  </div>
</nav>
<div class="bottom-credit">© 2026 MissLua. All rights reserved.</div>

<!-- AUTH PANEL -->
<div class="auth-panel" id="authPanel" style="display:none">
  <div class="auth-card">
    <div class="auth-tabs">
      <button class="modal-tab active" id="tab-login" onclick="switchTab('login')">Login</button>
      <button class="modal-tab" id="tab-register" onclick="switchTab('register')">Register</button>
    </div>
    <div id="form-login">
      <label class="modal-label">Username</label>
      <input class="modal-input" id="login-user" placeholder="your_username" autocomplete="username">
      <label class="modal-label">Password</label>
      <input class="modal-input" type="password" id="login-pass" placeholder="••••••••">
      <button class="modal-btn" onclick="doLogin()">Login</button>
      <div class="modal-msg" id="login-msg"></div>
    </div>
    <div id="form-register" style="display:none">
      <label class="modal-label">Username</label>
      <input class="modal-input" id="reg-user" placeholder="your_username" autocomplete="username">
      <label class="modal-label">Password</label>
      <input class="modal-input" type="password" id="reg-pass" placeholder="min 8 chars">
      <button class="modal-btn" onclick="doRegister()">Create Account</button>
      <div class="modal-msg" id="reg-msg"></div>
    </div>
    <button class="auth-close" onclick="closeAuth()">✕ close</button>
  </div>
</div>

<script>
// ── SESSION ──
let currentUser = null;
try { currentUser = JSON.parse(localStorage.getItem('nq-docs-user') || 'null'); } catch(e) {}

function updateUI() {
  if (currentUser) {
    document.getElementById('btn-login').style.display = 'none';
    document.getElementById('btn-register').style.display = 'none';
    document.getElementById('btn-create').style.display = '';
    document.getElementById('user-chip').style.display = '';
    document.getElementById('user-chip').textContent = currentUser.username;
    document.getElementById('side-logged-out').style.display = 'none';
    document.getElementById('side-logged-in').style.display = '';
    document.getElementById('side-uname').textContent = currentUser.username;
    document.getElementById('side-avatar').textContent = currentUser.username.slice(0,2).toUpperCase();
  }
}
updateUI();

function doLogout() {
  localStorage.removeItem('nq-docs-user');
  currentUser = null;
  location.reload();
}

// ── MODAL ──
function openAuth(tab) { document.getElementById('authPanel').style.display='flex'; switchTab(tab||'login'); }
function closeAuth() { document.getElementById('authPanel').style.display='none'; }
function switchTab(tab) {
  document.getElementById('form-login').style.display = tab==='login' ? '' : 'none';
  document.getElementById('form-register').style.display = tab==='register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active', tab==='login');
  document.getElementById('tab-register').classList.toggle('active', tab==='register');
}
document.getElementById('authPanel').addEventListener('click', e => { if(e.target===e.currentTarget) closeAuth(); });

// ── AUTH ──
async function doLogin() {
  const u = document.getElementById('login-user').value.trim();
  const p = document.getElementById('login-pass').value;
  const msg = document.getElementById('login-msg');
  if (!u || !p) { msg.textContent='Fill all fields'; msg.className='modal-msg err'; return; }
  msg.textContent='wait...'; msg.className='modal-msg';
  try {
    const r = await fetch('/forum?action=auth', {
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subaction: currentTab, username: u, password: p })
    });
    const d = await r.json();
    if (d.ok) {
      currentUser = {username: d.username||u, token: d.token||''};
      localStorage.setItem('nq-docs-user', JSON.stringify(currentUser));
      msg.textContent='Welcome back!'; msg.className='modal-msg ok';
      setTimeout(() => { closeAuth(); updateUI(); }, 600);
    } else { msg.textContent=d.error||'Error'; msg.className='modal-msg err'; }
  } catch(e) { msg.textContent='Network error'; msg.className='modal-msg err'; }
}

async function doRegister() {
  const u = document.getElementById('reg-user').value.trim();
  const p = document.getElementById('reg-pass').value;
  const msg = document.getElementById('reg-msg');
  if (!u || !p) { msg.textContent='Fill all fields'; msg.className='modal-msg err'; return; }
  if (p.length < 8) { msg.textContent='Password min 8 chars'; msg.className='modal-msg err'; return; }
  msg.textContent='wait...'; msg.className='modal-msg';
  try {
    const r = await fetch('/forum?action=auth', {
      method: 'POST', 
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ subaction: currentTab, username: u, password: p })
    });
    const d = await r.json();
    if (d.ok) {
      currentUser = {username: d.username||u, token: d.token||''};
      localStorage.setItem('nq-docs-user', JSON.stringify(currentUser));
      msg.textContent='Account created!'; msg.className='modal-msg ok';
      setTimeout(() => { closeAuth(); updateUI(); }, 600);
    } else { msg.textContent=d.error||'Error'; msg.className='modal-msg err'; }
  } catch(e) { msg.textContent='Network error'; msg.className='modal-msg err'; }
}

function goCreate() { window.location.href = '/create'; }

// ── POSTS ──
let allPosts = [];

async function loadPosts() {
  try {
    const r = await fetch('/forum?action=posts');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    allPosts = Array.isArray(d.posts) ? d.posts : [];
    renderPosts(allPosts);
  } catch(e) {
    document.getElementById('threadList').innerHTML = '<div class="state-row err">Could not connect to server</div>';
  }
}

function renderPosts(posts) {
  document.getElementById('postCount').textContent = posts.length + ' post' + (posts.length !== 1 ? 's' : '');
  if (!posts.length) {
    document.getElementById('threadList').innerHTML = '<div class="state-row">No posts yet</div>';
    return;
  }
  document.getElementById('threadList').innerHTML = posts.map((p, i) => `
    <a class="thread-row${p.pinned?' pinned':''}" href="/post/${encodeURIComponent(p.id)}" style="animation-delay:${i*0.03}s">
      <div class="thread-icon"><div class="thread-dot"></div></div>
      <div class="thread-body">
        <div class="thread-top">
          <span class="thread-name">${esc(p.name)}</span>
          ${p.pinned ? '<span class="thread-badge">Pinned</span>' : ''}
        </div>
        <div class="thread-desc">${esc(p.desc)}</div>
        <div class="thread-foot">
          <span class="thread-author">${esc(p.author)}</span>
          <span class="thread-date">${p.date||''}</span>
        </div>
      </div>
      <div class="thread-stats">
        <div class="stat-col">
          <span class="stat-num">${p.views||0}</span>
          <span class="stat-lbl">Views</span>
        </div>
        <div class="stat-col">
          <span class="stat-num">${p.comments||0}</span>
          <span class="stat-lbl">Replies</span>
        </div>
      </div>
    </a>
  `).join('');
}

// ── SEARCH ──
function handleSearch() {
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  if (!q) { renderPosts(allPosts); return; }
  if (q.startsWith('@')) {
    renderPosts(allPosts.filter(p => p.author.toLowerCase().includes(q.slice(1))));
  } else {
    renderPosts(allPosts.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.desc.toLowerCase().includes(q) ||
      (p.text||'').toLowerCase().includes(q)
    ));
  }
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function setLang(l) { document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.textContent===l)); }

loadPosts();
</script>
</body>
</html>
