<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Makito Forum | New Post</title>
<link rel="icon" type="image/png" href="/site/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --primary: #ff0073; --bg: #050204; --border: rgba(255,255,255,0.06); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--bg); color: #d1d1d1; font-family: 'Poppins', sans-serif; height: 100vh; overflow: hidden; animation: fadeIn 0.35s ease forwards; display: flex; flex-direction: column; }
@keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.bg-grid { position: fixed; inset: 0; z-index: -3; background-color: #050204; background-image: linear-gradient(rgba(209,209,209,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(209,209,209,0.04) 1px, transparent 1px); background-size: 40px 40px; }
.bg-svg { position: fixed; inset: 0; z-index: -2; background-image: url("/site/tools/bg.svg"); background-size: cover; background-position: center; opacity: 0.55; }
.bg-fade { position: fixed; inset: 0; z-index: -1; background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(5,2,4,0) 0%, rgba(5,2,4,0.85) 100%); }
.topbar { flex-shrink: 0; height: 52px; background: rgba(5,2,4,0.75); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 28px; gap: 8px; position: relative; z-index: 10; }
.topbar-logo { font-size: 11px; font-weight: 800; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; text-decoration: none; margin-right: 24px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.btn-go { font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 7px 18px; border-radius: 8px; border: 1px solid rgba(255,0,115,0.35); background: rgba(255,0,115,0.08); color: var(--primary); cursor: pointer; transition: all 0.2s; text-decoration: none; }
.btn-go:hover { background: var(--primary); color: white; }
.user-chip { font-size: 10px; font-weight: 700; letter-spacing: 1px; color: rgba(255,145,207,0.8); text-transform: uppercase; }
.editor-layout { flex: 1; display: grid; grid-template-columns: 280px 1fr 200px; min-height: 0; position: relative; z-index: 2; }
.col-left { border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; background: rgba(5,2,4,0.3); }
.col-left-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); font-size: 9px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.2); }
.preview-card { margin: 12px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: rgba(12,8,11,0.8); }
.preview-card-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.preview-author { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,145,207,0.7); }
.preview-img-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; transition: background 0.2s; }
.preview-img-wrap:hover { background: rgba(255,255,255,0.04); }
.preview-img-wrap img { width: 100%; height: 100%; object-fit: cover; display: none; }
.preview-img-wrap img.loaded { display: block; }
.upload-label { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
.upload-icon { font-size: 18px; opacity: 0.2; }
.upload-text { font-size: 8px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.2); }
#imgInput { display: none; }
.field-name { background: none; border: none; outline: none; font-family: 'Poppins',sans-serif; font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.6); padding: 10px 12px 4px; width: 100%; }
.field-name::placeholder { color: rgba(255,255,255,0.18); }
.field-desc { background: none; border: none; outline: none; resize: none; font-family: 'Poppins',sans-serif; font-size: 10px; color: rgba(255,255,255,0.35); padding: 0 12px 10px; width: 100%; min-height: 36px; line-height: 1.5; }
.field-desc::placeholder { color: rgba(255,255,255,0.12); }
.publish-area { padding: 12px; border-top: 1px solid var(--border); margin-top: auto; }
.publish-btn { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid rgba(255,0,115,0.35); background: rgba(255,0,115,0.08); color: var(--primary); font-family: 'Poppins',sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
.publish-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }
.publish-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.publish-msg { font-size: 10px; font-weight: 600; text-align: center; color: rgba(255,145,207,0.8); min-height: 16px; margin-top: 6px; }
.publish-msg.err { color: rgba(248,113,113,0.8); }
.publish-msg.ok { color: rgba(74,222,128,0.8); }
.col-editor { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
.editor-toolbar { flex-shrink: 0; padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; background: rgba(5,2,4,0.3); }
.tb-btn { font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.07); background: none; color: rgba(255,255,255,0.3); cursor: pointer; transition: all 0.15s; font-family: 'Poppins',sans-serif; }
.tb-btn:hover { color: white; border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.04); }
.tb-sep { width: 1px; height: 14px; background: rgba(255,255,255,0.07); margin: 0 2px; }
.editor-textarea { flex: 1; background: transparent; border: none; outline: none; resize: none; font-family: 'Poppins',sans-serif; font-size: 12px; line-height: 1.85; color: rgba(255,255,255,0.7); padding: 20px 24px; }
.editor-textarea::placeholder { color: rgba(255,255,255,0.1); }
.col-right { display: flex; flex-direction: column; padding: 14px; background: rgba(5,2,4,0.3); overflow-y: auto; }
.col-right-head { font-size: 9px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: rgba(255,255,255,0.15); margin-bottom: 12px; }
.help-item { margin-bottom: 10px; }
.help-syntax { font-size: 10px; font-family: 'Courier New',monospace; color: rgba(255,145,207,0.5); margin-bottom: 2px; }
.help-desc { font-size: 9px; color: rgba(255,255,255,0.2); }
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-svg"></div>
<div class="bg-fade"></div>
<nav class="topbar">
  <a href="/" class="topbar-logo">Makito</a>
  <div style="flex:1;display:flex;align-items:center;justify-content:center">
    <span class="user-chip" id="user-chip"></span>
  </div>
  <div class="topbar-right">
    <a href="/" class="btn-go">← Forum</a>
  </div>
</nav>
<div class="editor-layout">
  <div class="col-left">
    <div class="col-left-head">Post Preview</div>
    <div class="preview-card">
      <div class="preview-card-top">
        <span class="preview-author" id="previewAuthor">—</span>
      </div>
      <div class="preview-img-wrap" id="imgWrap" onclick="document.getElementById('imgInput').click()">
        <img id="previewImg" src="" alt="">
        <div class="upload-label" id="uploadLabel">
          <span class="upload-icon">⬆</span>
          <span class="upload-text">Click to upload</span>
        </div>
      </div>
      <input type="file" id="imgInput" accept="image/*" onchange="handleImg(this)">
      <input type="text" class="field-name" id="field-name" placeholder="Post title...">
      <textarea class="field-desc" id="field-desc" placeholder="Short description..." rows="2"></textarea>
    </div>
    <div class="publish-area">
      <button class="publish-btn" id="publishBtn" onclick="doPublish()">Publish Post</button>
      <div class="publish-msg" id="publishMsg"></div>
    </div>
  </div>
  <div class="col-editor">
    <div class="editor-toolbar">
      <button class="tb-btn" onclick="wrap('**','**')"><b>B</b></button>
      <button class="tb-btn" onclick="wrap('*','*')"><i>I</i></button>
      <button class="tb-btn" onclick="wrap('__','__')"><u>U</u></button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="insertLine('# ')">H1</button>
      <button class="tb-btn" onclick="insertLine('## ')">H2</button>
      <button class="tb-btn" onclick="insertLine('### ')">H3</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="insertLine('> ')">❝</button>
      <button class="tb-btn" onclick="wrap('`','`')">code</button>
      <button class="tb-btn" onclick="wrap('\`\`\`\n','\n\`\`\`')">block</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" onclick="insertLine('* ')">• list</button>
      <button class="tb-btn" onclick="wrap('||','||')">spoiler</button>
      <button class="tb-btn" onclick="insertLink()">[link]</button>
    </div>
    <textarea class="editor-textarea" id="field-text" placeholder="Write your post here..."></textarea>
  </div>
  <div class="col-right">
    <div class="col-right-head">Formatting</div>
    <div class="help-item"><div class="help-syntax">**text**</div><div class="help-desc">Bold</div></div>
    <div class="help-item"><div class="help-syntax">*text*</div><div class="help-desc">Italic</div></div>
    <div class="help-item"><div class="help-syntax">__text__</div><div class="help-desc">Underline</div></div>
    <div class="help-item"><div class="help-syntax"># Heading</div><div class="help-desc">H1 / H2 / H3</div></div>
    <div class="help-item"><div class="help-syntax">> quote</div><div class="help-desc">Blockquote</div></div>
    <div class="help-item"><div class="help-syntax">`code`</div><div class="help-desc">Inline code</div></div>
    <div class="help-item"><div class="help-syntax">```block```</div><div class="help-desc">Code block</div></div>
    <div class="help-item"><div class="help-syntax">* item</div><div class="help-desc">List item</div></div>
    <div class="help-item"><div class="help-syntax">||spoiler||</div><div class="help-desc">Spoiler</div></div>
    <div class="help-item"><div class="help-syntax">[text](url)</div><div class="help-desc">Link</div></div>
  </div>
</div>
<script>
let currentUser = null;
let imgBase64 = null;

async function initSession() {
  try {
    const r = await fetch('/forum?action=me');
    const d = await r.json();
    currentUser = d.user || null;
  } catch(e) {}
  if (!currentUser) {
    window.location.href = '/auth';
    return;
  }
  document.getElementById('previewAuthor').textContent = currentUser.username;
  document.getElementById('user-chip').textContent = currentUser.username;
}

function handleImg(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 3*1024*1024) { setMsg('Image too large (max 3MB)', 'err'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    imgBase64 = e.target.result;
    const img = document.getElementById('previewImg');
    img.src = imgBase64;
    img.classList.add('loaded');
    document.getElementById('uploadLabel').style.display = 'none';
  };
  reader.readAsDataURL(file);
}

function getTA() { return document.getElementById('field-text'); }
function wrap(before, after) {
  const ta = getTA(), s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s,e);
  ta.setRangeText(before+(sel||'text')+after, s, e, 'end');
  ta.focus();
}
function insertLine(prefix) {
  const ta = getTA(), s = ta.selectionStart;
  const lineStart = ta.value.slice(0,s).lastIndexOf('\n')+1;
  ta.setRangeText(prefix, lineStart, lineStart, 'start');
  ta.focus();
}
function insertLink() {
  const ta = getTA(), s = ta.selectionStart, e = ta.selectionEnd;
  const sel = ta.value.slice(s,e)||'text';
  ta.setRangeText(`[${sel}](url)`, s, e, 'end');
  ta.focus();
}

function setMsg(text, type) {
  const el = document.getElementById('publishMsg');
  el.textContent = text;
  el.className = 'publish-msg'+(type?' '+type:'');
}

async function doPublish() {
  const title = document.getElementById('field-name').value.trim();
  const description = document.getElementById('field-desc').value.trim();
  const content = document.getElementById('field-text').value.trim();
  if (!title || !content) { setMsg('Fill in title and content', 'err'); return; }
  const btn = document.getElementById('publishBtn');
  btn.disabled = true;
  setMsg('Publishing...', '');
  try {
    const r = await fetch('/forum?action=create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, description, content, img: imgBase64||null })
    });
    const d = await r.json();
    if (d.ok) {
      setMsg('Published!', 'ok');
      setTimeout(() => { window.location.href = `/forum/post?id=${encodeURIComponent(d.id)}`; }, 800);
    } else { setMsg(d.error||'Error', 'err'); btn.disabled=false; }
  } catch(e) { setMsg('Network error', 'err'); btn.disabled=false; }
}

initSession();
</script>
</body>
</html>
